/* ===== alert skins (gift + follow) ===== */
.al[class*=" sk-"],.fa-skin{isolation:isolate;overflow:hidden}
.fa-skin{padding:.45em 1em .45em .45em;border-radius:99em}
.sk-fire{color:#fff;background:linear-gradient(90deg,#3a0900,#120300);border:.07em solid #ff6a1a;box-shadow:0 0 .8em #ff5a00}
.sk-fire::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.85;background:radial-gradient(ellipse 25% 90% at 10% 135%,#ff6a00,transparent 70%),radial-gradient(ellipse 22% 80% at 35% 140%,#ffd000,transparent 70%),radial-gradient(ellipse 25% 90% at 60% 135%,#ff3d00,transparent 70%),radial-gradient(ellipse 22% 80% at 85% 140%,#ffb300,transparent 70%);background-size:200% 100%;animation:flm 1.6s ease-in-out infinite alternate}
.sk-fire .gi{background:rgba(255,120,0,.25)}
.sk-galaxy{color:#fff;background:radial-gradient(circle at 10% 0,#5b23b8,transparent 60%),radial-gradient(circle at 100% 100%,#c2187a,transparent 55%),#070418;border:.06em solid #a77bff;box-shadow:0 0 .9em rgba(167,123,255,.6)}
.sk-galaxy::before{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(.05em .05em at 8% 25%,#fff 60%,transparent),radial-gradient(.04em .04em at 25% 75%,#fff 60%,transparent),radial-gradient(.06em .06em at 45% 30%,#fff 60%,transparent),radial-gradient(.04em .04em at 62% 80%,#fff 60%,transparent),radial-gradient(.05em .05em at 78% 20%,#fff 60%,transparent),radial-gradient(.04em .04em at 92% 60%,#fff 60%,transparent);animation:twk 1.8s ease-in-out infinite alternate}
.sk-galaxy b{text-shadow:0 0 .4em #c58bff}
.sk-vip{color:#fff;background:linear-gradient(160deg,#1d1606,#000 60%,#1a1408);box-shadow:0 0 0 .07em #d4af37,inset 0 0 0 .2em #000,inset 0 0 0 .26em rgba(212,175,55,.55),0 .3em 1em rgba(0,0,0,.6)}
.sk-vip b{background:linear-gradient(90deg,#b8871f,#fff6d0,#d4af37,#fff6d0,#b8871f);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:vsh 2.5s linear infinite}
.sk-vip .gi{background:rgba(212,175,55,.15);box-shadow:inset 0 0 0 .06em #d4af37}
.sk-crystal{color:#fff;border:.1em solid transparent;background:linear-gradient(rgba(14,12,30,.85),rgba(14,12,30,.85)) padding-box,linear-gradient(90deg,#ff7ad9,#7afcff,#fff27a,#ff7ad9,#7afcff) border-box;box-shadow:0 0 .8em rgba(122,252,255,.45)}
.sk-crystal::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.25) 45%,rgba(122,252,255,.3) 50%,rgba(255,122,217,.25) 55%,transparent 70%);background-size:250% 100%;animation:vsh 2.2s linear infinite}
.sk-tiktok{color:#fff;background:#121212;box-shadow:-.15em 0 0 #25f4ee,.15em 0 0 #fe2c55,0 .3em 1em rgba(0,0,0,.5)}
.sk-tiktok b{text-shadow:-.06em 0 #25f4ee,.06em 0 #fe2c55}
.sk-gamer{color:#fff;border-radius:0!important;padding-inline:1.1em!important;clip-path:polygon(.8em 0,100% 0,calc(100% - .8em) 100%,0 100%);background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 .08em,transparent .08em .2em),linear-gradient(90deg,#062a1f,rgba(8,10,18,.95));font-family:var(--body)}
.sk-gamer::before{content:"";position:absolute;inset-block:0;inset-inline-end:0;width:.35em;background:#00ffa3;box-shadow:0 0 .6em #00ffa3}
.sk-gamer b{color:#00ffa3;font-style:italic;text-transform:uppercase;text-shadow:0 0 .35em #00ffa3}
.sk-gamer .gi,.sk-gamer .fav{border-radius:.2em!important;box-shadow:0 0 0 .08em #00ffa3}
.sk-neon{color:#fff;background:rgba(5,6,20,.9);border:.08em solid #22e6ff;box-shadow:0 0 .6em #22e6ff,inset 0 0 .5em rgba(34,230,255,.5)}
.sk-neon::before{content:"";position:absolute;inset:0;z-index:-1;background:rgba(5,6,20,.9);animation:nfl 2.4s infinite}
.sk-neon b{text-shadow:0 0 .3em #ff4fd8,0 0 .7em #ff4fd8}
@keyframes nfl{0%,18%,22%,62%,64%,100%{opacity:0}20%,63%{opacity:.7}}
.sk-glass{color:#fff;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);border:.06em solid rgba(255,255,255,.45);box-shadow:0 .3em 1em rgba(0,0,0,.25)}
/* structural gift alerts */
.ga{position:relative;display:flex;align-items:center;gap:.5em;font-size:.8em;color:#fff;max-width:100%}
.ga.out{animation:a-out .4s ease forwards}
.ga .gimg{display:grid;place-items:center;width:2.6em;height:2.6em;flex:none}
.ga .gimg img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 .1em .3em rgba(0,0,0,.6))}
.ga .ftx{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.ga .ftx b{font-family:var(--display);font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:12em}
.ga .ftx small{font-size:.72em;opacity:.92}
.ga-spot{flex-direction:column;text-align:center;gap:.2em}
.ga-spot .gsr{position:relative;width:5em;height:5em;display:grid;place-items:center}
.ga-spot .rays{position:absolute;inset:-30%;border-radius:50%;background:repeating-conic-gradient(color-mix(in srgb,var(--a1) 70%,transparent) 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);mask:radial-gradient(circle,#000 20%,transparent 70%);animation:spin 6s linear infinite}
.ga-spot .gimg{position:relative;width:3.6em;height:3.6em}
.ga-spot .ftx{align-items:center;background:var(--pn);border:.06em solid var(--a1);border-radius:99em;padding:.2em 1em}
.ga-spot em{font-style:normal;font-family:var(--display);font-size:1.3em;color:var(--a2);text-shadow:0 0 .4em var(--a1);margin-top:-.2em}
.ga-combo{background:linear-gradient(90deg,var(--pn),transparent);border-inline-start:.2em solid var(--a3);padding:.35em .6em;border-radius:.5em}
.ga-combo .cx{font-style:normal;font-family:var(--display);font-size:2em;line-height:1;color:var(--a3);text-shadow:0 0 .3em var(--a3),0 .05em 0 #000;animation:cxp .9s cubic-bezier(.2,1.6,.4,1) both .25s}
@keyframes cxp{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.35) rotate(6deg);opacity:1}100%{transform:none}}
.ga-laurel{flex-direction:column;text-align:center;gap:.3em;--w1:var(--a1)}
.ga-laurel .wf{width:4em}
.ga-laurel .gbad{position:absolute;z-index:3;bottom:-.1em;right:-.2em;width:1.5em;height:1.5em;border-radius:50%;background:var(--pn);border:.08em solid var(--a1);display:grid;place-items:center;overflow:hidden}
.ga-laurel .gbad img{width:85%;height:85%;object-fit:contain}
.ga-laurel .ftx{align-items:center;background:var(--pn);border:.08em solid var(--a1);padding:.22em 1em;border-radius:99em}
.ga.big{filter:drop-shadow(0 0 .6em var(--a1))}
/* structural follow alerts */
.fa-stamp{flex-direction:column;text-align:center;gap:.35em}
.fa-stamp .stw{position:relative;width:3.6em;height:3.6em;display:grid;place-items:center}
.fa-stamp .stw::before{content:"";position:absolute;inset:-.25em;border-radius:50%;border:.14em dashed var(--fc);animation:spin 8s linear infinite}
.fa-stamp .fav{width:100%;height:100%;box-shadow:0 0 .8em var(--fc)}
.fa-stamp .p1{position:absolute;top:-.3em;left:-.6em;font-family:var(--display);font-size:1.1em;color:var(--fc);text-shadow:0 0 .3em #000;transform:rotate(-14deg);animation:cxp .8s cubic-bezier(.2,1.6,.4,1) both .3s}
.fa-stamp .ftx{align-items:center;background:var(--pn);border:.06em solid var(--fc);padding:.2em 1em;border-radius:.4em}
.fa-confetti{flex-direction:column;text-align:center;gap:.35em}
.fa-confetti .cw{position:relative;width:3.4em;height:3.4em}
.fa-confetti .fav{width:100%;height:100%;border:.12em solid #fff;box-shadow:0 0 .8em var(--fc)}
.fa-confetti .cw i{position:absolute;top:45%;left:45%;width:.35em;height:.55em;border-radius:.08em;background:var(--c);animation:cnf 1.4s cubic-bezier(.1,.8,.3,1) both;animation-delay:var(--d)}
@keyframes cnf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
.fa-confetti .ftx{align-items:center;background:linear-gradient(90deg,#ff4f7b,#ffb84f,#4fd8ff);padding:.22em 1em;border-radius:99em;text-shadow:0 .05em .2em rgba(0,0,0,.4)}

/* quick sounds */
.qsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.qst{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);min-width:0}
.qst.set{border-color:var(--em);box-shadow:0 0 0 1px color-mix(in srgb,var(--em) 40%,transparent)}
.qst .qh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.qst .qh .qe{font-size:24px;line-height:1}
.qst .qh small{margin-inline-start:auto;color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
.qst .qr{display:flex;gap:6px;min-width:0}
.qst select{flex:1;min-width:0}
.qsec{margin:14px 0 8px;font-size:14px;font-weight:700}
/* ===== patch22: alert scene library ===== */
.scq{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.scn{--sc:#ff4fd8;--dur:4.5s;position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;animation:scOut .6s ease var(--dur) forwards}
@keyframes scOut{to{opacity:0;transform:scale(1.04)}}
/* وضع الأداء: يخفف الرسم في البث */
body.golive .stage.mini *,body.golive .stage.mini *::before,body.golive .stage.mini *::after{animation-play-state:paused!important}
body.golive .bst:hover .stage.mini *,body.golive .bst:hover .stage.mini *::before,body.golive .bst:hover .stage.mini *::after{animation-play-state:running!important}
body.lite .scq *,body.lite .scq *::before,body.lite .scq *::after{filter:none!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;mix-blend-mode:normal!important}
body.lite .wi *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body.lite .scn .sc-h{text-shadow:0 .08em 0 #000!important}body.lite .scn .sc-av{box-shadow:0 0 0 .12em var(--sc)!important}body.lite .scn .sc-n,body.lite .scn .sc-s{box-shadow:none!important}
body.lite .scn{animation-name:scOutL}@keyframes scOutL{to{opacity:0}}
body.lite .scn,body.lite .sc-c{will-change:opacity,transform}
.scwarm{position:absolute;inset:0;opacity:.002;pointer-events:none;overflow:hidden}
.scn>*{position:absolute}
.sc-c{position:relative!important;z-index:5;display:flex;flex-direction:column;align-items:center;gap:.35em;text-align:center;max-width:92%}
.sc-h{font-family:var(--display);font-size:2em;line-height:1.1;color:#fff;-webkit-text-stroke:.05em #000;paint-order:stroke fill;text-shadow:0 .08em 0 #000,0 0 .5em var(--sc);animation:scSlam .5s cubic-bezier(.2,1.6,.4,1) .15s both}
.sc-av{width:4.2em;height:4.2em;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-weight:900;font-size:1em;color:#1a1322;border:.18em solid #fff;box-shadow:0 0 0 .1em var(--sc),0 0 1.2em var(--sc);animation:scPop .55s cubic-bezier(.2,1.5,.4,1) both}
.sc-av img{width:100%;height:100%;object-fit:cover}
.sc-n{font-family:var(--display);font-size:1.35em;color:#fff;background:rgba(0,0,0,.65);padding:.1em .8em;border-radius:99em;border:.08em solid var(--sc);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:scUp .45s ease .35s both}
.sc-s{display:flex;align-items:center;gap:.3em;font-size:.85em;font-weight:800;color:#fff;background:rgba(0,0,0,.55);padding:.15em .8em;border-radius:.4em;animation:scUp .45s ease .5s both}
.sc-s img{width:1.6em;height:1.6em;object-fit:contain}
@keyframes scSlam{0%{transform:scale(3);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:none}}
@keyframes scPop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:none}}
@keyframes scUp{from{transform:translateY(1em);opacity:0}}
@keyframes scFade{from{opacity:0}}
@keyframes scShake{0%,100%{transform:none}20%{transform:translate(-.15em,.1em)}40%{transform:translate(.15em,-.1em)}60%{transform:translate(-.1em,-.1em)}80%{transform:translate(.1em,.15em)}}
.scn .p{position:absolute;left:var(--x0,50%);top:var(--y0,50%);font-style:normal;line-height:1}
/* loop (gallery previews) */
.scn.loop{animation:none}
.scn.loop *,.scn.loop *::before,.scn.loop *::after{animation-iteration-count:infinite!important}
/* anime: speed lines */
.scn-speedlines{--sc:#ffd23f;background:radial-gradient(circle,rgba(255,210,63,.35),rgba(0,0,0,.55) 70%)}
.scn-speedlines .sl{inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.95) 0 .5deg,transparent .5deg 5deg);-webkit-mask:radial-gradient(circle,transparent 16%,#000 42%);mask:radial-gradient(circle,transparent 16%,#000 42%);animation:slr .16s steps(2) infinite,scFade .2s both}
@keyframes slr{to{transform:rotate(2.5deg)}}
.scn-speedlines .sc-av{animation:slz .45s cubic-bezier(.2,1.4,.4,1) both,scShake .3s .45s 2}
@keyframes slz{from{transform:scale(5);opacity:0}}
/* anime: impact frame */
.scn-impact{--sc:#fff}
.scn-impact .imf{inset:0;animation:imf .7s steps(1) both}
@keyframes imf{0%{background:#fff}12%{background:#000}24%{background:#fff}36%{background:#000}48%,100%{background:transparent}}
.scn-impact .crk{inset:0;width:100%;height:100%;animation:scFade .1s .35s both}
.scn-impact .sc-c{animation:scShake .25s .4s 3}
.scn-impact .sc-h{color:#000;-webkit-text-stroke:.06em #fff;text-shadow:.1em .1em 0 #fff}
/* anime: kawaii sparkle */
.scn-sparkle{--sc:#ff7ac3;background:radial-gradient(circle,rgba(255,170,220,.55),rgba(255,120,190,.15) 50%,transparent 75%)}
.scn-sparkle .p{color:#fff;text-shadow:0 0 .3em #ff7ac3,0 0 .6em #ffd1ec;font-size:var(--s,1.4em);animation:spk 1.2s ease-in-out var(--d) infinite both}
@keyframes spk{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
.scn-sparkle .bb2{left:var(--x0);bottom:-2em;width:var(--s);height:var(--s);border-radius:50%;border:.08em solid rgba(255,255,255,.8);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),rgba(255,180,220,.15));animation:bub 3s ease-in var(--d) both}
@keyframes bub{to{transform:translateY(-60em)}}
.scn-sparkle .sc-h{color:#fff;-webkit-text-stroke:.05em #e0408f;text-shadow:0 0 .4em #ff7ac3}
.scn-sparkle .sc-av{border-color:#ffd1ec}
/* anime: power up aura */
.scn-powerup{--sc:#ffcc00;background:radial-gradient(circle at 50% 55%,rgba(255,180,0,.35),rgba(0,0,0,.5) 65%)}
.scn-powerup .aura{left:50%;top:50%;width:16em;height:22em;margin:-13em 0 0 -8em;border-radius:50% 50% 45% 45%;background:radial-gradient(ellipse at 50% 70%,rgba(255,255,200,.95),rgba(255,200,0,.85) 30%,rgba(255,120,0,.5) 50%,transparent 70%);filter:blur(.4em);animation:aur .18s ease-in-out infinite alternate,scPop .5s both}
@keyframes aur{from{transform:scaleY(1) scaleX(1)}to{transform:scaleY(1.08) scaleX(.95)}}
.scn-powerup .p{width:.35em;height:.8em;border-radius:50%;background:#fff6a8;box-shadow:0 0 .4em #ffcc00;animation:rise 1s linear var(--d) infinite both}
@keyframes rise{from{transform:translateY(6em);opacity:0}30%{opacity:1}to{transform:translateY(-14em);opacity:0}}
.scn-powerup .blt{inset:0;width:100%;height:100%;animation:blt .9s steps(1) infinite}
@keyframes blt{0%,40%,60%,100%{opacity:0}45%,55%{opacity:1}}
/* anime: katana slash */
.scn-katana{--sc:#ff2d55}
.scn-katana .kh{inset:0;background:#0a0a12;animation:kh .7s ease .55s forwards}
.scn-katana .kh.t{clip-path:polygon(0 0,100% 0,100% 35%,0 65%)}.scn-katana .kh.b{clip-path:polygon(0 65%,100% 35%,100% 100%,0 100%);animation-name:kh2}
@keyframes kh{to{transform:translate(-30%,-40%) rotate(-6deg);opacity:0}}
@keyframes kh2{to{transform:translate(30%,40%) rotate(-6deg);opacity:0}}
.scn-katana .ks{left:-10%;top:50%;width:120%;height:.35em;background:linear-gradient(90deg,transparent,#fff 30%,#ff2d55 50%,#fff 70%,transparent);box-shadow:0 0 1em #ff2d55,0 0 .3em #fff;transform:rotate(-17deg) scaleX(0);animation:ks .3s ease .2s forwards,scFade .4s ease .8s reverse forwards}
@keyframes ks{to{transform:rotate(-17deg) scaleX(1)}}
.scn-katana .sc-c{animation:scFade .3s .6s both}
/* anime: manga panel */
.scn-manga{--sc:#000}
.scn-manga .mp{left:8%;right:8%;top:22%;bottom:22%;background:#fff radial-gradient(circle,#0003 .12em,transparent .14em) 0 0/.7em .7em;border:.35em solid #000;box-shadow:.5em .5em 0 #000;transform:rotate(-3deg);animation:mp .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes mp{from{transform:rotate(-20deg) scale(0)}}
.scn-manga .sc-h{color:#000;-webkit-text-stroke:0;text-shadow:none;font-size:2.2em;transform:rotate(-3deg)}
.scn-manga .sc-av{border-color:#000;box-shadow:none;border-width:.25em}
.scn-manga .sc-n{background:#000;border-color:#000}
.scn-manga .sc-s{background:#fff;color:#000;border:.15em solid #000;border-radius:1em;position:relative}
.scn-manga .mfx{right:12%;top:24%;font-family:var(--display);font-size:2em;color:#000;transform:rotate(12deg);animation:scSlam .4s .5s both}
/* anime: chibi sticker */
.scn-chibi{--sc:#ffd23f}
.scn-chibi .burst{left:50%;top:50%;width:20em;height:20em;margin:-10em;background:#ffd23f;clip-path:polygon(50% 0,58% 30%,85% 10%,70% 38%,100% 40%,72% 55%,95% 80%,63% 68%,55% 100%,45% 70%,15% 92%,30% 62%,0 58%,28% 45%,8% 18%,40% 30%);animation:brst 1s ease-in-out infinite alternate,scPop .4s both;filter:drop-shadow(0 0 .3em #ff8a00)}
@keyframes brst{to{transform:rotate(8deg) scale(1.05)}}
.scn-chibi .sc-av{border-width:.3em;border-radius:1em;transform:rotate(-6deg);box-shadow:0 .3em .6em rgba(0,0,0,.4)}
.scn-chibi .sc-h{color:#ff3d7f;-webkit-text-stroke:.06em #fff;text-shadow:0 .08em 0 #000}
/* game: level up */
.scn-levelup{--sc:#3dff8b;background:linear-gradient(180deg,transparent,rgba(0,40,20,.6) 40%,rgba(0,40,20,.6) 60%,transparent)}
.scn-levelup .sc-h{font-family:monospace;font-weight:900;font-style:italic;font-size:2.4em;background:linear-gradient(180deg,#fff,#3dff8b 50%,#00a85a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;text-shadow:none;filter:drop-shadow(0 .08em 0 #003) drop-shadow(0 0 .3em #3dff8b)}
.scn-levelup .sc-av{border-radius:.3em}
.scn-levelup .xp{position:relative!important;width:12em;height:.6em;border:.12em solid #fff;background:#012;overflow:hidden}
.scn-levelup .xp i{position:absolute;inset:0;background:linear-gradient(90deg,#3dff8b,#d4ff3d);transform-origin:right;animation:xpf 1.2s ease .5s both}
@keyframes xpf{from{transform:scaleX(0)}}
.scn-levelup .p{color:#d4ff3d;font-size:1em;animation:spk 1s steps(3) var(--d) infinite both}
/* game: glitch */
.scn-glitch{--sc:#00f0ff;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 .1em,transparent .1em .3em)}
.scn-glitch .gb{left:0;right:0;height:var(--s);top:var(--y0);background:var(--c);mix-blend-mode:screen;opacity:.6;animation:gbr .3s steps(2) var(--d) infinite}
@keyframes gbr{50%{transform:translateX(8%)}}
.scn-glitch .sc-h{position:relative;color:#fff;-webkit-text-stroke:0;text-shadow:.08em 0 #ff003c,-.08em 0 #00f0ff;animation:glt .25s steps(2) infinite,scFade .2s both}
@keyframes glt{0%{transform:translate(0)}25%{transform:translate(-.08em,.04em);clip-path:inset(10% 0 40% 0)}50%{transform:translate(.08em,-.04em);clip-path:inset(50% 0 5% 0)}75%{clip-path:none}}
.scn-glitch .sc-av{border-radius:.2em;animation:glt .4s steps(2) infinite}
/* game: portal */
.scn-portal{--sc:#9b5cff}
.scn-portal .pt{left:50%;top:50%;width:16em;height:16em;margin:-8em;border-radius:50%;background:conic-gradient(#9b5cff,#00e1ff,#ff4fd8,#9b5cff);-webkit-mask:radial-gradient(circle,transparent 22%,#000 26%,#000 60%,transparent 70%);mask:radial-gradient(circle,transparent 22%,#000 26%,#000 60%,transparent 70%);filter:blur(.15em) drop-shadow(0 0 1em #9b5cff);animation:spin 1.2s linear infinite,ptg .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes ptg{from{transform:scale(0) rotate(-180deg)}}
.scn-portal .sc-av{animation:pte .8s cubic-bezier(.2,1.5,.4,1) .3s both}
@keyframes pte{from{transform:scale(0) rotate(720deg)}}
/* party */
.scn-fireworks{--sc:#ffd166;background:rgba(0,0,20,.35)}
.scn-fireworks .p{width:.35em;height:.35em;border-radius:50%;background:var(--c);box-shadow:0 0 .5em var(--c);animation:fwp 1.3s cubic-bezier(.1,.8,.3,1) var(--d) both}
@keyframes fwp{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--x),var(--y));opacity:0}}
.scn-confetti{--sc:#4fd8ff}
.scn-confetti .p{top:-2em;width:.5em;height:.9em;background:var(--c);border-radius:.1em;animation:cfa 3s linear var(--d) both}
@keyframes cfa{to{transform:translate(var(--x),58em) rotate(900deg)}}
.scn-balloons{--sc:#ff6b9a}
.scn-balloons .p{top:auto;bottom:-6em;font-size:3em;animation:bln 3.6s ease-in var(--d) both}
@keyframes bln{0%{transform:translate(0,0)}50%{transform:translate(1em,-9em)}100%{transform:translate(-.5em,-20em)}}
.scn-hearts{--sc:#ff4f7b}
.scn-hearts .p{color:var(--c);font-size:var(--s);text-shadow:0 0 .3em var(--c);animation:fwp 1.8s cubic-bezier(.1,.8,.3,1) var(--d) both}
/* luxury */
.scn-royal{--sc:#e2b865;background:radial-gradient(circle,rgba(226,184,101,.3),rgba(0,0,0,.6) 70%)}
.scn-royal .cur{top:0;bottom:0;width:52%;background:repeating-linear-gradient(90deg,#7a0d1e 0 1.2em,#a3132b 1.2em 2em,#7a0d1e 2em 3em);box-shadow:inset 0 -1em 1em rgba(0,0,0,.4);animation:curL 1s cubic-bezier(.6,0,.2,1) .2s forwards;border-bottom:.4em solid #e2b865}
.scn-royal .cur.l{left:0}.scn-royal .cur.r{right:0;animation-name:curR}
@keyframes curL{to{transform:translateX(-100%)}}@keyframes curR{to{transform:translateX(100%)}}
.scn-royal .crw{position:relative!important;width:3.2em;margin-bottom:-1.2em;z-index:2;animation:crd .6s cubic-bezier(.3,1.5,.5,1) 1s both;filter:drop-shadow(0 0 .4em #ffd166)}
@keyframes crd{from{transform:translateY(-12em)}}
.scn-royal .p{color:#ffe7a3;text-shadow:0 0 .3em #ffd166;animation:spk 1.4s ease-in-out var(--d) infinite both}
.scn-royal .sc-h{color:#ffe7a3;-webkit-text-stroke:.04em #5a3d00}
.scn-royal .sc-h{order:1}.scn-royal .crw{order:2}.scn-royal .sc-av{order:3}.scn-royal .sc-n{order:4}.scn-royal .sc-s{order:5}
.scn-trophy{--sc:#ffd166}
.scn-trophy .ry{left:50%;top:45%;width:30em;height:30em;margin:-15em;background:repeating-conic-gradient(rgba(255,209,102,.45) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 15%,transparent 65%);mask:radial-gradient(circle,#000 15%,transparent 65%);animation:spin 8s linear infinite,scFade .4s both}
.scn-trophy .tr{position:relative!important;font-size:5em;line-height:1;animation:trr .8s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 0 .2em #ffd166)}
@keyframes trr{from{transform:translateY(3em) scale(.3)}}
.scn-cash{--sc:#3dd68c}
/*b1*/
.tgw{display:flex;align-items:center;gap:.6em;padding:.5em .7em;border-radius:14px;background:rgba(10,10,20,.75);border:2px solid var(--tc,#ffd166);box-shadow:0 0 12px var(--tc,#ffd166);color:#fff;direction:rtl;min-width:0}
.tgi{width:2.4em;height:2.4em;border-radius:50%;background:var(--tc,#ffd166);display:grid;place-items:center;overflow:hidden;flex:none;font-weight:900;color:#111}
.tgi img{width:100%;height:100%;object-fit:cover}
.tgt{display:grid;min-width:0}.tgt small{color:var(--tc,#ffd166);font-weight:800}.tgt b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tgt .num{color:#ffd166;font-size:.9em}
/*gc*/
.gcw{width:100%;padding:.6em .8em;border-radius:14px;background:rgba(10,10,20,.7);border:1px solid rgba(255,255,255,.12);color:#fff;text-align:center;direction:rtl}
.gct{font-weight:900;font-size:1.1em;text-shadow:0 0 .4em rgba(255,209,102,.6)}
.gcb{margin:.4em 0;height:.7em;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.gcb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffb020,#ffd166);box-shadow:0 0 8px #ffd166;transition:width .5s ease}
.gcn{font-size:.95em;color:#ffd166}
/*icons*/
.goal.gs-ifl{background:none!important;border:0!important;padding:0!important;box-shadow:none!important;text-align:center}
.ifl-row{display:flex;justify-content:center}
.ifl-g{position:relative;display:inline-block;font-size:4.2em;line-height:1;direction:ltr}
.ifl-base{color:#1c1f2a;text-shadow:0 0 .1em rgba(255,255,255,.08)}
.ifl-fill{position:absolute;left:0;top:0;bottom:0;overflow:hidden;transition:width .6s ease}
.ifl-in{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;color:var(--ic);text-shadow:0 0 .12em var(--ic),0 0 .32em var(--ic);font-size:1em}
.ifl-g>.ifl-base{display:block}
.ifl-t{margin-top:.25em;font-weight:900;color:#fff;text-shadow:0 0 .4em var(--ic);white-space:nowrap}
/*car*/
.car{display:grid;gap:10px;justify-items:center}
.car-s{display:grid;grid-template-columns:1fr;gap:6px;justify-items:center;width:100%;max-width:460px}
.car-s .stage{width:100%}
.car{grid-template-columns:auto 1fr auto;align-items:center}
.car .row{grid-column:1/-1;justify-content:center}
/*hpbar*/
.goal.gs-hpbar{background:none!important;border:0!important;padding:0!important;box-shadow:none!important;direction:ltr}
.gs-hpbar .hpb{position:relative;height:2.7em;border-radius:.5em;overflow:hidden;background:var(--hb);border:.12em solid rgba(0,0,0,.35);box-shadow:0 .15em .6em rgba(0,0,0,.35)}
.gs-hpbar .hpf{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,color-mix(in srgb,var(--hc) 80%,#fff) 0,var(--hc) 55%,color-mix(in srgb,var(--hc) 70%,#000) 100%);display:flex;align-items:center;padding:0 .7em;transition:width .4s ease;min-width:0;overflow:visible;white-space:nowrap}
.gs-hpbar .hpt{color:var(--hf);font-weight:800;font-size:1em;text-shadow:0 .08em .2em rgba(0,0,0,.35);white-space:nowrap}
.gs-hpbar .hpv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--he);font-weight:800;font-size:1em;white-space:nowrap}
.gs-hpbar .hpg{position:absolute;right:.7em;top:50%;transform:translateY(-50%);color:var(--he);font-weight:800;font-size:1em;white-space:nowrap}
/*orb last donor*/
.orb{position:relative;display:inline-flex;align-items:center;direction:ltr;font-family:var(--body);--oc:#22d3ee;animation:orbIn .7s cubic-bezier(.2,.9,.3,1.2) both}
.orb-core{position:relative;width:2.8em;height:2.8em;border-radius:50%;flex:none;z-index:2;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff 0,color-mix(in srgb,var(--oc) 70%,#fff) 22%,var(--oc) 58%,color-mix(in srgb,var(--oc) 35%,#000) 100%);box-shadow:0 0 .5em var(--oc),0 0 1.6em color-mix(in srgb,var(--oc) 70%,transparent),inset 0 0 .5em rgba(255,255,255,.55);animation:orbPulse 1.8s ease-in-out infinite}
.orb-h{font-size:1.35em;color:#fff;text-shadow:0 0 .35em #fff,0 0 .8em var(--oc);line-height:1}
.orb-ring{position:absolute;inset:-.45em;border-radius:50%;border:.14em solid transparent;border-top-color:var(--oc);border-right-color:color-mix(in srgb,var(--oc) 40%,transparent);animation:orbSpin 1.5s linear infinite;filter:drop-shadow(0 0 .3em var(--oc))}
.orb-plate{position:relative;overflow:hidden;display:flex;align-items:center;gap:.5em;margin-inline-start:-.9em;padding:.4em .5em .4em 1.3em;border-radius:.45em;background:linear-gradient(90deg,rgba(8,8,18,.94),rgba(24,24,40,.94));border:.1em solid color-mix(in srgb,var(--oc) 75%,#fff);box-shadow:0 0 .8em color-mix(in srgb,var(--oc) 45%,transparent);z-index:1}
.orb-plate::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);transform:translateX(-120%);animation:orbSweep 2.8s ease-in-out infinite;pointer-events:none}
.orb-n{color:#fff;font-weight:800;font-size:1em;letter-spacing:.02em;white-space:nowrap;text-shadow:0 0 .4em var(--oc)}
.orb-a{background:color-mix(in srgb,var(--oc) 22%,#000);border:.1em solid color-mix(in srgb,var(--oc) 80%,#fff);color:#fff;border-radius:.3em;padding:.12em .45em;font-weight:800;font-size:.95em;white-space:nowrap;box-shadow:inset 0 0 .4em color-mix(in srgb,var(--oc) 50%,transparent)}
@keyframes orbIn{from{opacity:0;transform:scale(.6) translateX(-12px)}to{opacity:1;transform:none}}
@keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes orbSpin{to{transform:rotate(360deg)}}
@keyframes orbSweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.orb,.orb-core,.orb-ring,.orb-plate::after{animation:none!important}}
/*hero last donor*/
.hero{position:relative;display:inline-flex;flex-direction:column;align-items:center;direction:ltr;font-family:var(--body);--oc:#ffd166;padding:.2em .4em .3em;animation:heroIn .9s cubic-bezier(.2,.9,.3,1.1) both}
.hero-rays{position:absolute;left:50%;top:-.4em;width:9em;height:9em;transform:translateX(-50%);background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--oc) 45%,transparent) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);animation:heroRays 8s linear infinite;pointer-events:none}
.hero-crest{position:relative;width:4.6em;height:4.6em;border-radius:50%;display:grid;place-items:center;z-index:2;background:radial-gradient(circle at 40% 30%,#fff 0,color-mix(in srgb,var(--oc) 70%,#fff) 25%,var(--oc) 62%,color-mix(in srgb,var(--oc) 40%,#000) 100%);border:.14em solid color-mix(in srgb,var(--oc) 60%,#fff);box-shadow:0 0 1em var(--oc),0 0 2.4em color-mix(in srgb,var(--oc) 60%,transparent);animation:heroPulse 2s ease-in-out infinite}
.hero-crest svg{position:absolute;top:-.95em;left:50%;transform:translateX(-50%);width:2.4em;height:auto;filter:drop-shadow(0 0 .3em var(--oc))}
.hero-h{font-size:2.1em;color:#fff;text-shadow:0 0 .4em #fff,0 0 1em var(--oc);line-height:1}
.hero-banner{position:relative;margin-top:-.7em;z-index:3;overflow:hidden;display:flex;align-items:center;gap:.5em;padding:.45em 1em .45em 1.2em;border-radius:.5em;background:linear-gradient(180deg,color-mix(in srgb,var(--oc) 35%,#111) 0,#0c0c16 100%);border:.12em solid var(--oc);box-shadow:0 0 1em color-mix(in srgb,var(--oc) 55%,transparent)}
.hero-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.5) 50%,transparent 60%);transform:translateX(-120%);animation:heroSweep 3s ease-in-out infinite;pointer-events:none}
.hero-tag{font-size:.6em;color:var(--oc);font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.hero-n{color:#fff;font-size:1.1em;font-weight:900;white-space:nowrap;text-shadow:0 0 .5em var(--oc)}
.hero-a{background:var(--oc);color:#111;font-weight:900;border-radius:.3em;padding:.12em .5em;white-space:nowrap;font-size:1em}
@keyframes heroIn{0%{opacity:0;transform:scale(.4) translateY(20px)}70%{transform:scale(1.08)}100%{opacity:1;transform:none}}
@keyframes heroPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes heroRays{to{transform:translateX(-50%) rotate(360deg)}}
@keyframes heroSweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.hero,.hero-rays,.hero-crest,.hero-banner::after{animation:none!important}}
/*textfill*/
.goal.gs-textfill{background:none!important;border:0!important;padding:0!important;box-shadow:none!important}
.tfb{position:relative;height:2.6em;border-radius:14px;overflow:hidden;background:var(--bE);direction:rtl}
.tf-base,.tf-in{display:flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:900;height:100%;padding:0 .6em;box-sizing:border-box}
.tf-base{position:absolute;inset:0;color:var(--tE)}
.tf-fillw{position:absolute;left:0;top:0;bottom:0;background:var(--gc);overflow:hidden;transition:width .6s ease}
.tf-in{position:absolute;left:0;top:0;bottom:0;color:var(--tF)}
.vx{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}
/*vid*/
.vd{position:relative;display:grid;place-items:center;width:100%;height:100%;padding:.6em 1.2em;box-sizing:border-box;container-type:size;overflow:hidden}
.vd svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.vd-sw path{fill:none;stroke:var(--sw,#000);stroke-width:14;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:vdsw 5.2s ease-out infinite}
.vd-ring ellipse{fill:none;stroke:var(--ac);stroke-width:6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:vdr 5.2s ease-in-out infinite;filter:drop-shadow(0 0 4px var(--ac))}
.vd-ring ellipse.thin{stroke:#888;stroke-width:1.5;opacity:.6;animation-delay:.25s}
.vd b{position:relative;display:block;font-size:min(1.6em,10cqw);font-weight:900;color:var(--ink,#000);white-space:nowrap;text-shadow:2px 0 var(--halo,#fff),-2px 0 var(--halo,#fff),0 2px var(--halo,#fff),0 -2px var(--halo,#fff),2px 2px var(--halo,#fff),-2px -2px var(--halo,#fff),2px -2px var(--halo,#fff),-2px 2px var(--halo,#fff);animation:vdIn 1s ease-out both}
.vd-puff{position:absolute;left:14%;top:52%;width:.9em;height:.9em;border-radius:50%;background:radial-gradient(#555,rgba(0,0,0,0) 70%);filter:blur(2px);opacity:0;animation:vdp 5.2s ease-out infinite}
.vd-puff.p2{left:auto;right:12%;top:42%;animation-delay:.15s}
@keyframes vdsw{0%{stroke-dashoffset:1;opacity:1}16%{stroke-dashoffset:0;opacity:1}24%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes vdr{0%{stroke-dashoffset:1;opacity:0}8%{opacity:1}22%{stroke-dashoffset:0;opacity:1}32%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes vdIn{0%{opacity:0;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes vdt{0%{opacity:0;transform:scale(1.25)}20%{opacity:1;transform:scale(1)}78%{opacity:1}90%,100%{opacity:0}}
@keyframes vdp{0%,38%{opacity:0;transform:scale(.4)}52%{opacity:.75}86%,100%{opacity:0;transform:scale(2.4)}}
/*rings*/
.scn-ringpurple{--c:#a77bff;--c2:#5b8cff}.scn-ringcyan{--c:#22d3ee;--c2:#3b82f6}.scn-ringpink{--c:#f472b6;--c2:#fb7185}.scn-ringgold{--c:#fbbf24;--c2:#fde68a}.scn-ringgreen{--c:#34d399;--c2:#a3e635}.scn-ringfire{--c:#f97316;--c2:#ef4444}
.rgw{width:100%;height:100%;display:grid;place-items:center}
.rg{position:relative;padding:.55em 1.2em;isolation:isolate}
.rg::before,.rg::after{content:"";position:absolute;left:-8%;right:-8%;top:50%;height:150%;transform:translateY(-50%);border-radius:50%;border:.12em solid var(--c);border-left-color:transparent;border-right-color:transparent;z-index:-1;animation:rgr 2.6s linear infinite;box-shadow:0 0 .5em var(--c)}
.rg::after{left:-14%;right:-14%;height:118%;border-color:var(--c2);border-top-color:transparent;border-bottom-color:transparent;animation-duration:1.8s;animation-direction:reverse}
@keyframes rgr{to{transform:translateY(-50%) rotate(360deg)}}
.rg b{position:relative;display:block;font-size:1em;font-weight:900;color:#fff;white-space:nowrap;-webkit-text-stroke:.05em #000;paint-order:stroke fill;text-shadow:0 .08em 0 #000,0 0 .6em var(--c);animation:rgp 1.6s ease-in-out infinite alternate}
@keyframes rgp{from{transform:scale(1)}to{transform:scale(1.06)}}
/*more-styles*/
.goal.gs-battery{background:#111;color:#fff;border:2px solid #444;border-radius:8px;position:relative;padding-right:10px}
.goal.gs-battery .gbar{background:#0a0a0a;border:2px solid #888;border-radius:4px;height:1.3em;overflow:hidden;padding:2px}
.goal.gs-battery .gbar i{display:block;height:100%;border-radius:2px;background:repeating-linear-gradient(90deg,#3dd68c 0 14px,#0a0a0a 14px 18px);box-shadow:0 0 8px #3dd68c}
.goal.gs-laser{background:#050006;color:#ff5c7a;border:1px solid #3a0a18;border-radius:6px}
.goal.gs-laser .gbar{background:#12000a;height:.5em;border-radius:99px;overflow:visible;position:relative;margin:.6em 0}
.goal.gs-laser .gbar i{display:block;height:100%;border-radius:99px;background:#ff2d55;box-shadow:0 0 6px #ff2d55,0 0 16px #ff2d55}
.goal.gs-pearl{background:linear-gradient(135deg,#fff,#f4ecf7 45%,#e9dcef);color:#4a2a5a;border:2px solid #d9c3e6;border-radius:16px;box-shadow:0 6px 16px rgba(120,60,140,.25)}
.goal.gs-pearl .gh span{color:#7b3f8f}
.goal.gs-pearl .gbar{background:#e7d9ef;border-radius:99px;height:1em;overflow:hidden}
.goal.gs-pearl .gbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ff9ad5,#ffd1ec,#c79bff)}
.goal.gs-desert{background:#e6c48a;color:#3a2410;border:3px solid #7a4a1a;border-radius:4px;background-image:repeating-linear-gradient(45deg,rgba(122,74,26,.12) 0 6px,transparent 6px 12px)}
.goal.gs-desert .gh span{color:#5a2e0c;font-weight:900}
.goal.gs-desert .gbar{background:#fff3d6;border:2px solid #7a4a1a;height:1.1em;overflow:hidden}
.goal.gs-desert .gbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,#b8861b 0 8px,#8a5a12 8px 14px)}
.goal.gs-ribbon{background:#1a1030;color:#fff;border-radius:12px;overflow:hidden}
.goal.gs-ribbon .gbar{background:#2b1b4d;height:1.2em;border-radius:99px;overflow:hidden}
.goal.gs-ribbon .gbar i{display:block;height:100%;border-radius:99px;background:repeating-linear-gradient(-45deg,#ff4fd8 0 12px,#ffd166 12px 24px,#4fd8ff 24px 36px);background-size:60px 60px;animation:rbmv 1.2s linear infinite}
@keyframes rbmv{to{background-position:60px 0}}
.nb.nb-sadu{background:#e8cf9a!important;color:#2a1a08!important;border:3px solid #6b3f14!important;border-radius:6px!important;background-image:repeating-linear-gradient(90deg,rgba(107,63,20,.18) 0 4px,transparent 4px 14px),repeating-linear-gradient(0deg,rgba(107,63,20,.12) 0 4px,transparent 4px 14px)!important}
.nb.nb-crownd .nm::before{content:"👑 ";}
.nb.nb-crownd{border:2px solid #ffd166!important;box-shadow:0 0 14px rgba(255,209,102,.5)!important}
.nb.nb-glassy{background:rgba(255,255,255,.14)!important;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.35)!important;border-radius:16px!important;color:#fff!important}
.nb.nb-neonline .nm{display:inline-block;padding-bottom:.2em;border-bottom:3px solid #22e6ff;box-shadow:0 4px 10px -2px #22e6ff;text-shadow:0 0 8px #22e6ff}
/*donor-goal-styles*/
.nb.nb-nameonly{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important}
.nb-nameonly .nno{display:inline-flex;gap:.45em;align-items:center;font-weight:900;font-size:1.25em;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 10px rgba(255,79,216,.5);white-space:nowrap}
.nb-nameonly .nno b{color:#ffd166;font-size:.9em}
.goal.gs-seven{background:#05070a;color:#7cff9e;border:2px solid #1d2a22;border-radius:10px;font-family:ui-monospace,Consolas,monospace}
.goal.gs-seven .gbar{background:repeating-linear-gradient(90deg,#0c1410 0 10px,transparent 10px 13px);height:1.5em;border-radius:3px;overflow:hidden;position:relative}
.goal.gs-seven .gbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gc,#7cff9e) 0 8px,transparent 8px 11px);box-shadow:0 0 10px var(--gc,#7cff9e)}
.goal.gs-saudi{background:linear-gradient(#0b5d2e,#006c35);color:#fff;border:2px solid #d4af37;border-radius:14px}
.goal.gs-saudi .gh span{color:#f5d77a}
.goal.gs-saudi .gbar{background:rgba(0,0,0,.28);border:1px solid #d4af37;border-radius:999px;height:1.1em;overflow:hidden}
.goal.gs-saudi .gbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#b8912a,#f5d77a,#d4af37);box-shadow:0 0 8px #f5d77a}
.scn-adhkar{--sc:#f5c96a}.scn-prayerfull{--sc:#f5c96a}
.adh{position:relative;width:100%;height:100%;min-height:2.8em;container-type:inline-size;display:grid;place-items:center;font-weight:800;color:#fff;text-shadow:0 0 .4em rgba(245,201,106,.8);text-align:center}
.adh .r{position:absolute;inset:0;display:grid;place-items:center;padding:0 4%;font-size:clamp(12px,6cqw,44px);line-height:1.3;opacity:0;animation:adhk 56s linear infinite;animation-delay:calc(var(--i)*-4s)}
@keyframes adhk{0%{opacity:0}.5%{opacity:1}6.6%{opacity:1}7.1%,100%{opacity:0}}

@keyframes bwt{from{transform:translateY(-14em) scale(.5)}}
@keyframes bwl{from{transform:scaleX(0) rotate(-40deg)}}@keyframes bwr{from{transform:scaleX(0) rotate(40deg)}}
.scn-bow .p{color:#fff;text-shadow:0 0 .3em #ff6fb5;font-size:var(--s,1.2em);animation:spk 1.2s ease-in-out var(--d) infinite both}
/* butterflies */
.scn-butterfly{--sc:#c58bff;background:radial-gradient(circle,rgba(230,200,255,.35),rgba(255,182,217,.12) 55%,transparent 75%)}

@keyframes bfly{0%{transform:translate(0,0) rotate(0) scaleX(1);opacity:0}10%{opacity:1}25%{transform:translate(calc(var(--x)*.3),calc(var(--y)*.4)) rotate(10deg) scaleX(.4)}50%{transform:translate(calc(var(--x)*.6),calc(var(--y)*.6)) rotate(-8deg) scaleX(1)}75%{transform:translate(calc(var(--x)*.85),calc(var(--y)*.9)) scaleX(.4)}100%{transform:translate(var(--x),var(--y)) scaleX(1);opacity:0}}

/* vanity mirror */

.scn-mirror .mr{position:relative!important;z-index:5;width:15em;height:19em;border-radius:7.5em 7.5em 1.2em 1.2em;background:linear-gradient(160deg,#fff5fa,#ffd1e8);border:.45em solid #f5c2d8;box-shadow:0 0 0 .2em #fff,0 0 2em rgba(255,143,200,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;padding-top:1em;animation:scPop .55s cubic-bezier(.2,1.4,.4,1) both}

.scn-mirror .mr b{font-family:var(--display);font-size:1.7em;color:#ad1457;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scn-mirror .mr span{display:flex;align-items:center;gap:.3em;font-size:.8em;color:#ad1457}.scn-mirror .mr .gim{width:1.3em;height:1.3em}
.scn-mirror .bulb{position:absolute;width:1em;height:1em;border-radius:50%;background:#fff8d6;box-shadow:0 0 .6em #ffe9a8,0 0 1.2em #ffd166;animation:blb 1s ease-in-out var(--d) infinite alternate}
@keyframes blb{from{opacity:.45}to{opacity:1}}
.scn-mirror .kiss{position:absolute;font-size:2.2em;animation:kss .4s cubic-bezier(.2,1.8,.4,1) var(--d) both}
@keyframes kss{from{transform:scale(3) rotate(-20deg);opacity:0}}
/* princess */
.scn-princess{--sc:#ffb3d9;background:linear-gradient(180deg,rgba(255,214,235,.45),rgba(206,170,255,.35))}
.scn-princess .cst{left:0;right:0;bottom:0;height:14em;background:rgba(255,255,255,.55);clip-path:polygon(0 100%,0 40%,6% 40%,6% 30%,10% 30%,10% 40%,18% 40%,18% 20%,22% 8%,26% 20%,26% 40%,38% 40%,38% 15%,44% 0,50% 15%,50% 40%,62% 40%,62% 20%,66% 8%,70% 20%,70% 40%,82% 40%,82% 30%,86% 30%,86% 40%,100% 40%,100% 100%);animation:cstu .8s ease both}
@keyframes cstu{from{transform:translateY(100%)}}
.scn-princess .tia{position:relative!important;width:7em;margin-bottom:-2em;z-index:6;animation:crd .6s cubic-bezier(.3,1.5,.5,1) .7s both;filter:drop-shadow(0 0 .4em #fff)}
.scn-princess .p{top:-2em;color:#fff;font-size:var(--s);text-shadow:0 0 .3em #ffb3d9;animation:cfa 3s linear var(--d) both}
/* kisses */
.scn-kisses{--sc:#ff2d75;background:radial-gradient(circle,rgba(255,45,117,.25),transparent 70%)}
.scn-kisses .p{font-size:var(--s);animation:kss .45s cubic-bezier(.2,1.8,.4,1) var(--d) both}
/* candy */
.scn-candy{--sc:#ff8fc8;background:linear-gradient(180deg,rgba(255,230,245,.45),rgba(200,240,255,.35))}
.scn-candy .p{top:-3em;font-size:2em;animation:cfa 3s linear var(--d) both}
.scn-candy .gy b{-webkit-text-stroke:0;color:#d63384;text-shadow:none;background:repeating-linear-gradient(-45deg,#fff 0 .5em,#ffd1e8 .5em 1em);padding:.15em .8em;border-radius:99em;border:.12em solid #ff8fc8}
/* flower wreath */
.scn-flowers{--sc:#ff6fa0;background:radial-gradient(circle,rgba(255,240,245,.5),rgba(255,182,217,.15) 55%,transparent 75%)}
.scn-flowers .fw{left:50%;top:var(--fy,40%);font-size:2em;margin:-.5em;animation:flw .45s cubic-bezier(.2,1.8,.4,1) var(--d) both}
@keyframes flw{from{transform:translate(var(--x),var(--y)) scale(0) rotate(-90deg)}to{transform:translate(var(--x),var(--y)) scale(1)}}
/* glitter holo */
.scn-glitter{--sc:#ffb3ec;background:linear-gradient(120deg,rgba(255,179,236,.35),rgba(179,229,255,.35),rgba(255,247,179,.3),rgba(214,179,255,.35));background-size:300% 300%;animation:hol 3s ease infinite,scOut .6s ease var(--dur) forwards}
@keyframes hol{50%{background-position:100% 100%}}
.scn-glitter .p{width:var(--s);height:var(--s);background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:spk 1s ease-in-out var(--d) infinite both;filter:drop-shadow(0 0 .2em #fff)}
.scn-glitter .gy b{background:linear-gradient(90deg,#ff8fd8,#8fd8ff,#fff08f,#d18fff,#ff8fd8);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;text-shadow:none;filter:drop-shadow(0 .05em 0 rgba(120,0,80,.6));animation:vsh 2s linear infinite,scUp .45s .45s both}
/* unicorn rainbow */
.scn-unicorn{--sc:#d18fff;background:rgba(255,240,250,.25)}
.scn-unicorn .rb{left:50%;top:44%;width:26em;height:26em;margin:-13em;border-radius:50%;background:radial-gradient(circle,transparent 52%,#ff6b9a 52% 56%,#ffb36b 56% 60%,#fff36b 60% 64%,#6bffb3 64% 68%,#6bc8ff 68% 72%,#b36bff 72% 76%,transparent 76%);clip-path:inset(0 0 50% 0);animation:rbw 1s ease both;opacity:.85}

.scn-unicorn .uni{right:-20%;top:36%;font-size:5em;animation:uni 1.4s cubic-bezier(.3,1,.5,1) .4s both}

.scn-unicorn .p{color:#fff;font-size:var(--s);text-shadow:0 0 .3em #d18fff;animation:spk 1.2s ease-in-out var(--d) infinite both}
/* perfume */
.scn-perfume{--sc:#e2b865;background:radial-gradient(circle,rgba(255,220,235,.35),rgba(80,20,50,.4) 70%)}

@keyframes mst{from{transform:translate(0,0) scale(.3);opacity:0}20%{opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.6);opacity:0}}
.scn-perfume .gy{padding:1.2em 2em;border:.15em solid #e2b865;border-radius:1em;background:rgba(40,8,26,.6);box-shadow:inset 0 0 0 .3em rgba(226,184,101,.25)}

.scn-perfume .gy .av2{box-shadow:0 0 0 .14em #e2b865,0 0 1.2em rgba(226,184,101,.6)}

.scn-flowers .fwr{position:relative;width:5em;height:5em}
.scn-flowers .fwr .av2{position:absolute;inset:0;animation:scPop .5s cubic-bezier(.2,1.5,.4,1) both}
.scn-flowers .fw{position:absolute;left:50%;top:50%;font-size:1.7em;margin:-.5em}

/* subscription */
.licchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.licchip.ok{border-color:color-mix(in srgb,var(--live,#2fd39a) 60%,transparent);color:var(--live,#2fd39a)}
.licchip.trial{border-color:#e2b865;color:#e2b865}
.licchip.bad{border-color:#ff5c7a;color:#ff5c7a;background:color-mix(in srgb,#ff5c7a 12%,var(--panel-2))}
.subwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.subwrap{grid-template-columns:1fr}}
.prc{position:relative;overflow:hidden;border-radius:18px;padding:22px;border:1.5px solid #e2b865;background:radial-gradient(circle at 85% 0,rgba(226,184,101,.22),transparent 55%),var(--panel-2)}

.prc .pr small{font-size:15px;color:var(--muted)}
.prc ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:7px;font-size:14px}
.prc li::before{content:"✓";color:#2fd39a;font-weight:900;margin-inline-end:8px}
.lstate{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);margin-bottom:12px}
.lstate .ic{font-size:28px}
.lstate b{display:block;font-size:16px}
.lstate span{font-size:13px;color:var(--muted)}
.paystep{display:grid;gap:10px;counter-reset:p;list-style:none;margin:0;padding:0}
.paystep li{counter-increment:p;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:14px}
.paystep li::before{content:counter(p);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--em);color:#04140f}
.bankbox{display:grid;gap:4px;margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px dashed var(--line);font-size:13px}
.bankbox code{direction:ltr;text-align:left;font-size:13px;user-select:all}
.licin{width:100%;min-height:74px;direction:ltr;text-align:left;font-family:monospace;font-size:12px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);resize:vertical}
.updban{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 18px;border-radius:16px;background:linear-gradient(135deg,#123a2c,#0b1f18);border:1.5px solid var(--em,#2fd39a);box-shadow:0 12px 40px rgba(0,0,0,.5);color:#fff;font-size:14px;max-width:min(92vw,720px)}
.updban span{opacity:.85}
/* donation tiers */
.dtl{display:grid;gap:8px}

.dtr.set{border-color:color-mix(in srgb,var(--em) 55%,transparent)}
.dta{display:inline-flex;align-items:center;gap:4px;font-size:18px;color:#2fd39a}.dta input{width:76px;font-weight:800;font-size:15px}

/* donation guide */
.dnguide{display:grid;gap:8px;margin-top:12px}

/* unified chat */
.mch{display:flex;flex-direction:column;gap:.28em;font-size:.6em;color:#fff}

.mtx{color:#fff}
.emo{height:1.35em;vertical-align:middle;margin:0 .08em}
.msc{font-style:normal;font-weight:900;margin-inline-end:.4em;color:#ffd166}
.mcm.sc{background:linear-gradient(135deg,rgba(255,179,0,.45),rgba(255,111,0,.35))!important;border:.08em solid #ffd166!important}
.mc-bubbles .mcm{background:rgba(0,0,0,.55)}
.mc-glass .mcm{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

.mc-neon .mcm{background:rgba(4,4,14,.6);border:.08em solid var(--pa);box-shadow:0 0 .5em color-mix(in srgb,var(--pa) 60%,transparent)}
.mc-dark .mcm{background:#18181bdd;border-radius:.3em}.mc-dark .mlg{border-radius:.25em}
.mc-compact{gap:.05em}.mc-compact .mcm{background:none;padding:.08em .2em;text-shadow:0 1px 2px #000}.mc-compact .mlg,.mc-compact .mav{width:1.15em;height:1.15em}
/* platform alerts */
.maq{display:grid;place-items:center}
.mal{display:flex;align-items:center;gap:.7em;padding:.6em 1.1em .6em .7em;border-radius:1em;color:#fff;animation:maIn .6s cubic-bezier(.2,1.4,.4,1) both;max-width:100%}
.mal.out{animation:maOut .45s ease forwards}
@keyframes maIn{from{opacity:0;transform:translateY(1em) scale(.85)}}
@keyframes maOut{to{opacity:0;transform:translateY(-.6em) scale(.95)}}
.mlb{position:relative;flex:none;width:3.2em;height:3.2em}
.mlc{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:var(--pb);color:var(--pf);box-shadow:0 0 0 .14em rgba(255,255,255,.85),0 .3em .8em rgba(0,0,0,.45);animation:mlPop .6s cubic-bezier(.2,1.6,.4,1) .1s both}
.mlc svg{width:1.7em;height:1.7em}
.mrg{position:absolute;inset:0;border-radius:50%;border:.18em solid var(--pa);animation:mlRing .9s ease-out .15s both}
@keyframes mlPop{from{transform:scale(0) rotate(-90deg)}}
@keyframes mlRing{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
.mtxt{display:grid;gap:.05em;min-width:0}
.mh{font-size:1.05em;font-weight:900;color:var(--pa)}
.mu{font-size:1.35em;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms{font-size:.8em;opacity:.85;font-weight:700}
.mm{font-size:.8em;margin-top:.15em;opacity:.95}
.mal.pv{animation:none}.mal.pv .mlc,.mal.pv .mrg{animation:none}.mal.pv .mrg{opacity:0}
.ml-brand{background:linear-gradient(135deg,color-mix(in srgb,var(--pa) 55%,#0b0c12),#0b0c12 80%);border:.1em solid var(--pa);box-shadow:0 .4em 1.4em rgba(0,0,0,.5)}
.ml-burst{background:rgba(10,10,18,.85);border-radius:99em;animation:maGrow .7s cubic-bezier(.2,1,.3,1) both}
@keyframes maGrow{from{clip-path:inset(-2em -2em -2em calc(100% - 4.2em));opacity:1}}
.ml-banner{border-radius:.3em;padding:.5em 1.6em .5em .7em;background:linear-gradient(90deg,var(--pb),color-mix(in srgb,var(--pb) 40%,#000));animation:maSlide .55s cubic-bezier(.2,1,.3,1) both}.ml-banner .mh{color:#fff}
@keyframes maSlide{from{transform:translateX(110%);opacity:0}}
.ml-glass{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ml-neon{background:rgba(4,4,14,.75);border:.12em solid var(--pa);box-shadow:0 0 1em var(--pa),inset 0 0 .6em color-mix(in srgb,var(--pa) 40%,transparent)}.ml-neon .mu{text-shadow:0 0 .4em var(--pa)}
.ml-gold{background:linear-gradient(160deg,#3a2a0e,#120c03);border:.12em solid #e2b865;box-shadow:0 0 1em rgba(226,184,101,.4)}.ml-gold .mh{color:#f6dfa4}.ml-gold .mu{background:linear-gradient(180deg,#fff3c4,#e2b865);-webkit-background-clip:text;background-clip:text;color:transparent}

/* accounts link */
.mlink{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer}
.mst{font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.mst.ok{color:#2fd39a;border-color:color-mix(in srgb,#2fd39a 50%,transparent)}.mst.wait{color:#e2b865;border-color:color-mix(in srgb,#e2b865 50%,transparent)}
.mstbox{display:grid;gap:8px}.mstrow{display:flex;align-items:center;gap:10px;font-size:14px}.mstrow .mlg{font-size:22px}.mstrow .mst{max-width:none;font-size:12.5px}

/* subathon panel */
body.ovlite *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.sbmore{margin-top:12px}.sbmore summary{cursor:pointer;font-weight:700;color:var(--em-hi,var(--em));padding:6px 0}
.rlels{gap:6px}
.rli{display:flex!important;align-items:center;gap:.45em}.rli i{font-style:normal;flex:none}.rli .rll{flex:1;min-width:0}.rli b{color:var(--k1);font-weight:900;font-variant-numeric:tabular-nums}
.rli.neg b{color:#ff6b81}.rli.hot{background:linear-gradient(90deg,rgba(255,138,61,.35),rgba(255,59,59,.2))!important;animation:hhP 1.2s ease-in-out infinite}
.rltop{display:grid;gap:.25em;margin-top:.35em;padding-top:.35em;border-top:.06em solid color-mix(in srgb,var(--k1) 40%,transparent)}
.rlth{font-size:.85em;color:var(--k1);font-weight:900}

.nb{position:relative;isolation:isolate;overflow:hidden;color:#fff;padding:.55em .5em;border-radius:.8em;background:#0b0716;min-width:0;--c:#ff4fd8;--p:#fff;--c2:#7fd4ff}

/* 10 cyberpunk */
.nb-cyberpunk{--c:#ff2a6d;background:#06060f;border:.08em solid #ff2a6d;box-shadow:0 0 .8em #ff2a6d55,inset 0 0 .6em #05d9e855}
.nb-cyberpunk::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 .18em,#0009 .18em .2em)}
.nb-cyberpunk .nbi{border:.1em solid #05d9e8;box-shadow:0 0 .5em #05d9e8}
.nb-cyberpunk .nm{color:#05d9e8;text-shadow:0 0 .3em #05d9e8}
/* 11 frost */
.nb-frost{background:linear-gradient(160deg,#dff6ff33,#1d4a6a 60%,#0a1d2c)}
.nb-frost::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(110deg,transparent 40%,#fff5 50%,transparent 60%);background-size:250% 100%;animation:nbShift 3s linear infinite}
.nb-frost .nbi{box-shadow:0 0 .6em #bfeaff}
/* 12 gold coins */
.nb-coins{--c:#ffd54a;background:linear-gradient(180deg,#2a1b00,#0c0800)}
.nb-coins .nbi{border:.12em solid #ffd54a;box-shadow:0 0 .5em #ffd54a}
.nb-coins .nbf::before{content:'\1FA99';position:absolute;top:-.5em;right:-.4em;font-size:.9em;z-index:2;animation:nbSpin 3s linear infinite}
/* 13 aurora */
.nb-aurora{background:linear-gradient(120deg,#0b3d3a,#1a0b3d,#0b3d2a,#0b1a3d);background-size:300% 300%;animation:nbAur 8s ease infinite}
/* 14 sakura */
.nb-sakura{--p:#ffc1d9;background:linear-gradient(180deg,#3a1025,#120812)}
.nb-sakura .nbi{border:.12em solid #ffc1d9}
/* 15 holo */
.nb-holo{background:linear-gradient(135deg,#0a0f1f,#152a4a);border:.08em solid #7fd4ff66}
.nb-holo::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 .15em,#7fd4ff14 .15em .17em);animation:nbFlick 3s infinite}
.nb-holo .nbi{box-shadow:0 0 .8em #7fd4ff;animation:nbFlick 2.2s infinite}
/* 16 glitch */
.nb-glitch{background:#070707}
.nb-glitch .nm{text-shadow:-.05em 0 #ff0050,.05em 0 #00e5ff;animation:nbGlitch .6s steps(2) infinite}
.nb-glitch .nbi{animation:nbGlitch .5s steps(2) infinite;box-shadow:-.1em 0 #ff0050,.1em 0 #00e5ff}
/* 17 electric */
.nb-electric{--c:#4fd8ff;background:#050a18}
.nb-electric .nbi{border:.1em solid #4fd8ff;animation:nbPulse 1.2s infinite}
.nb-electric .nm{color:#bff4ff}
/* 18 candy */
.nb-candy{background:repeating-linear-gradient(45deg,#ffd1e6 0 .8em,#ffb3d9 .8em 1.6em);color:#4a0e2e}
.nb-candy .nbi{border:.12em solid #fff;box-shadow:0 .2em .3em #0004}
.nb-candy .nm{color:#4a0e2e;font-weight:700}
.nb-candy .nbp{background:#fff;color:#4a0e2e}
/* 19 HUD */
.nb-hud{background:#04111a;border:.07em solid #2fe0c6}
.nb-hud .nbi{border-radius:.3em;border:.1em solid #2fe0c6}
.nb-hud .nbf::after{content:'';position:absolute;inset:-.35em;border:.12em dashed #2fe0c6;border-radius:.4em;animation:nbSpin 9s linear infinite}
/* 20 lava */
.nb-lava{background:radial-gradient(circle at 50% 120%,#ff6a00,#7a0000 60%,#1a0000);background-size:200% 200%;animation:nbAur 6s ease infinite}
/* 21 arcade */
.nb-arcade{background:#000;font-family:monospace}
.nb-arcade .nbi{image-rendering:pixelated;border-radius:0;border:.12em solid #39ff14}
.nb-arcade .nm{color:#39ff14;animation:nbFlick 1s steps(2) infinite}
/* 22 waves */
.nb-waves{background:linear-gradient(180deg,#0a2a4a,#04101e)}
.nb-waves::after{content:'';position:absolute;left:0;right:0;bottom:0;height:35%;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 100%,#2aa8ff66 40%,transparent 42%) 0 0/2em 1.2em repeat-x;animation:nbWave 3s linear infinite}
/* 23 velvet */
.nb-velvet{background:radial-gradient(circle at 50% 0,#5a0f2a,#1a0208 70%);border:.1em solid #d4af37}
.nb-velvet .nbi{border:.12em solid #d4af37;box-shadow:0 0 .6em #d4af37}
.nb-velvet .nbp{color:#d4af37}
/* 24 bubbly */
.nb-bubbly{background:linear-gradient(180deg,#24104a,#0e0820)}
.nb-bubbly .nbi{box-shadow:0 0 .4em #c58bff}
.nb-bubbly .nbs.s2{animation-delay:.3s}
@media (prefers-reduced-motion:reduce){.nb *,.nb::after,.nb::before{animation:none!important}}

/* ===== v2.5: social shapes, goal bars, last donor, clip links ===== */
@keyframes sxShine{0%{background-position:-150% 0}100%{background-position:250% 0}}
@keyframes sxBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-.22em)}}
@keyframes sxFlip{0%{transform:rotateX(0)}100%{transform:rotateX(360deg)}}
@keyframes sxPulse{0%,100%{box-shadow:0 0 0 0 var(--sa,#fff)}70%{box-shadow:0 0 0 .5em transparent}}
@keyframes sxWave{0%,100%{transform:skewX(0)}50%{transform:skewX(-4deg)}}
@keyframes sxGlitch{0%,100%{transform:translate(0)}33%{transform:translate(-.1em,0)}66%{transform:translate(.1em,0)}}
@keyframes sxSpin{to{transform:rotate(360deg)}}
@keyframes sxScan{0%{background-position:0 -100%}100%{background-position:0 200%}}
.so-hex .sx{background:var(--sb);color:var(--sf);clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);padding-inline:1.1em}

.so-tag .sx{background:var(--sb);color:var(--sf);border-radius:.3em;clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%);padding-inline:.5em 1.2em;animation:sxBounce 3s ease-in-out infinite}
.so-ribbon2 .sx{background:linear-gradient(90deg,var(--sb),var(--sa));color:var(--sf);clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.so-arrow .sx{background:var(--sb);color:var(--sf);clip-path:polygon(0 0,80% 0,100% 50%,80% 100%,0 100%)}
.so-gold2 .sx{background:linear-gradient(135deg,#b8871f,#fff3b0,#d4af37,#7a5a0a);background-size:250% 100%;animation:sxShine 3s linear infinite;color:#2a1a00;border:.08em solid #fff3b0;box-shadow:0 0 .6em #d4af3799}
.so-holo2 .sx{background:linear-gradient(120deg,#7fd4ff,#c58bff,#ff8fd8,#7dff8a,#7fd4ff);background-size:300% 100%;animation:sxShine 4s linear infinite;color:#0a0a1a}
.so-fire2 .sx{background:linear-gradient(0deg,#ff3d00,#ffb300);color:#fff;box-shadow:0 0 .8em #ff6a00;animation:sxPulse 1.2s infinite}
.so-dash .sx{background:none;color:var(--sa);border:.12em dashed var(--sa)}
.so-retro .sx{background:#1b0f3d;color:#ffd166;font-family:monospace;border:.15em solid #ffd166;box-shadow:.15em .15em 0 #ff4fd8}
.so-glitch2 .sx{background:#080808;color:#fff;animation:sxGlitch .4s steps(2) infinite}
.so-glitch2 .sx b{text-shadow:-.06em 0 #ff0050,.06em 0 #00e5ff}
.so-shine .sx{background:linear-gradient(110deg,var(--sb) 40%,#fff9 50%,var(--sb) 60%);background-size:250% 100%;color:var(--sf);animation:sxShine 2.6s linear infinite}
.so-gradbd .sx{background:linear-gradient(#0c0a1f,#0c0a1f) padding-box,linear-gradient(90deg,#ff4fd8,#22e6ff,#ffd166,#ff4fd8) border-box;background-size:auto,300% 100%;border:.14em solid transparent;animation:sxShine 4s linear infinite;color:#fff}
.so-soft3d .sx{background:var(--sb);color:var(--sf);box-shadow:0 .25em 0 color-mix(in srgb,var(--sb) 60%,#000),0 .5em 1em #0007}
.so-stick .sx{background:#fff;color:#111;border-radius:.4em;transform:rotate(-2deg);box-shadow:0 .2em .4em #0006}
.so-comic .sx{background:#fff;color:#111;border:.18em solid #111;border-radius:.2em;box-shadow:.25em .25em 0 #111;font-weight:800;text-transform:uppercase}
.so-cyber2 .sx{background:#0a0a14;color:#05d9e8;border-left:.3em solid #ff2a6d;clip-path:polygon(0 0,95% 0,100% 25%,100% 100%,5% 100%,0 75%)}
.so-rainbowb .sx{background:linear-gradient(#0b0b18,#0b0b18) padding-box,linear-gradient(90deg,#ff4f7b,#ffd166,#7dff8a,#4fd8ff,#c58bff) border-box;background-size:auto,300% 100%;border:.14em solid transparent;border-radius:.8em;animation:sxShine 3s linear infinite;color:#fff}
.so-ice2 .sx{background:linear-gradient(160deg,#eaffff,#7fd4ff 60%,#1d4a6a);color:#06243a;border-radius:.6em;box-shadow:inset 0 0 .4em #fff}
.so-lava2 .sx{background:linear-gradient(90deg,#ff6a00,#7a0000,#ff6a00);background-size:200% 100%;animation:sxShine 3s linear infinite;color:#fff;border-radius:.4em}
.so-aurora2 .sx{background:linear-gradient(120deg,#0b3d3a,#1a0b3d,#0b3d2a);background-size:300% 300%;animation:nbAur 7s ease infinite;color:#fff}
.so-coinb .sx{background:radial-gradient(circle at 30% 30%,#fff3b0,#d4af37 60%,#7a5a0a);color:#2a1a00;border-radius:999em;box-shadow:0 0 .5em #d4af37}
.so-coinb .si{animation:sxSpin 4s linear infinite}
.so-pixel2 .sx{background:#111;color:#39ff14;border:.15em solid #39ff14;border-radius:0;font-family:monospace;image-rendering:pixelated}
.so-bounce .sx{background:var(--sb);color:var(--sf);animation:sxBounce 1.4s ease-in-out infinite;animation-delay:calc(var(--i,0)*.15s)}
.so-flip .sx{background:var(--sb);color:var(--sf);animation:sxFlip 4s linear infinite}
.so-pulsebd .sx{background:var(--sb);color:var(--sf);border-radius:.5em;animation:sxPulse 1.8s infinite}
.so-wave2 .sx{background:var(--sb);color:var(--sf);border-radius:.5em;animation:sxWave 2s ease-in-out infinite}
.so-spot2 .sx{background:radial-gradient(circle at 50% 0,#fff8 0,transparent 60%),var(--sb);color:var(--sf);box-shadow:0 0 1em var(--sa)}
.so-ninja .sx{background:#000;color:#fff;border-left:.25em solid var(--sa);clip-path:polygon(0 0,100% 0,100% 80%,92% 100%,0 100%)}
.so-cloud .sx{background:#fff;color:#1a1a2e;border-radius:999em;box-shadow:.2em .4em 0 #0002}
.so-stripe .sx{background:repeating-linear-gradient(45deg,var(--sb) 0 .6em,color-mix(in srgb,var(--sb) 70%,#fff) .6em 1.2em);color:#111;font-weight:800}
.so-leaf .sx{background:var(--sb);color:var(--sf);border-radius:0 1em 0 1em}
.so-candy2 .sx{background:repeating-linear-gradient(45deg,#ffd1e6 0 .6em,#ffb3d9 .6em 1.2em);color:#4a0e2e;border-radius:999em;border:.12em solid #fff}
.so-royal2 .sx{background:linear-gradient(#2a0520,#0c0108);color:#ffd166;border:.1em solid #d4af37;box-shadow:inset 0 0 .4em #d4af3766}
.so-scan .sx{background:linear-gradient(transparent 40%,var(--sa) 50%,transparent 60%),var(--sb);background-size:100% 250%;color:var(--sf);animation:sxScan 2.4s linear infinite}
/* goal bar styles */
.gs-neon .gbar{background:#0a0a18;border:.12em solid var(--gc);box-shadow:0 0 .6em var(--gc);border-radius:.4em;height:1.1em}
.gs-neon .gbar i{background:var(--gc);box-shadow:0 0 .8em var(--gc)}
.gs-fire .gbar{background:#2a0a00;border-radius:.4em;height:1.1em;overflow:hidden}
.gs-fire .gbar i{background:linear-gradient(90deg,#ff3d00,#ffb300,#ff3d00);background-size:200% 100%;animation:sxShine 1s linear infinite;box-shadow:0 0 .8em #ff6a00}
.gs-ice .gbar{background:#0a2236;border-radius:999em;height:1em;box-shadow:inset 0 0 .3em #000}
.gs-ice .gbar i{background:linear-gradient(#eaffff,#7fd4ff 60%,#2a7aaa);border-radius:999em}
.gs-gold .gbar{background:#2a1b00;border:.1em solid #d4af37;border-radius:.3em;height:1.1em}
.gs-gold .gbar i{background:linear-gradient(90deg,#8a6a10,#ffd54a,#fff3b0,#ffd54a);background-size:200% 100%;animation:sxShine 2.2s linear infinite}
.gs-candy .gbar{background:#fff;border-radius:999em;height:1.1em;border:.1em solid #ff8fd8}
.gs-candy .gbar i{background:repeating-linear-gradient(45deg,#ff8fd8 0 .5em,#ffd1e6 .5em 1em);border-radius:999em}
.gs-stripes .gbar{height:1.1em;border-radius:.3em;background:#111}
.gs-stripes .gbar i{background:repeating-linear-gradient(45deg,var(--gc) 0 .6em,#fff3 .6em 1.2em);background-size:2em 2em;animation:nbWave 1s linear infinite}
.gs-segments .gbar{background:repeating-linear-gradient(90deg,#0b0b18 0 .5em,transparent .5em .6em);height:1.1em}
.gs-segments .gbar i{background:var(--gc);box-shadow:0 0 .5em var(--gc)}
.gs-liquid .gbar{height:1.2em;border-radius:.6em;background:#0a1a2a}
.gs-liquid .gbar i{background:var(--gc);position:relative;overflow:hidden}
.gs-liquid .gbar i::after{content:'';position:absolute;top:-.3em;left:-50%;width:200%;height:.6em;background:radial-gradient(circle at 50% 100%,#fff5 40%,transparent 41%) 0 0/1.2em 1em repeat-x;animation:nbWave 1.4s linear infinite}
.gs-glass .gbar{background:#fff2;border:.08em solid #fff5;backdrop-filter:blur(4px);border-radius:999em;height:1em}
.gs-glass .gbar i{background:linear-gradient(#fff9,var(--gc));border-radius:999em}
.gs-crystal .gbar{height:1.1em}
.gs-crystal .gbar i{background:linear-gradient(120deg,var(--gc),#fff,var(--gc));background-size:250% 100%;animation:sxShine 2.6s linear infinite;clip-path:polygon(0 0,100% 0,96% 100%,0 100%)}
.gs-retro .gbar{background:#1b0f3d;border:.12em solid #ffd166;border-radius:0;height:1em}
.gs-retro .gbar i{background:repeating-linear-gradient(90deg,#ffd166 0 .4em,transparent .4em .6em)}
.gs-cyber .gbar{background:#0a0a14;border-left:.3em solid #ff2a6d;clip-path:polygon(0 0,100% 0,98% 100%,0 100%);height:1.1em}
.gs-cyber .gbar i{background:linear-gradient(90deg,#ff2a6d,#05d9e8);box-shadow:0 0 .6em #05d9e8}
.gs-holo .gbar i{background:linear-gradient(120deg,#7fd4ff,#c58bff,#ff8fd8,#7dff8a,#7fd4ff);background-size:300% 100%;animation:sxShine 3s linear infinite}
.gs-rainbow .gbar i{background:linear-gradient(90deg,#ff4f7b,#ffd166,#7dff8a,#4fd8ff,#c58bff)}
.gs-lava .gbar{background:#1a0000}
.gs-lava .gbar i{background:linear-gradient(90deg,#ff6a00,#7a0000,#ff6a00);background-size:200% 100%;animation:sxShine 2.5s linear infinite}
.gs-aurora .gbar i{background:linear-gradient(90deg,#22e6a0,#4fd8ff,#c58bff,#22e6a0);background-size:300% 100%;animation:sxShine 4s linear infinite}
.gs-royal .gbar{background:#1a0208;border:.1em solid #d4af37;border-radius:.3em}
.gs-royal .gbar i{background:linear-gradient(90deg,#5a0f2a,#d4af37)}
.gs-gamer .gbar{background:#111;border:.1em solid #39ff14;border-radius:0;height:.9em}
.gs-gamer .gbar i{background:repeating-linear-gradient(90deg,#39ff14 0 .45em,#0b3d0b .45em .55em)}
.gs-pixel .gbar{background:#111;border-radius:0;height:1em}
.gs-pixel .gbar i{background:var(--gc);box-shadow:inset 0 -.3em #0004}
.gs-cloud .gbar{background:#fff;border-radius:999em;height:1.2em}
.gs-cloud .gbar i{background:linear-gradient(#bfe9ff,#7fb9ff);border-radius:999em}
.gs-comic .gbar{background:#fff;border:.15em solid #111;border-radius:.2em;height:1.2em;box-shadow:.2em .2em 0 #111}
.gs-comic .gbar i{background:var(--gc);border-right:.12em solid #111}
.gs-bubble .gbar{background:#0a1a2a;border-radius:999em;height:1.2em}
.gs-bubble .gbar i{background:radial-gradient(circle at 20% 30%,#fff9 0 .15em,transparent .2em),var(--gc);background-size:1.2em 1.2em,auto;border-radius:999em;animation:nbWave 2s linear infinite}
.gs-hearts .gbar{background:#2a0a1a;border-radius:0;height:1.1em}
.gs-hearts .gbar i{background:repeating-linear-gradient(90deg,var(--gc) 0 .9em,#2a0a1a .9em 1.1em);animation:nbWave 1.5s linear infinite}
.gs-stars .gbar{height:1.1em;background:#0b0b1e}
.gs-stars .gbar i{background:repeating-linear-gradient(90deg,#ffd166 0 .7em,transparent .7em 1em);animation:nbWave 1s linear infinite}
.gs-heat .gbar{background:linear-gradient(90deg,#2a7aaa,#22e6a0,#ffd166,#ff3d00);border-radius:.3em;height:1.1em}
.gs-heat .gbar i{background:none;box-shadow:inset 0 0 0 999em #0009;margin-left:auto}
/* last donor card */
.ld{width:100%}
.ld .nbs{animation:none}
.dnlk{position:absolute;left:50%;bottom:.6em;transform:translateX(-50%);z-index:5;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.3em .9em;border-radius:99em;background:rgba(0,0,0,.7);color:#fff;font-size:.9em;text-decoration:none;direction:ltr;border:1px solid #ffffff55}

.dgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dpv{border:1px solid #ffffff22;border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dpv .stage{height:84px;overflow:hidden;position:relative;display:grid;place-items:center}
.dpv .stage>*{transform:scale(.5);transform-origin:center;max-width:none}
.dpv b{font-size:12px}
.dpv .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/*follow plate*/.fa-plate{display:inline-flex;align-items:center;gap:8px;direction:rtl;background:#0d0d10;border:2px solid var(--fc);border-radius:999px;padding:3px 14px 3px 3px;box-shadow:0 0 12px color-mix(in srgb,var(--fc) 55%,transparent),inset 0 0 8px color-mix(in srgb,var(--fc) 25%,transparent);max-width:100%}.fpl-av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;overflow:hidden;border:2px solid var(--fc);background:#222;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px}.fpl-av img{width:100%;height:100%;object-fit:cover}.fpl-nm{color:var(--fc);font-weight:800;font-size:15px;line-height:1;text-shadow:0 0 6px var(--fc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#asstBtn{font-weight:700;background:var(--em);color:#000;border:0}
#asstBox{position:fixed;left:16px;bottom:16px;z-index:60;width:min(340px,calc(100vw - 32px));height:440px;max-height:70vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.4);overflow:hidden;color:inherit}
#asstBox[hidden]{display:none}
.asst-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.asst-h button{background:none;border:0;color:inherit;cursor:pointer;font-size:16px}
.asst-m{flex:1;min-height:0;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.asst-msg{max-width:85%;padding:8px 10px;border-radius:12px;line-height:1.6;overflow-wrap:anywhere}
.asst-msg.bot{background:var(--panel-2);align-self:flex-start}
.asst-msg.me{background:var(--em);color:#000;align-self:flex-end}
.asst-msg button{margin-top:6px}
.asst-chips{display:flex;flex-wrap:wrap;gap:5px;padding:6px 10px;border-top:1px solid var(--line);max-height:90px;overflow:auto}
.asst-chips button{font-size:11.5px;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:inherit;cursor:pointer}
.asst-f{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.asst-f input{flex:1;min-width:0;padding:8px;border-radius:8px;border:1px solid var(--line);background:transparent;color:inherit}
.tapg{display:flex;flex-direction:column;align-items:center;gap:6px}
.tg{position:relative;width:110px;height:110px;overflow:hidden;background:linear-gradient(var(--c1),var(--c2)) bottom/100% calc(var(--p)*100%) no-repeat,rgba(255,255,255,.07);box-shadow:0 0 18px var(--gl)}
.tg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-100%);animation:tgs 2.6s infinite}
@keyframes tgs{to{transform:translateX(100%)}}
.tg-ring{border-radius:50%;background:conic-gradient(var(--c1) calc(var(--p)*360deg),rgba(255,255,255,.07) 0);-webkit-mask:radial-gradient(circle,transparent 52%,#000 54%);mask:radial-gradient(circle,transparent 52%,#000 54%)}
.tg-pill{width:170px;height:46px;border-radius:999px;background:linear-gradient(90deg,var(--c1),var(--c2)) left/calc(var(--p)*100%) 100% no-repeat,rgba(255,255,255,.07)}
.tg-tank{width:76px;height:130px;border-radius:14px 14px 26px 26px}
.tg-hex{clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);box-shadow:none;filter:drop-shadow(0 0 10px var(--gl))}
.tg-diamond{border-radius:14px;transform:rotate(45deg) scale(.78)}

function socFxStyle(fx,n,sec){const D=SOCFX[fx]||SOCFX.slideup,sl=100/n,T=+(n*sec).toFixed(2),id=('sf_'+fx+'_'+n+'_'+T).replace(/\./g,'_');

  const kf=(nm,fr)=>'@keyframes '+nm+'{'+fr.map(([f,c])=>pc(f)+'{'+(/opacity/.test(c)?c:c+';opacity:1')+'}').join('')+(sl<100?(sl+0.02).toFixed(3)+'%,100%{opacity:0}':'')+'}';
  const part=(p,sel)=>D[p]?kf(id+p,D[p])+'.'+id+' '+sel+'{animation:'+id+p+' '+T+'s linear var(--d) infinite both}':'';
  let css=kf(id+'c',D.c||[[0,'opacity:1'],[1,'opacity:1']])+'.'+id+' .sx{animation:'+id+'c '+T+'s linear var(--d) infinite both}'+part('i','.si')+part('l','.sot')+part('b','.sdc b')+part('s','.sdc i');
  if(D.fill)css+='.'+id+' .sdc b{border:0;background:var(--sb)}';
  if(D.bar===2)css+='.'+id+' .sdc{inset:0;width:auto;height:auto;margin:0;border-radius:inherit;overflow:hidden}.'+id+' .sdc b{inset:-10% auto -10% 40%;width:22%;border:0;border-radius:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent)}';

function chips(){const T=S.T,mins=Math.max(1,Math.round((Date.now()-S.start)/60000)),act=Object.keys(S.users).length;
  return [['مشاهد الحين',T.viewers],['أعلى مشاهدين',T.peak],['لايك',T.likes],['عملة',T.diamonds],['هدية',T.gifts],['متابع جديد',T.follows],['تعليق',T.comments],['مشاركة',T.shares],['متفاعل',act],['دقيقة',mins]]

const hms=ms=>{const t=Math.max(0,Math.floor(ms/1000));return pad2(Math.floor(t/3600))+':'+pad2(Math.floor(t%3600/60))+':'+pad2(t%60)};

function renderMarks(){const el=$('#marks');if(!el)return;el.innerHTML=S.marks.length?S.marks.slice().reverse().slice(0,40).map(m=>'<div class="mk"><span class="num">'+hms(m.ts-S.start)+'</span><span>'+esc(m.label)+'</span></div>').join(''):'<p class="hint">ما فيه لقطات للحين.</p>'}

  if(window.QRCode)go();else{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';sc.onload=go;document.head.appendChild(sc)}

function renderStats(){
  const lc=$('#liveChips');if(lc)lc.innerHTML=chips();renderSupporters();renderMarks();renderPointsTab();
  if(tab!=='stats'||!$('#stChips'))return;$('#stChips').innerHTML=chips();
  const now=Math.floor((Date.now()-S.start)/60000),mk=[];for(let i=Math.max(0,now-29);i<=now;i++)mk.push(S.tl[i]||{likes:0,diamonds:0});
  const bars=(k)=>{const mx=Math.max(1,...mk.map(x=>x[k]));return mk.map(x=>'<i style="height:'+(x[k]/mx*100).toFixed(1)+'%" title="'+fmt(x[k])+'"></i>').join('')};
  const ent=Object.entries(S.tl),tm=k=>{let b=null;ent.forEach(([m,x])=>{if(!b||x[k]>b[1][k])b=[m,x]});return b},clock=m=>new Date(S.start+m*60000).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const md=tm('diamonds'),ml=tm('likes'),mc=tm('comments');
  $('#moments').innerHTML=[[md,'diamonds','أكثر دقيقة دعم','عملة'],[ml,'likes','أكثر دقيقة تكبيس','لايك'],[mc,'comments','أكثر دقيقة تفاعل','تعليق']].map(([b,k,l,u])=>'<div><b class="num">'+(b?clock(+b[0]):'—')+'</b><span>'+l+(b?' · '+fmt(b[1][k])+' '+u:'')+'</span></div>').join('')+
    (S.big?'<div><b>'+esc(S.big.user)+'</b><span>أكبر هدية: '+esc(S.big.gift)+' · '+fmt(S.big.d)+' عملة</span></div>':'');
  $('#bD').innerHTML=bars('diamonds');$('#bL').innerHTML=bars('likes');
  $('#tP').innerHTML='<tr><th>المنصة</th><th class="num">رسائل</th><th class="num">متابعات</th><th class="num">اشتراكات</th><th class="num">هدايا</th></tr>'+PLAT_ROWS.map(([k,l])=>{const x=platSummary(k);return '<tr><td>'+l+'</td><td class="num">'+fmt(x.chat)+'</td><td class="num">'+fmt(x.follow)+'</td><td class="num">'+fmt(x.sub)+'</td><td class="num">'+fmt(x.gift)+'</td></tr>'}).join('');
  $('#tG').innerHTML=Object.entries(S.giftsByName).sort((a,b)=>b[1].diamonds-a[1].diamonds).slice(0,8).map(([n,g])=>'<tr><td>'+esc(n)+'</td><td class="num">×'+fmt(g.count)+'</td><td class="num">'+fmt(g.diamonds)+'</td></tr>').join('')||'<tr><td class="hint">ما فيه هدايا للحين</td></tr>';
  $('#tS').innerHTML=ranked('diamonds').slice(0,8).map((u,i)=>'<tr><td>'+(i+1)+'. '+esc(u.name)+'</td><td class="num">'+fmt(u.diamonds)+'</td></tr>').join('')||'<tr><td class="hint">—</td></tr>';
  $('#tF').innerHTML=S.followers.slice(0,8).map(f=>'<tr><td>'+esc(f.name)+'</td><td class="num">'+new Date(f.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</td></tr>').join('')||'<tr><td class="hint">—</td></tr>';
  $('#tH').innerHTML=(STATE.history||[]).map(h=>'<tr><td>'+esc(h.date)+'</td><td class="num">'+h.mins+' د</td><td class="num">'+fmt(h.likes)+' لايك</td><td class="num">'+fmt(h.diamonds)+' عملة</td><td>'+esc(h.top||'—')+'</td></tr>').join('')||'<tr><td class="hint">احفظ الجلسة من تبويب البث عشان تنضاف هنا.</td></tr>';
}
