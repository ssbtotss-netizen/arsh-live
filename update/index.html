<title>عرش اللايف</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: control room — tab nav + settings column beside a sticky 9:16 live scene preview; gold-on-plum, single dark look by choice. Overlays (#scene, #item-…) render the same scene full-window on a transparent page for OBS. */
:root{
  --ink:#05100d; --panel:#0a1a15; --panel-2:#0f241d; --line:#1a3a2f;
  --gold:#e2b865; --gold-hi:#f6dfa4; --gold-lo:#8d6b2a;
  --em:#2fd39a; --em-hi:#8ff0c8; --em-lo:#12704f;
  --text:#e9f3ed; --muted:#8aa699; --nav:#c4d6cc; --glow1:#0f3a2c; --glow2:#2a2210; --on-em:#05100d; --on-gold:#05100d; --em-hi2:#8ff0c8; --gold-hi2:#f6dfa4; --rose:#e8607a; --rose-hi:#ff93a8; --live:#3ee0a1; --bad:#f07b6b;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;
  background:radial-gradient(1100px 520px at 85% -12%,var(--glow1) 0%,transparent 62%),radial-gradient(700px 420px at 0% 110%,var(--glow2) 0%,transparent 60%),var(--ink);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
[hidden]{display:none!important}

/* ---------- dashboard shell ---------- */
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-family:var(--display);font-weight:700;font-size:28px;margin:0;line-height:1.1;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:0;color:var(--muted);font-size:13px}
.crest{width:42px;height:42px;flex:none}
.status{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.status.on .dot{background:var(--live);box-shadow:0 0 0 4px rgba(62,224,161,.18);animation:beat 1.6s infinite}
@keyframes beat{50%{box-shadow:0 0 0 8px rgba(62,224,161,0)}}
nav.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
nav.side .grp{display:flex;flex-direction:column;gap:2px}
nav.side .gl2{font-size:11.5px;color:var(--muted);letter-spacing:.04em;padding:0 10px 4px}
nav.side button{display:flex;align-items:center;gap:9px;text-align:right;border:1px solid transparent;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--nav);font-weight:600;font-size:14px}
nav.side button svg{width:17px;height:17px;flex:none;opacity:.75}
nav.side button:hover{background:var(--panel-2);color:var(--text)}
nav.side button[aria-selected="true"]{background:linear-gradient(90deg,color-mix(in srgb,var(--em) 6%,transparent),color-mix(in srgb,var(--em) 18%,transparent));border-color:color-mix(in srgb,var(--em) 35%,transparent);color:var(--em-hi)}
nav.side button[aria-selected="true"] svg{opacity:1}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 310px;gap:18px;align-items:start}
@media (max-width:1180px){.layout{grid-template-columns:minmax(0,1fr) 290px}nav.side{grid-column:1/-1;position:static;flex-direction:row;overflow-x:auto;padding:8px;gap:4px;scrollbar-width:thin}nav.side .grp{flex-direction:row;gap:4px}nav.side .gl2{display:none}nav.side button{flex:none;white-space:nowrap}}
.pv{position:sticky;top:12px;display:flex;flex-direction:column;gap:8px}
.pv .lbl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.pv .lbl b{font-family:var(--display);font-weight:500;color:var(--text);font-size:15px}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}.pv{position:static;max-width:300px;width:100%;margin:0 auto}}
.content{display:flex;flex-direction:column;gap:14px;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.card{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 40%),var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-family:var(--display);font-weight:500;font-size:17px;color:var(--gold-hi)}
.card h3{margin:0;font-size:14px;color:var(--text)}
.hint{margin:0;font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.field.wide{grid-column:1/-1}
.field input:not([type=checkbox]):not([type=range]):not([type=color]),.field select,.field textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--text);width:100%}
.field textarea{min-height:64px;resize:vertical}
.field input[type=color]{width:100%;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);padding:3px}
.field input[type=range]{width:100%;accent-color:var(--em)}
.field.bool{flex-direction:row;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--text);padding:6px 0}
.field .urlrow{display:flex;gap:6px}
.sw{position:relative;width:42px;height:24px;flex:none;appearance:none;-webkit-appearance:none;border-radius:999px;background:var(--line);cursor:pointer;margin:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:right .2s,background .2s}
.sw:checked{background:color-mix(in srgb,var(--em) 40%,transparent)}
.sw:checked::after{right:21px;background:var(--em-hi)}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13.5px;transition:border-color .15s}
.btn:hover{border-color:var(--em-lo)}
.btn.gold{background:linear-gradient(135deg,var(--em-hi2),var(--em));color:var(--on-em);border-color:transparent;box-shadow:0 6px 20px -8px color-mix(in srgb,var(--em) 70%,transparent)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.metal{background:linear-gradient(180deg,var(--gold-hi2),var(--gold));color:var(--on-gold);border-color:transparent}
.btn.rose{color:var(--rose-hi)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.grow{flex:1}
.msg{font-size:12.5px;color:var(--gold-hi);margin:0}
.listed{display:flex;flex-direction:column;gap:10px}
.li{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2);display:flex;flex-direction:column;gap:10px}
.li .lh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:13.5px}
.li .field input:not([type=checkbox]):not([type=range]):not([type=color]),.li .field select,.li .field textarea{background:var(--panel)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.chips div{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.chips b{font-family:var(--display);font-size:22px;font-weight:500;color:var(--em-hi);line-height:1.2}
.chips span{font-size:12px;color:var(--muted)}
.log{max-height:200px;overflow:auto;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.log b{color:var(--text);font-weight:600}
.copy{display:flex;gap:6px;align-items:stretch;min-width:0}
.copy code{color:var(--em-hi)!important;flex:1;min-width:0;display:block;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;direction:ltr;text-align:left;overflow-x:auto;white-space:nowrap;color:var(--gold-hi);font-size:12.5px}
.items{display:flex;flex-direction:column;gap:6px}
.irow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-size:13.5px}
.irow.sel{border-color:var(--em)}
.irow .nm{flex:1;min-width:0;cursor:pointer}
.qrow{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border-radius:8px;background:var(--panel-2)}
.qrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:6px;border-bottom:1px solid var(--line)}
.bars i{flex:1;min-width:2px;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));border-radius:3px 3px 0 0}
.bars.rose i{background:linear-gradient(180deg,var(--rose-hi),var(--rose))}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:5px 4px;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:left}
#ytbox{width:100%;aspect-ratio:16/9;max-width:100%;background:var(--panel-2);border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:12.5px;text-align:center;padding:8px;overflow:hidden}
#ytbox iframe{width:100%;height:100%;border:0}

/* ---------- home ---------- */
.hero{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:18px;border-radius:18px;border:1px solid color-mix(in srgb,var(--em) 30%,transparent);
  background:radial-gradient(500px 200px at 100% 0,color-mix(in srgb,var(--em) 18%,transparent),transparent 70%),radial-gradient(400px 200px at 0 100%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 70%),var(--panel)}
.qrbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qrbox #qr{background:#fff;padding:8px;border-radius:10px;line-height:0}
.qrbox #qr img,.qrbox #qr canvas{width:132px;height:132px}
.sb{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.sb button{padding:12px 8px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:600;font-size:13px}
.sb button:active{transform:scale(.96);border-color:var(--em)}
.mk{display:flex;gap:10px;align-items:center;font-size:13px;padding:6px 8px;border-radius:8px;background:var(--panel-2)}
.mk .num{color:var(--em-hi);font-weight:600}
.rq{display:flex;gap:8px;align-items:center;font-size:13px;padding:8px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.rq .nm{flex:1;min-width:0}
.rq.done{opacity:.5}
.hero h2{margin:0;font-family:var(--display);font-size:22px;font-weight:700;color:var(--text)}
.hero p{margin:2px 0 0;color:var(--muted);font-size:13px}
.hero .cn{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:240px;max-width:420px}
.hero .cn input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.check{display:flex;flex-direction:column;gap:6px}
.ck{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:7px 10px;border-radius:10px;background:var(--panel-2)}
.ck i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;flex:none}
.ck.ok i{background:rgba(62,224,161,.18);color:var(--live)}
.ck.wait i{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.ck span{flex:1}
.ck small{color:var(--muted);font-size:12px}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;text-align:right;font-weight:600;font-size:13.5px}
.qa button:hover{border-color:var(--em-lo);transform:translateY(-1px)}
.qa button small{font-weight:400;font-size:11.5px;color:var(--muted)}
.qa button b{font-size:18px;line-height:1;color:var(--em-hi)}
.qa button.hot b{color:var(--gold-hi)}
.qa button.pk b{color:var(--rose-hi)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.th{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--panel-2);cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:right;font-weight:600;font-size:13px}
.th[aria-pressed="true"]{border-color:var(--em);box-shadow:0 0 0 2px color-mix(in srgb,var(--em) 25%,transparent)}
.th .sw3{display:flex;height:26px;border-radius:7px;overflow:hidden}
.th .sw3 i{flex:1}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.presets button{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel-2);cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:2px;font-weight:600;font-size:13.5px}
.presets button small{color:var(--muted);font-weight:400;font-size:12px}
.presets button:hover{border-color:var(--em-lo)}

/* ---------- stage + widgets (em-based: stage font-size = width/28) ---------- */
.stage{--a0:#8d6b2a;--a1:#e2b865;--a2:#f6dfa4;--a3:#ff93a8;--pn:rgba(4,24,18,.78);--bd:rgba(47,211,154,.45);--hl:rgba(47,211,154,.2);--ink2:#04140f;position:relative;overflow:hidden;width:100%;aspect-ratio:9/16;border-radius:20px;border:1px solid var(--line);font-family:var(--body);direction:rtl;color:#fff;line-height:1.35;
  background:radial-gradient(70% 40% at 50% 45%,rgba(255,255,255,.06),transparent 70%),linear-gradient(180deg,#241c31 0%,#120f19 100%)}
.wi{position:absolute;min-height:1em}
.wi>.wb{width:100%;height:100%}
.wi.edit{outline:1px dashed rgba(214,176,102,.55);outline-offset:2px;cursor:grab;touch-action:none}
.wi.edit.sel{outline:2px solid var(--a2)}
.wi.off{opacity:.3}
.rz{position:absolute;left:-.45em;bottom:-.45em;width:1.1em;height:1.1em;min-width:14px;min-height:14px;border-radius:50%;background:var(--a2);border:.15em solid var(--ink2);box-shadow:0 0 .4em rgba(0,0,0,.6);cursor:nesw-resize;z-index:5;touch-action:none}
.wi:not(.sel) .rz{opacity:.55}
.wi[data-w="fireworks"],.wi[data-w="occdecor"]{pointer-events:none}
.edph{position:relative;margin-top:.2em}
#ytWrap{width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--panel-2)}
#ytWrap iframe{width:100%;height:100%;border:0}
.ph{font-size:.62em;color:var(--a2);background:var(--pn);border-radius:.4em;padding:.4em .6em;text-align:center}
.gl{background:var(--pn);border:.06em solid var(--bd);border-radius:.6em;backdrop-filter:blur(8px)}
.av{width:1.6em;height:1.6em;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;color:var(--ink2);flex:none;overflow:hidden;font-size:.9em}
.av img{width:100%;height:100%;object-fit:cover}

.cnt{display:flex;gap:.35em;justify-content:center;flex-wrap:wrap}
.cnt span{padding:.2em .65em;border-radius:99em;font-size:.72em;background:var(--pn);border:.06em solid var(--bd)}
.cnt b{color:var(--a2);font-weight:700}

.goal{padding:.4em .55em;display:flex;flex-direction:column;gap:.25em}
.goal .gh{display:flex;justify-content:space-between;align-items:center;font-size:.7em;font-weight:600}
.goal .lv{font-size:.85em;color:var(--ink2);background:var(--a2);border-radius:99em;padding:0 .5em}
.gbar{height:.5em;border-radius:99em;background:rgba(255,255,255,.12);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:99em;background:linear-gradient(90deg,var(--gc),#fff);transition:width .4s}
.goal .gn{font-size:.62em;color:#d9d2e4;text-align:center}
.goal.done{animation:gdone .9s ease 2}
@keyframes gdone{50%{box-shadow:0 0 1.2em var(--a2)}}

.taps{display:flex;flex-direction:column;align-items:center;gap:.3em}
.taps .lvl{font-family:var(--display);font-size:.62em;padding:.15em .8em;border-radius:99em;color:var(--ink2);background:linear-gradient(180deg,var(--a2),var(--a1))}
.ring{position:relative;width:62%;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:rgba(255,255,255,.1);stroke-width:12}
.ring .br{fill:none;stroke:var(--a3);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .35s}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:var(--display);font-size:1.35em;line-height:1;text-shadow:0 .1em .5em rgba(227,101,126,.6)}
.ring .of{font-size:.5em;color:#cfc6dc;margin-top:.3em}
.ring .h{color:var(--a3);font-size:.7em}
.combo{font-family:var(--display);font-size:.8em;color:var(--a3);text-shadow:0 0 .6em rgba(255,159,177,.6);min-height:1.2em}
.trows{width:100%;display:flex;flex-direction:column;gap:.2em}

.lb{padding:.45em;display:flex;flex-direction:column;gap:.15em}
.lb .lh{display:flex;align-items:center;gap:.35em;font-family:var(--display);font-size:.62em;color:var(--a2);padding-bottom:.35em;margin-bottom:.15em;border-bottom:.06em solid var(--bd)}
.lb .lh .n{margin-inline-start:auto;font-family:var(--body);font-size:.85em;color:#b7adc5}
.lr{display:flex;align-items:center;gap:.4em;font-size:.6em;padding:.15em .3em;border-radius:.4em}
.lr .rk{width:1.4em;height:1.4em;border-radius:.35em;display:grid;place-items:center;font-size:.85em;font-weight:700;background:rgba(255,255,255,.12);flex:none}
.lr.r1{background:var(--hl)}
.lr.r1 .rk{background:linear-gradient(180deg,var(--a2),var(--a1));color:var(--ink2)}
.lr.r2 .rk{background:#d6d2de;color:var(--ink2)}
.lr.r3 .rk{background:#d49a6e;color:var(--ink2)}
.lr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .ct{color:var(--a3);font-weight:700}
.lr .ct.g{color:var(--a2)}
.lb.dense .lr{font-size:.5em;padding:.05em .3em}

.sup{display:flex;flex-direction:column;gap:.35em;padding:.5em}
.sup .tt{text-align:center;font-family:var(--display);font-size:.72em;color:var(--a2)}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:.3em;margin-top:.6em}
.pod{display:flex;flex-direction:column;align-items:center;gap:.12em;text-align:center;min-width:0}
.pod .pa{position:relative;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:.8em;color:var(--ink2);border:.08em solid var(--a0)}
.pod .pa img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.pod.p1 .pa{width:2.3em;height:2.3em;border:.12em solid var(--a2);box-shadow:0 0 0 .2em var(--hl),0 .3em 1em var(--hl)}
.pod .crown{position:absolute;top:-.95em;left:50%;transform:translateX(-50%);width:1.3em}
.pod .nm{font-size:.5em;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .co{font-size:.48em;color:var(--a2)}
.pod .base{width:100%;border-radius:.35em .35em .15em .15em;display:grid;place-items:center;font-family:var(--display);color:var(--ink2);font-size:.7em}
.pod.p1 .base{height:2.1em;background:linear-gradient(180deg,var(--a2),var(--a1))}
.pod.p2 .base{height:1.45em;background:linear-gradient(180deg,#e6e3ec,#a9a3b6)}
.pod.p3 .base{height:1.05em;background:linear-gradient(180deg,#e6b48b,#a8693d)}
.pod.empty{opacity:.35}
.fxl{position:absolute;inset:0;pointer-events:none}
.throne{position:absolute;inset:-10% -5%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;text-align:center;border-radius:.6em;
  background:radial-gradient(circle,var(--hl),rgba(14,11,21,.92) 70%);animation:thr 3s ease forwards}
.throne svg{width:2.4em}

  background:linear-gradient(100deg,var(--ink2),var(--pn) 40%,var(--ink2));border:.1em solid var(--a2);box-shadow:0 0 1.2em var(--hl),inset 0 0 1em var(--hl);animation:a-slide .7s cubic-bezier(.2,1.2,.4,1) both}

/* board style: bubbles */
.bub{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:.5em .55em;padding-top:.3em}

.bb.b1 .ba em{background:#ffd166;color:#2a1d02}.bb.b2 .ba{border-color:#d6d6e0}.bb.b3 .ba{border-color:#d49a6e}

.bb .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:.55em;font-weight:700;text-shadow:0 .08em .3em rgba(0,0,0,.7)}
.bb .ct{color:var(--a3);font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 .08em .3em rgba(0,0,0,.7)}
/* board style: ticker */
.tk{display:flex;align-items:center;gap:.6em;padding:.35em .6em;font-size:.6em;overflow:hidden}
.tk .tl{flex:none;font-family:var(--display);color:var(--a2);display:flex;gap:.3em;align-items:center}
.tk .tv{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}

/* board style: medals */
.mds{display:flex;flex-direction:column;gap:.3em;padding:.45em}

.md.m1 .ml{background:radial-gradient(circle at 35% 30%,#fff7d1,#e2b13c 60%,#a8750f);color:#4a3300;box-shadow:0 0 .5em rgba(255,209,102,.7)}

.md.m3 .ml{background:radial-gradient(circle at 35% 30%,#ffe0c4,#c77a3e 60%,#7d4219);color:#3a1a06}

.md.m1{background:rgba(255,209,102,.16)}
.md .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.md .ct{color:var(--a3);font-weight:700}
/* ===== patch17: TikOverlay-style boards ===== */
.cv svg,.ic2{width:1em;height:1em;flex:none;vertical-align:-.12em}
.wrh{font-family:var(--display);font-size:.62em;color:var(--a2);display:flex;gap:.3em;align-items:center;justify-content:center;text-shadow:0 .08em .3em rgba(0,0,0,.6);margin-bottom:.2em}
/* wreath podium */
.wr{--w1:#c9a7ff;--wln:#b996ff;--wbg:rgba(38,16,70,.88);display:flex;flex-direction:column;align-items:center;gap:.2em}

.wr3{display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:end;gap:.15em;width:100%;padding-top:1.05em}
.wc{display:flex;flex-direction:column;align-items:center;gap:.2em;min-width:0;text-align:center}
.wf{position:relative;width:3.1em;aspect-ratio:1;display:grid;place-items:center;color:var(--w1);margin-bottom:.32em}

.wf .wcr{position:absolute;z-index:2;top:-.62em;left:50%;transform:translateX(-50%);width:1.35em;filter:drop-shadow(0 0 .3em var(--w1))}
.wf .wp{position:relative;z-index:1}
.wc .nm{max-width:100%;font-size:.5em;font-weight:700;line-height:1.55;padding:.08em .75em;border-radius:99em;background:var(--wbg);border:.08em solid var(--wln);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 0 .45em color-mix(in srgb,var(--w1) 45%,transparent)}
.wc .cv{font-size:.46em;font-weight:800;padding:.1em .65em;border-radius:99em;background:var(--wbg);border:.08em solid var(--wln);color:#fff;display:inline-flex;align-items:center;gap:.3em;direction:ltr;font-variant-numeric:tabular-nums}
.wc.empty{opacity:.42}
.wrest{display:flex;flex-direction:column;gap:.2em;width:100%;margin-top:.35em}
.wrr,.spr,.pl{display:flex;align-items:center;gap:.45em;font-size:.55em;padding-block:.22em;padding-inline:.3em .7em;border-radius:99em;background:var(--wbg,rgba(0,0,0,.55));border:.06em solid var(--wln,rgba(255,255,255,.25));color:#fff;animation:a-slide .45s both}
.wrr b,.spr b{min-width:1.2em;text-align:center;color:var(--w1,var(--a2));font-weight:800}
.wa{width:1.55em;height:1.55em;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none;font-weight:800;font-size:.85em;color:#1a1322}
.wa img{width:100%;height:100%;object-fit:cover}
.wrr .nm,.spr .nm,.pl .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.wrr .cv,.spr .cv,.pl .cv{display:inline-flex;align-items:center;gap:.25em;direction:ltr;font-weight:800;font-variant-numeric:tabular-nums}
/* cards */
.cds{display:flex;flex-direction:column;gap:.3em}
.cdr{display:flex;flex-wrap:wrap;justify-content:center;gap:.75em .35em;padding-top:.6em}
.cd{position:relative;width:4.3em;padding:1em .25em .4em;border-radius:.65em;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(0,0,0,.6));border:.07em solid rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;gap:.18em;font-size:.6em;box-shadow:0 .2em .6em rgba(0,0,0,.4);color:#fff;animation:a-zoom .45s both}
.cd .rb{position:absolute;top:-.6em;left:50%;transform:translateX(-50%);min-width:1.55em;height:1.55em;padding:0 .3em;border-radius:99em;display:grid;place-items:center;font-weight:800;font-size:.8em;background:var(--a1);color:var(--ink2)}
.cd .cp{position:relative;width:2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1a1322;border:.12em solid rgba(255,255,255,.6)}
.cd .cp img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cd .cp svg{position:absolute;top:-1em;width:1.3em}
.cd .nm{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.cd .cv{display:inline-flex;gap:.25em;align-items:center;direction:ltr;font-weight:800;color:var(--a2)}
.cd.c1{background:linear-gradient(180deg,rgba(255,209,102,.5),rgba(60,40,0,.8));border-color:#ffd166;box-shadow:0 0 .8em rgba(255,209,102,.5)}
.cd.c1 .rb{background:#ffd166;color:#2a1d02}.cd.c1 .cp{border-color:#ffd166}
.cd.c2{border-color:#d6d6e0}.cd.c2 .rb{background:#d6d6e0;color:#1d1d28}
.cd.c3{border-color:#d49a6e}.cd.c3 .rb{background:#d49a6e;color:#2a1406}
/* spotlight */
.spt{padding:.5em;display:flex;flex-direction:column;gap:.25em}
.sp1{position:relative;display:flex;align-items:center;gap:.6em;padding:.55em .6em;border-radius:.7em;background:linear-gradient(120deg,color-mix(in srgb,var(--a1) 45%,transparent),rgba(0,0,0,.45));border:.08em solid var(--a1);overflow:hidden;font-size:.7em}
.sp1 .sbeam{position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 70%,color-mix(in srgb,var(--a2) 40%,transparent) 80%,transparent 90%);animation:spin 6s linear infinite;pointer-events:none}
.sp1 .spp{position:relative;width:2.7em;height:2.7em;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#1a1322;border:.12em solid var(--a2);box-shadow:0 0 .8em var(--a1)}
.sp1 .spp img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.sp1 .spp svg{position:absolute;top:-.95em;width:1.4em;transform:rotate(-14deg)}
.sp1>div{position:relative;min-width:0;flex:1;display:flex;flex-direction:column}
.sp1 small{font-size:.6em;color:var(--a2)}
.sp1 b{font-family:var(--display);font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp1 .cv{display:inline-flex;gap:.25em;align-items:center;font-weight:800;color:var(--a2);direction:ltr;align-self:flex-end}
.spr{border-radius:.5em;background:rgba(0,0,0,.5);border-color:rgba(255,255,255,.12)}
.spr .cv{color:var(--a3)}
/* glass pills */
.pls{display:flex;flex-direction:column;gap:.25em}
.pl{--pc:rgba(255,255,255,.35);background:rgba(10,8,18,.6);backdrop-filter:blur(6px);border:.08em solid var(--pc)}
.pl .pk{width:1.45em;height:1.45em;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8em;background:var(--pc);color:#141018;flex:none}
.pl .wa{box-shadow:0 0 0 .1em var(--pc)}
.pl .cv{color:var(--pc)}
.pl.q1{--pc:#ffd166;box-shadow:0 0 .5em rgba(255,209,102,.45)}.pl.q2{--pc:#d6d6e0}.pl.q3{--pc:#e0a274}
.pl:not(.q1):not(.q2):not(.q3) .pk{background:rgba(255,255,255,.18);color:#fff}
.pl:not(.q1):not(.q2):not(.q3) .cv{color:var(--a3)}
/* follow / share alerts */
.fa{position:relative;display:flex;align-items:center;gap:.55em;font-size:.8em;--fc:var(--a1);max-width:100%;color:#fff}
.fa .fav{position:relative;width:2.6em;height:2.6em;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#1a1322}
.fa .fav img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.fa .ftx{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.fa .ftx b{font-family:var(--display);font-size:1.1em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:12em}
.fa .ftx small{font-size:.72em;opacity:.92}
.fa .fplus{position:absolute;bottom:-.3em;left:50%;transform:translateX(-50%);width:1.15em;height:1.15em;border-radius:50%;background:#fe2c55;color:#fff;display:grid;place-items:center;font-size:.7em;font-weight:900;border:.1em solid #fff;line-height:1}
.fa.out{animation:a-out .4s ease forwards}
.fa-pop{flex-direction:column;gap:.35em;text-align:center}
.fa-pop .fav{width:3.6em;height:3.6em;border:.14em solid var(--fc);box-shadow:0 0 1em var(--fc)}
.fa-pop .fav::before,.fa-pop .fav::after{content:"";position:absolute;inset:-.15em;border-radius:50%;border:.1em solid var(--fc);animation:fring 1.6s ease-out infinite}
.fa-pop .fav::after{animation-delay:.8s}
@keyframes fring{from{transform:scale(1);opacity:.9}to{transform:scale(1.75);opacity:0}}
.fa-pop .ftx{align-items:center;background:rgba(0,0,0,.62);padding:.25em 1em;border-radius:99em;border:.06em solid var(--fc)}
.fa-tiktok{background:#121212;padding-block:.4em;padding-inline:.4em .5em;border-radius:99em;box-shadow:-.15em 0 0 #25f4ee,.15em 0 0 #fe2c55,0 .3em 1em rgba(0,0,0,.5)}
.fa-tiktok .fav{border:.1em solid #fff}
.fa-tiktok .ftx b{text-shadow:-.06em 0 #25f4ee,.06em 0 #fe2c55}
.fa-tiktok .fbtn{margin-inline-start:.3em;background:#fe2c55;color:#fff;border-radius:.45em;padding:.3em .75em;font-weight:800;font-size:.75em;white-space:nowrap}
.fa-banner{justify-content:center;padding:.5em 2.2em;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--fc) 80%,#000) 14%,var(--fc) 50%,color-mix(in srgb,var(--fc) 80%,#000) 86%,transparent);color:var(--ink2);overflow:hidden}
.fa-banner .fav{border:.12em solid #fff;box-shadow:0 0 .6em rgba(255,255,255,.7)}
.fa-banner .ftx small:first-child{font-family:var(--display);font-size:.8em;opacity:1}
.fa-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);animation:shine 1.8s ease 2}
.fa-heart{flex-direction:column;text-align:center;gap:.3em}
.fa-heart .fhw{position:relative;width:3.9em;height:3.6em;filter:drop-shadow(0 0 .1em #fff) drop-shadow(0 0 .45em #ff5c8a)}
.fa-heart .fav{width:100%;height:100%;border-radius:0;clip-path:url(#hclip)}
.fa-heart .fav img{border-radius:0}
.fa-heart .fhw i{position:absolute;bottom:30%;font-style:normal;color:#ff5c8a;font-size:.9em;animation:fh 1.8s ease-out infinite;opacity:0}
@keyframes fh{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-3.2em) scale(1.25);opacity:0}}
.fa-heart .ftx{align-items:center;background:linear-gradient(90deg,#ff5c8a,#ff9fb1);padding:.22em 1em;border-radius:99em}
.fa-laurel{flex-direction:column;text-align:center;gap:.3em;--w1:var(--fc)}
.fa-laurel .wf{width:4em}
.fa-laurel .ftx{align-items:center;background:var(--pn);border:.08em solid var(--fc);padding:.22em 1em;border-radius:99em}
.al .aav{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:50%;overflow:hidden;vertical-align:-.25em;margin-inline-end:.3em;font-size:.85em;color:#1a1322}
.al .aav img{width:100%;height:100%;object-fit:cover}
/* dashboard: looks studio */
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg button{flex:1;min-width:120px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.seg button[aria-selected="true"]{border-color:var(--em);background:color-mix(in srgb,var(--em) 20%,var(--panel-2))}
.bst .stage.mini.al-pv{display:grid;place-items:center}
.tabdesc{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--em) 10%,var(--panel-2));border:1px solid var(--line);font-size:13.5px;line-height:1.6}
.tabdesc b{font-size:15px;display:block}
.advt{margin-top:8px;padding:8px 10px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;text-align:right}
.steps3{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;counter-reset:s}

.steps3 span{font-size:13px;color:var(--muted)}
/* tap widget styles */
.tpz{display:flex;flex-direction:column;align-items:center;gap:.25em;width:100%}
.tpz .lvl{font-family:var(--display);font-size:.55em;color:var(--a2);background:var(--pn);border:.06em solid var(--bd);padding:.1em .8em;border-radius:99em}
.tph{position:relative;width:60%;max-width:7em}
.tph svg{width:100%;display:block;filter:drop-shadow(0 0 .35em color-mix(in srgb,var(--a3) 70%,transparent))}
.tph .tv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:12%;text-shadow:0 .06em .3em rgba(0,0,0,.8)}
.tph .tv b{font-family:var(--display);font-size:1em}.tph .tv small{font-size:.45em;opacity:.9}
.tpb{width:100%;padding:.4em .55em;border-radius:.8em;font-size:.65em}
.tpb .tbh{display:flex;justify-content:space-between;align-items:center;gap:.4em;margin-bottom:.3em;font-weight:700}
.tpb .tbh b{font-family:var(--display);color:var(--a2)}
.tpb .tbt{position:relative;height:1.3em;border-radius:99em;background:rgba(255,255,255,.1);overflow:hidden;border:.06em solid var(--bd)}

.tpb .tbt span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:.8em;text-shadow:0 .06em .2em rgba(0,0,0,.8);direction:ltr}
.tpj{display:flex;align-items:flex-end;gap:.5em}
.tpj .jar{position:relative;width:2.6em;height:5em;border-radius:.7em .7em 1.1em 1.1em;border:.12em solid rgba(255,255,255,.75);overflow:hidden;background:rgba(255,255,255,.08);box-shadow:inset 0 0 .5em rgba(0,0,0,.4)}
.tpj .jar i{position:absolute;inset-inline:0;bottom:0;background:linear-gradient(0deg,var(--a3),var(--a1));transition:height .4s}

.tpj .jt{display:flex;flex-direction:column;gap:.1em;padding-bottom:.3em}
.tpj .jt b{font-family:var(--display);font-size:1em}.tpj .jt small{font-size:.45em;color:var(--a2)}
.tpn{text-align:center;line-height:1}

.tpn .nl i{display:block;height:100%;background:var(--a3);box-shadow:0 0 .4em var(--a3)}

/* ===== patch18: list colors + premium styles ===== */
.lcw{--a1:var(--lc1);--a2:color-mix(in srgb,var(--lc1) 40%,#fff);--a3:var(--lc3);--pn:color-mix(in srgb,var(--lc2) 45%,rgba(0,0,0,.78));--bd:color-mix(in srgb,var(--lc1) 60%,transparent);--hl:color-mix(in srgb,var(--lc1) 22%,transparent)}

.gcard{display:flex;flex-direction:column;gap:8px}
.ghd{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
/* girly common */
.gy{position:relative!important;z-index:5;display:flex;flex-direction:column;align-items:center;gap:.35em;text-align:center}
.gy .av2{width:5em;height:5em;border:.22em solid #fff;box-shadow:0 0 0 .14em #ff8fc8,0 0 1.2em #ff8fc8}
.gy small{font-family:var(--display);font-size:1.1em;color:#fff;text-shadow:0 .05em 0 #c2185b,0 0 .4em #ff8fc8}
.gy b{font-family:var(--display);font-size:2em;color:#fff;-webkit-text-stroke:.04em #d63384;paint-order:stroke fill;text-shadow:0 .07em 0 #ad1457,0 0 .5em #ffb3d9;max-width:22em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gy span{display:flex;align-items:center;gap:.3em;font-size:.85em;color:#ad1457;background:#fff;padding:.15em .9em;border-radius:99em;box-shadow:0 .1em .4em rgba(173,20,87,.3)}.gy .gim{width:1.4em;height:1.4em}
.gy .av2{animation:scPop .55s cubic-bezier(.2,1.5,.4,1) .2s both}.gy b{animation:scUp .45s .45s both}.gy span,.gy small{animation:scUp .45s .6s both}
/* bow */
.scn-bow{--sc:#ff6fb5;background:radial-gradient(circle,rgba(255,182,217,.45),rgba(255,105,180,.12) 60%,transparent 75%)}
.scn-bow .bw{position:relative!important;width:14em;height:6em;margin-bottom:-1.6em;z-index:6;animation:bwt .7s cubic-bezier(.2,1.5,.4,1) both}
.scn-bow .bw i{position:absolute;top:0;width:6.6em;height:6em;background:radial-gradient(circle at 30% 40%,#ffd1e8,#ff6fb5 55%,#d63384);box-shadow:inset 0 0 .6em rgba(0,0,0,.15),0 .2em .5em rgba(214,51,132,.4)}
.scn-bow .bw i.l{left:0;border-radius:50% 10% 10% 50%/60% 40% 40% 60%;transform-origin:100% 50%;animation:bwl .7s ease both}
.scn-bow .bw i.r{right:0;border-radius:10% 50% 50% 10%/40% 60% 60% 40%;transform-origin:0 50%;animation:bwr .7s ease both}
.scn-bow .bw em{position:absolute;left:50%;top:50%;width:2.4em;height:2.6em;margin:-1.3em 0 0 -1.2em;border-radius:.8em;background:radial-gradient(circle at 35% 35%,#ffe3f1,#e0408f);box-shadow:0 .1em .3em rgba(0,0,0,.25)}
.scn-bow .bw s{position:absolute;top:55%;width:1.5em;height:6em;background:linear-gradient(#ff6fb5,#d63384);text-decoration:none;clip-path:polygon(0 0,100% 0,100% 100%,50% 85%,0 100%)}
.scn-bow .bw s.a{left:40%;transform:rotate(18deg);transform-origin:top}.scn-bow .bw s.b{right:40%;transform:rotate(-18deg);transform-origin:top}
@keyframes bwt{from{transform:translateY(-14em) scale(.5)}}
@keyframes bwl{from{transform:scaleX(0) rotate(-40deg)}}@keyframes bwr{from{transform:scaleX(0) rotate(40deg)}}
.scn-bow .p{color:#fff;text-shadow:0 0 .3em #ff6fb5;font-size:var(--s,1.2em);animation:spk 1.2s ease-in-out var(--d) infinite both}
/* butterflies */
.scn-butterfly{--sc:#c58bff;background:radial-gradient(circle,rgba(230,200,255,.35),rgba(255,182,217,.12) 55%,transparent 75%)}
.scn-butterfly .p{font-size:var(--s);animation:bfly 3.2s ease-in-out var(--d) both}
@keyframes bfly{0%{transform:translate(0,0) rotate(0) scaleX(1);opacity:0}10%{opacity:1}25%{transform:translate(calc(var(--x)*.3),calc(var(--y)*.4)) rotate(10deg) scaleX(.4)}50%{transform:translate(calc(var(--x)*.6),calc(var(--y)*.6)) rotate(-8deg) scaleX(1)}75%{transform:translate(calc(var(--x)*.85),calc(var(--y)*.9)) scaleX(.4)}100%{transform:translate(var(--x),var(--y)) scaleX(1);opacity:0}}
.scn-butterfly .gy .av2{box-shadow:0 0 0 .14em #c58bff,0 0 1.2em #c58bff}
/* vanity mirror */
.scn-mirror{--sc:#ffd1e8;background:rgba(60,10,40,.35)}
.scn-mirror .mr{position:relative!important;z-index:5;width:15em;height:19em;border-radius:7.5em 7.5em 1.2em 1.2em;background:linear-gradient(160deg,#fff5fa,#ffd1e8);border:.45em solid #f5c2d8;box-shadow:0 0 0 .2em #fff,0 0 2em rgba(255,143,200,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;padding-top:1em;animation:scPop .55s cubic-bezier(.2,1.4,.4,1) both}
.scn-mirror .mr .av2{width:6.5em;height:6.5em;border:.2em solid #fff;box-shadow:0 .2em .6em rgba(173,20,87,.3)}
.scn-mirror .mr b{font-family:var(--display);font-size:1.7em;color:#ad1457;max-width:12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scn-mirror .mr span{display:flex;align-items:center;gap:.3em;font-size:.8em;color:#ad1457}.scn-mirror .mr .gim{width:1.3em;height:1.3em}
.scn-mirror .bulb{position:absolute;width:1em;height:1em;border-radius:50%;background:#fff8d6;box-shadow:0 0 .6em #ffe9a8,0 0 1.2em #ffd166;animation:blb 1s ease-in-out var(--d) infinite alternate}
@keyframes blb{from{opacity:.45}to{opacity:1}}
.scn-mirror .kiss{position:absolute;font-size:2.2em;animation:kss .4s cubic-bezier(.2,1.8,.4,1) var(--d) both}
@keyframes kss{from{transform:scale(3) rotate(-20deg);opacity:0}}
/* princess */
.scn-princess{--sc:#ffb3d9;background:linear-gradient(180deg,rgba(255,214,235,.45),rgba(206,170,255,.35))}
.scn-princess .cst{left:0;right:0;bottom:0;height:14em;background:rgba(255,255,255,.55);clip-path:polygon(0 100%,0 40%,6% 40%,6% 30%,10% 30%,10% 40%,18% 40%,18% 20%,22% 8%,26% 20%,26% 40%,38% 40%,38% 15%,44% 0,50% 15%,50% 40%,62% 40%,62% 20%,66% 8%,70% 20%,70% 40%,82% 40%,82% 30%,86% 30%,86% 40%,100% 40%,100% 100%);animation:cstu .8s ease both}
@keyframes cstu{from{transform:translateY(100%)}}
.scn-princess .tia{position:relative!important;width:7em;margin-bottom:-2em;z-index:6;animation:crd .6s cubic-bezier(.3,1.5,.5,1) .7s both;filter:drop-shadow(0 0 .4em #fff)}
.scn-princess .p{top:-2em;color:#fff;font-size:var(--s);text-shadow:0 0 .3em #ffb3d9;animation:cfa 3s linear var(--d) both}
/* kisses */
.scn-kisses{--sc:#ff2d75;background:radial-gradient(circle,rgba(255,45,117,.25),transparent 70%)}
.scn-kisses .p{font-size:var(--s);animation:kss .45s cubic-bezier(.2,1.8,.4,1) var(--d) both}
/* candy */
.scn-candy{--sc:#ff8fc8;background:linear-gradient(180deg,rgba(255,230,245,.45),rgba(200,240,255,.35))}
.scn-candy .p{top:-3em;font-size:2em;animation:cfa 3s linear var(--d) both}
.scn-candy .gy b{-webkit-text-stroke:0;color:#d63384;text-shadow:none;background:repeating-linear-gradient(-45deg,#fff 0 .5em,#ffd1e8 .5em 1em);padding:.15em .8em;border-radius:99em;border:.12em solid #ff8fc8}
/* flower wreath */
.scn-flowers{--sc:#ff6fa0;background:radial-gradient(circle,rgba(255,240,245,.5),rgba(255,182,217,.15) 55%,transparent 75%)}
.scn-flowers .fw{left:50%;top:var(--fy,40%);font-size:2em;margin:-.5em;animation:flw .45s cubic-bezier(.2,1.8,.4,1) var(--d) both}
@keyframes flw{from{transform:translate(var(--x),var(--y)) scale(0) rotate(-90deg)}to{transform:translate(var(--x),var(--y)) scale(1)}}
/* glitter holo */
.scn-glitter{--sc:#ffb3ec;background:linear-gradient(120deg,rgba(255,179,236,.35),rgba(179,229,255,.35),rgba(255,247,179,.3),rgba(214,179,255,.35));background-size:300% 300%;animation:hol 3s ease infinite,scOut .6s ease var(--dur) forwards}
@keyframes hol{50%{background-position:100% 100%}}
.scn-glitter .p{width:var(--s);height:var(--s);background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:spk 1s ease-in-out var(--d) infinite both;filter:drop-shadow(0 0 .2em #fff)}
.scn-glitter .gy b{background:linear-gradient(90deg,#ff8fd8,#8fd8ff,#fff08f,#d18fff,#ff8fd8);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:0;text-shadow:none;filter:drop-shadow(0 .05em 0 rgba(120,0,80,.6));animation:vsh 2s linear infinite,scUp .45s .45s both}
/* unicorn rainbow */
.scn-unicorn{--sc:#d18fff;background:rgba(255,240,250,.25)}
.scn-unicorn .rb{left:50%;top:44%;width:26em;height:26em;margin:-13em;border-radius:50%;background:radial-gradient(circle,transparent 52%,#ff6b9a 52% 56%,#ffb36b 56% 60%,#fff36b 60% 64%,#6bffb3 64% 68%,#6bc8ff 68% 72%,#b36bff 72% 76%,transparent 76%);clip-path:inset(0 0 50% 0);animation:rbw 1s ease both;opacity:.85}
@keyframes rbw{from{clip-path:inset(0 0 50% 100%)}}
.scn-unicorn .uni{right:-20%;top:36%;font-size:5em;animation:uni 1.4s cubic-bezier(.3,1,.5,1) .4s both}
@keyframes uni{from{transform:translateX(0)}to{transform:translateX(-13em)}}
.scn-unicorn .p{color:#fff;font-size:var(--s);text-shadow:0 0 .3em #d18fff;animation:spk 1.2s ease-in-out var(--d) infinite both}
/* perfume */
.scn-perfume{--sc:#e2b865;background:radial-gradient(circle,rgba(255,220,235,.35),rgba(80,20,50,.4) 70%)}
.scn-perfume .btl{left:12%;top:30%;font-size:5em;animation:scPop .5s both,btl .25s ease-in-out .6s 6 alternate;transform-origin:bottom}
@keyframes btl{to{transform:rotate(-8deg)}}
.scn-perfume .p{width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,182,217,.5) 50%,transparent 70%);animation:mst 1.8s ease-out var(--d) both}
@keyframes mst{from{transform:translate(0,0) scale(.3);opacity:0}20%{opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.6);opacity:0}}
.scn-perfume .gy{padding:1.2em 2em;border:.15em solid #e2b865;border-radius:1em;background:rgba(40,8,26,.6);box-shadow:inset 0 0 0 .3em rgba(226,184,101,.25)}
.scn-perfume .gy b{-webkit-text-stroke:0;color:#f6dfa4;text-shadow:0 0 .4em rgba(226,184,101,.6)}
.scn-perfume .gy .av2{box-shadow:0 0 0 .14em #e2b865,0 0 1.2em rgba(226,184,101,.6)}

.scn-flowers .fwr{position:relative;width:5em;height:5em}
.scn-flowers .fwr .av2{position:absolute;inset:0;animation:scPop .5s cubic-bezier(.2,1.5,.4,1) both}
.scn-flowers .fw{position:absolute;left:50%;top:50%;font-size:1.7em;margin:-.5em}

/* subscription */
.licchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.licchip.ok{border-color:color-mix(in srgb,var(--live,#2fd39a) 60%,transparent);color:var(--live,#2fd39a)}
.licchip.trial{border-color:#e2b865;color:#e2b865}
.licchip.bad{border-color:#ff5c7a;color:#ff5c7a;background:color-mix(in srgb,#ff5c7a 12%,var(--panel-2))}
.subwrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.subwrap{grid-template-columns:1fr}}
.prc{position:relative;overflow:hidden;border-radius:18px;padding:22px;border:1.5px solid #e2b865;background:radial-gradient(circle at 85% 0,rgba(226,184,101,.22),transparent 55%),var(--panel-2)}
.prc .tagx{position:absolute;top:14px;left:14px;background:#ff5c7a;color:#fff;font-weight:800;font-size:12px;border-radius:99px;padding:3px 10px}
.prc .pn{font-size:14px;color:var(--muted);font-weight:700}
.prc .pr{display:flex;align-items:baseline;gap:10px;margin:6px 0 4px;direction:ltr;justify-content:flex-end}
.prc .pr b{font-size:52px;line-height:1;font-weight:900;color:#f6dfa4}
.prc .pr s{font-size:22px;color:var(--muted)}
.prc .pr small{font-size:15px;color:var(--muted)}
.prc ul{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:7px;font-size:14px}
.prc li::before{content:"✓";color:#2fd39a;font-weight:900;margin-inline-end:8px}
.lstate{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);margin-bottom:12px}
.lstate .ic{font-size:28px}
.lstate b{display:block;font-size:16px}
.lstate span{font-size:13px;color:var(--muted)}
.paystep{display:grid;gap:10px;counter-reset:p;list-style:none;margin:0;padding:0}
.paystep li{counter-increment:p;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:14px}
.paystep li::before{content:counter(p);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--em);color:#04140f}
.bankbox{display:grid;gap:4px;margin-top:6px;padding:10px 12px;border-radius:10px;background:var(--panel);border:1px dashed var(--line);font-size:13px}
.bankbox code{direction:ltr;text-align:left;font-size:13px;user-select:all}
.licin{width:100%;min-height:74px;direction:ltr;text-align:left;font-family:monospace;font-size:12px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);resize:vertical}
.updban{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 18px;border-radius:16px;background:linear-gradient(135deg,#123a2c,#0b1f18);border:1.5px solid var(--em,#2fd39a);box-shadow:0 12px 40px rgba(0,0,0,.5);color:#fff;font-size:14px;max-width:min(92vw,720px)}
.updban span{opacity:.85}
/* donation tiers */
.dtl{display:grid;gap:8px}
.dtr{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line)}
.dtr.set{border-color:color-mix(in srgb,var(--em) 55%,transparent)}
.dta{display:inline-flex;align-items:center;gap:4px;font-size:18px;color:#2fd39a}.dta input{width:76px;font-weight:800;font-size:15px}
.dts,.dtv{display:inline-flex;align-items:center;gap:5px;flex:1 1 220px;min-width:0}.dts select,.dtv input{flex:1;min-width:0}
.dtr input,.dtr select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:13px}
/* donation guide */
.dnguide{display:grid;gap:8px;margin-top:12px}
.dnguide details{border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:10px 14px}
.dnguide summary{cursor:pointer;font-size:14px}
.dnguide ol{margin:10px 0 4px;padding-inline-start:22px;display:grid;gap:6px;font-size:13.5px}
/* unified chat */
.mch{display:flex;flex-direction:column;gap:.28em;font-size:.6em;color:#fff}
.mcm{display:flex;align-items:flex-start;gap:.4em;padding:.32em .55em;border-radius:.7em;animation:mcIn .35s cubic-bezier(.2,.8,.2,1) both;min-width:0}
@keyframes mcIn{from{opacity:0;transform:translateY(.5em)}}
.mlg{flex:none;width:1.45em;height:1.45em;border-radius:.42em;display:grid;place-items:center;background:var(--pb);color:var(--pf);box-shadow:0 .1em .3em rgba(0,0,0,.35)}.mlg svg{width:.95em;height:.95em}
.mav{flex:none;width:1.45em;height:1.45em;border-radius:50%;object-fit:cover}
.mbody{min-width:0;line-height:1.35;word-break:break-word}
.mnm{font-weight:900;margin-inline-end:.4em;color:var(--pa)}
.mtx{color:#fff}
.emo{height:1.35em;vertical-align:middle;margin:0 .08em}
.msc{font-style:normal;font-weight:900;margin-inline-end:.4em;color:#ffd166}
.mcm.sc{background:linear-gradient(135deg,rgba(255,179,0,.45),rgba(255,111,0,.35))!important;border:.08em solid #ffd166!important}
.mc-bubbles .mcm{background:rgba(0,0,0,.55)}
.mc-glass .mcm{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mc-clear .mcm{background:none;padding:.15em .2em;text-shadow:0 1px 2px #000,0 0 .5em rgba(0,0,0,.7)}
.mc-side .mcm{background:rgba(10,12,20,.7);border-radius:.3em;border-inline-start:.22em solid var(--pa)}
.mc-brand .mcm{background:linear-gradient(90deg,color-mix(in srgb,var(--pa) 45%,rgba(0,0,0,.6)),rgba(0,0,0,.55))}
.mc-neon .mcm{background:rgba(4,4,14,.6);border:.08em solid var(--pa);box-shadow:0 0 .5em color-mix(in srgb,var(--pa) 60%,transparent)}
.mc-dark .mcm{background:#18181bdd;border-radius:.3em}.mc-dark .mlg{border-radius:.25em}
.mc-compact{gap:.05em}.mc-compact .mcm{background:none;padding:.08em .2em;text-shadow:0 1px 2px #000}.mc-compact .mlg,.mc-compact .mav{width:1.15em;height:1.15em}
/* platform alerts */
.maq{display:grid;place-items:center}
.mal{display:flex;align-items:center;gap:.7em;padding:.6em 1.1em .6em .7em;border-radius:1em;color:#fff;animation:maIn .6s cubic-bezier(.2,1.4,.4,1) both;max-width:100%}
.mal.out{animation:maOut .45s ease forwards}
@keyframes maIn{from{opacity:0;transform:translateY(1em) scale(.85)}}
@keyframes maOut{to{opacity:0;transform:translateY(-.6em) scale(.95)}}
.mlb{position:relative;flex:none;width:3.2em;height:3.2em}
.mlc{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:var(--pb);color:var(--pf);box-shadow:0 0 0 .14em rgba(255,255,255,.85),0 .3em .8em rgba(0,0,0,.45);animation:mlPop .6s cubic-bezier(.2,1.6,.4,1) .1s both}
.mlc svg{width:1.7em;height:1.7em}
.mrg{position:absolute;inset:0;border-radius:50%;border:.18em solid var(--pa);animation:mlRing .9s ease-out .15s both}
@keyframes mlPop{from{transform:scale(0) rotate(-90deg)}}
@keyframes mlRing{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
.mtxt{display:grid;gap:.05em;min-width:0}
.mh{font-size:1.05em;font-weight:900;color:var(--pa)}
.mu{font-size:1.35em;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms{font-size:.8em;opacity:.85;font-weight:700}
.mm{font-size:.8em;margin-top:.15em;opacity:.95}
.mal.pv{animation:none}.mal.pv .mlc,.mal.pv .mrg{animation:none}.mal.pv .mrg{opacity:0}
.ml-brand{background:linear-gradient(135deg,color-mix(in srgb,var(--pa) 55%,#0b0c12),#0b0c12 80%);border:.1em solid var(--pa);box-shadow:0 .4em 1.4em rgba(0,0,0,.5)}
.ml-burst{background:rgba(10,10,18,.85);border-radius:99em;animation:maGrow .7s cubic-bezier(.2,1,.3,1) both}
@keyframes maGrow{from{clip-path:inset(-2em -2em -2em calc(100% - 4.2em));opacity:1}}
.ml-banner{border-radius:.3em;padding:.5em 1.6em .5em .7em;background:linear-gradient(90deg,var(--pb),color-mix(in srgb,var(--pb) 40%,#000));animation:maSlide .55s cubic-bezier(.2,1,.3,1) both}.ml-banner .mh{color:#fff}
@keyframes maSlide{from{transform:translateX(110%);opacity:0}}
.ml-glass{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ml-neon{background:rgba(4,4,14,.75);border:.12em solid var(--pa);box-shadow:0 0 1em var(--pa),inset 0 0 .6em color-mix(in srgb,var(--pa) 40%,transparent)}.ml-neon .mu{text-shadow:0 0 .4em var(--pa)}
.ml-gold{background:linear-gradient(160deg,#3a2a0e,#120c03);border:.12em solid #e2b865;box-shadow:0 0 1em rgba(226,184,101,.4)}.ml-gold .mh{color:#f6dfa4}.ml-gold .mu{background:linear-gradient(180deg,#fff3c4,#e2b865);-webkit-background-clip:text;background-clip:text;color:transparent}
.ml-minimal{background:none;text-shadow:0 1px 3px #000,0 0 .6em rgba(0,0,0,.7)}
.ml-cute{background:#ffe3ef;color:#b03a6f;border:.12em dashed #ff8fbf;box-shadow:0 .3em .8em rgba(255,105,170,.35)}.ml-cute .mh{color:#e23d86}
/* accounts link */
.mlink{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer}

    selItem=it.id;$$('#pvStage .wi').forEach(x=>x.classList.toggle('sel',x===el));const g=LAY==='h'?(it.lh=Object.assign({},autoH(it),it.lh||{})):it;drag={el,it:g,sx:e.clientX,sy:e.clientY,x:g.x,y:g.y,w:st.width,h:st.height,rz:!!e.target.closest('.rz'),w0:g.w2,s0:+g.scale||1};el.setPointerCapture(e.pointerId);e.preventDefault()});

  ['day','week','month'].forEach(k=>{$('#ld-'+k).innerHTML=rankedP('diamonds',k).slice(0,8).map((u,i)=>'<tr><td>'+(i+1)+'. '+esc(u.name)+badge(u.name)+'</td><td class="num">'+fmt(u.v)+'</td></tr>').join('')||'<tr><td class="hint">ما فيه دعم للحين</td></tr>'});
  const g=(STATE.ledger.big||{})[weekKey(Date.now())];
  $('#bigW').innerHTML=g?'<div class="qrow"><span class="nm"><b>'+esc(g.user)+'</b> · '+esc(g.gift)+'</span><span class="num" style="color:var(--gold-hi)">'+fmt(g.d)+' عملة</span></div>':'<p class="hint">ما فيه هدايا هالأسبوع.</p>';
}
function renderStats(){
  const lc=$('#liveChips');if(lc)lc.innerHTML=chips();renderSupporters();renderMarks();renderPointsTab();
  if(tab!=='stats'||!$('#stChips'))return;$('#stChips').innerHTML=chips();
  const now=Math.floor((Date.now()-S.start)/60000),mk=[];for(let i=Math.max(0,now-29);i<=now;i++)mk.push(S.tl[i]||{likes:0,diamonds:0});
  const bars=(k)=>{const mx=Math.max(1,...mk.map(x=>x[k]));return mk.map(x=>'<i style="height:'+(x[k]/mx*100).toFixed(1)+'%" title="'+fmt(x[k])+'"></i>').join('')};
  const ent=Object.entries(S.tl),tm=k=>{let b=null;ent.forEach(([m,x])=>{if(!b||x[k]>b[1][k])b=[m,x]});return b},clock=m=>new Date(S.start+m*60000).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const md=tm('diamonds'),ml=tm('likes'),mc=tm('comments');
  $('#moments').innerHTML=[[md,'diamonds','أكثر دقيقة دعم','عملة'],[ml,'likes','أكثر دقيقة تكبيس','لايك'],[mc,'comments','أكثر دقيقة تفاعل','تعليق']].map(([b,k,l,u])=>'<div><b class="num">'+(b?clock(+b[0]):'—')+'</b><span>'+l+(b?' · '+fmt(b[1][k])+' '+u:'')+'</span></div>').join('')+
    (S.big?'<div><b>'+esc(S.big.user)+'</b><span>أكبر هدية: '+esc(S.big.gift)+' · '+fmt(S.big.d)+' عملة</span></div>':'');
  $('#bD').innerHTML=bars('diamonds');$('#bL').innerHTML=bars('likes');
  $('#tG').innerHTML=Object.entries(S.giftsByName).sort((a,b)=>b[1].diamonds-a[1].diamonds).slice(0,8).map(([n,g])=>'<tr><td>'+esc(n)+'</td><td class="num">×'+fmt(g.count)+'</td><td class="num">'+fmt(g.diamonds)+'</td></tr>').join('')||'<tr><td class="hint">ما فيه هدايا للحين</td></tr>';
  $('#tS').innerHTML=ranked('diamonds').slice(0,8).map((u,i)=>'<tr><td>'+(i+1)+'. '+esc(u.name)+'</td><td class="num">'+fmt(u.diamonds)+'</td></tr>').join('')||'<tr><td class="hint">—</td></tr>';
  $('#tF').innerHTML=S.followers.slice(0,8).map(f=>'<tr><td>'+esc(f.name)+'</td><td class="num">'+new Date(f.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+'</td></tr>').join('')||'<tr><td class="hint">—</td></tr>';
  $('#tH').innerHTML=(STATE.history||[]).map(h=>'<tr><td>'+esc(h.date)+'</td><td class="num">'+h.mins+' د</td><td class="num">'+fmt(h.likes)+' لايك</td><td class="num">'+fmt(h.diamonds)+' عملة</td><td>'+esc(h.top||'—')+'</td></tr>').join('')||'<tr><td class="hint">احفظ الجلسة من تبويب البث عشان تنضاف هنا.</td></tr>';
}
function saveSession(){
  const T=S.T,top=ranked('diamonds')[0];
  const h={date:new Date().toLocaleDateString('en-GB')+' '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),mins:Math.max(1,Math.round((Date.now()-S.start)/60000)),likes:T.likes,diamonds:T.diamonds,follows:T.follows,top:top?top.name:''};
  STATE.history=[h].concat(STATE.history||[]).slice(0,30);
  bus.send({type:'state',key:'history',val:STATE.history});if(!IS_SERVER)try{localStorage.setItem('arsh2-hist',JSON.stringify(STATE.history))}catch(e){}
  bus.send({type:'reset'});logEv('تم حفظ الجلسة وتصفير اللايف');
}

/* ================= simulation ================= */
let auto=!IS_SERVER;
const NAMES=['نواف','ريم','فهد_77','أبو سلطان','لمى','تركي','جود','سعود','مشاعل','بندر','غلا','عبدالعزيز'];
const GIFTS=[['وردة',1],['قلب',5],['دونات',30],['نظارة',199],['سيارة',7000],['أسد',29999]];
const CHATS=['هلا والله','كفو عليك','متى اللايف الجاي؟','وش سنابك','!taps','!top','الله يعطيك العافية','!sr محمد عبده الأماكن','!sr طلال مداح مقادير','حيّاك يا الغالي'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sim=ev=>bus.send({type:'sim',ev});
function simulate(k){const n=pick(NAMES);if(k==='donate')return sim({type:'donation',user:n,amount:pick([5,10,20,50]),currency:'USD',msg:pick(['كفو عليك','استمر يا وحش','أحلى بث','']),source:'test'});
  if(k==='like')for(let i=0;i<5;i++)sim({type:'like',user:pick(NAMES),count:20});
  else if(k==='rose')sim({type:'gift',user:n,gift:'وردة',diamonds:1,count:10});
  else if(k==='lion')sim({type:'gift',user:n,gift:'أسد',diamonds:29999,count:1});
  else if(k==='follow')sim({type:'follow',user:n+'_'+Math.floor(Math.random()*99)});
  else if(k==='share')sim({type:'share',user:n});
  else if(k==='chat')sim({type:'chat',user:n,text:pick(CHATS)});
  else if(k==='song')sim({type:'chat',user:n,text:(SET.music.cmd||'!sr')+' '+pick(['محمد عبده الأماكن','طلال مداح مقادير','عبادي الجوهر تدري ليش'])});
  else if(k==='bot')sim({type:'chat',user:n,text:'متى اللايف الجاي؟'});
  else if(k==='fw')FX('fireworks',SET.fireworks.amount);
  else if(k==='wheel')sim({type:'wheel',user:'المضيف'});
  else if(k==='quiz')nextQuestion();
  else if(k==='auction')sim(Object.assign({type:'auction',action:'start'},SET.auction));
  else if(k==='joinAll')sim({type:'join',user:pick(NAMES),test:true});
  else if(k==='join'){const v=SET.entrance.vip[0];sim({type:'join',user:v?v.name:pick(NAMES),test:true});if(v)S.entered[v.name]=0}
  else if(k==='mark')sim({type:'mark',label:'لقطة يدوية'});
  else if(k==='poll')sim({type:'poll',action:'start',q:SET.poll.q,options:String(SET.poll.options).split(/\n+/).map(x=>x.trim()).filter(Boolean),seconds:SET.poll.seconds});
  else if(k==='thanks')sim({type:'thanks',secs:SET.thanks.secs});
  else if(k==='battle')sim(Object.assign({type:'battle',action:'start'},SET.battle));
  else if(k==='timer')sim(S.tm?{type:'timer',action:S.tm.run?'pause':'resume'}:{type:'timer',action:'start',minutes:SET.timer.minutes,title:SET.timer.title});
}
function tick(){
  if(auto&&!live&&IS_DASH){
    for(let i=0;i<3;i++)if(Math.random()<.8)sim({type:'like',user:pick(NAMES),count:1+Math.floor(Math.random()*12)});
    if(Math.random()<.15){const g=Math.random()<.92?pick(GIFTS.slice(0,4)):pick(GIFTS.slice(4));sim({type:'gift',user:pick(NAMES),gift:g[0],diamonds:g[1],count:g[1]>100?1:1+Math.floor(Math.random()*5)})}
    if(Math.random()<.12)sim({type:'chat',user:pick(NAMES),text:S.qz&&Date.now()<S.qz.end&&Math.random()<.7?pick(['أ','ب','ج','د']):S.pl&&Date.now()<S.pl.end&&Math.random()<.6?String(1+Math.floor(Math.random()*S.pl.opts.length)):S.bt&&Math.random()<.6?pick([S.bt.ka,S.bt.kb]):pick(CHATS.filter(c=>!c.startsWith('!sr')))});
    if(Math.random()<.04)sim({type:'join',user:pick(NAMES)});
    if(Math.random()<.03)sim({type:'follow',user:pick(NAMES)+'_'+Math.floor(Math.random()*99)});
    if(Math.random()<.1){const v=Math.max(20,(S.T.viewers||140)+Math.round((Math.random()-.45)*12));sim({type:'viewers',count:v})}
  }
  setTimeout(tick,600);
}

/* ================= loop ================= */
let lastStats=0;
let lastR=0;
(function frame(t){
  if(dirty&&t-lastR>=(OV?100:140)){lastR=t;dirty=false;renderWidgets();if(IS_DASH&&t-lastStats>1000){lastStats=t;renderStats()}}
  requestAnimationFrame(frame);
})(0);
setInterval(()=>{if(IS_DASH)renderStats()},5000);
let lastOcc=null;
setInterval(()=>{occC.t=0;const k=occKey();if(lastOcc!==null&&k!==lastOcc){remountAll();if(IS_DASH){syncPool();saveSet();if(tab==='occasions')drawOccNow()}}lastOcc=k},60000);
setInterval(()=>{if(IS_DASH&&tab==='occasions')drawOccNow()},1000);
setInterval(()=>{const n=Date.now();if(occKey()==='ramadan'||(S.qz&&n-S.qz.end<13000)||(S.au&&n-S.au.end<16000)||(S.pl&&n-S.pl.end<16000)||(S.ty&&n<S.ty.end+500)||(S.ch&&n-S.ch.end<16000)||(S.bt&&n-S.bt.end<16000)||(S.tm&&S.tm.run))dirty=true},250);

/* ================= init ================= */
if(OV){document.body.classList.add('ov','ovlite')}
else{try{tab=localStorage.getItem('arsh3-tab')||'home';if(!TABS.some(t=>t[0]===tab))tab='home'}catch(e){}buildNav();buildTab();drawLic()}
if(!SET.chatbot.pool)syncPool();
if(IS_DASH){applyUI();$('#uiBtn').onclick=()=>{go('scene');setTimeout(()=>{const u=$('#uiCard');if(u)u.scrollIntoView({behavior:'smooth',block:'start'})},60)}}
remountAll();
if(IS_SERVER)connectWS();
else if(IS_DASH){
  // first frame shows a working stream
  [['نواف',60],['ريم',51],['فهد_77',42],['لمى',33],['تركي',24]].forEach(([n,c])=>handle({type:'like',user:n,count:c,ts:Date.now()},true));
  [['أبو سلطان',3000],['ريم',1990],['جود',990],['سعود',450],['بندر',150]].forEach(([n,c])=>handle({type:'gift',user:n,gift:'هدية',diamonds:c,count:1,ts:Date.now()},true));
  [['جود','هلا والله'],['سعود','كفو عليك'],['لمى','متى اللايف الجاي؟']].forEach(([n,t])=>handle({type:'chat',user:n,text:t,ts:Date.now()},true));
  S.T.viewers=S.T.peak=148;STATE.music={now:{id:'',title:'محمد عبده — الأماكن',user:'ريم'},queue:[]};simEnd=setTimeout(musicNext,25000);S.marks=[];
}
tick();
})();
</script>
