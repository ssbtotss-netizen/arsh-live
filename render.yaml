# Render Blueprint — B6O6 Streaming (خادم Node واحد: Next.js + WebSocket + اتصالات TikTok) + PostgreSQL
# الأسرار لا تُكتب هنا: sync:false = تُدخل من لوحة Render. APP_SECRET يولّده Render تلقائياً.
databases:
  - name: b6o6-db
    plan: basic-256mb
    databaseName: b6o6
    user: b6o6
services:
  - type: web
    name: b6o6-streaming
    runtime: node
    plan: starter            # لا ينام — ضروري لروابط OBS واتصال البث المباشر
    rootDir: arsh-live
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma db push --skip-generate && npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WS_NO_BUFFER_UTIL
        value: "1"
      - key: WS_NO_UTF_8_VALIDATE
        value: "1"
      - key: DATABASE_URL
        fromDatabase: { name: b6o6-db, property: connectionString }
      - key: APP_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: TIKTOK_SIGN_API_KEY
        sync: false
      - key: STREAMLABS_CLIENT_ID
        sync: false
      - key: STREAMLABS_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
