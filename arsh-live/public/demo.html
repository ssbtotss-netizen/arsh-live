<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B6O6 Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Changa:wght@500;600;700;800&family=Orbitron:wght@600;800;900&family=Amiri:wght@700&display=swap">
<style>
:root{--bg:#04060c;--bg2:#080c18;--card:#0b1120;--card2:#111a30;--line:#1b2744;--tx:#eef3ff;--mut:#8794b4;--gold:#2f7bff;--gold2:#1546c9;--acc:#2f7bff;--ok:#34d399;--bad:#f87171}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;font-size:14px}
button,input,select{font:inherit;color:inherit}
a{color:var(--gold)}
/* ===== App shell ===== */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#070b16,#04060c);border-left:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .lg{width:46px;height:46px;flex:none;filter:drop-shadow(0 0 10px #2f7bff88)}.brand .lg img{width:100%;height:100%;object-fit:contain}.brand b{font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,#fff,#c9d6f2 50%,#2f7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand b{font-size:17px;letter-spacing:.3px}.brand small{display:block;color:var(--mut);font-size:11px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:10px 12px;border-radius:12px;color:var(--mut);cursor:pointer;text-align:right;font-size:14px}
.nav button:hover{background:#ffffff08;color:var(--tx)}
.nav button.on{background:linear-gradient(90deg,#2f7bff14,#2f7bff2a);color:var(--gold);box-shadow:inset -3px 0 0 var(--gold)}
.nav .ic{width:22px;text-align:center;font-size:15px}
.main{padding:22px 26px 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0}
.top p{margin:4px 0 0;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:#555}.dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:linear-gradient(180deg,var(--card),#080d1a);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat .k{color:var(--mut);font-size:12px}.stat .v{font-size:26px;font-weight:800;margin-top:6px}
.stat .v.gold{background:linear-gradient(90deg,#ffffff,#c9d6f2 40%,#2f7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#3a3a52}
.btn.pri{background:linear-gradient(135deg,#3d8bff,#1546c9);color:#fff;border:0;font-weight:700;box-shadow:0 6px 20px -8px #2f7bffaa}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn.dng{color:var(--bad)}
.btn.on{border-color:var(--gold);color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)}.small{font-size:12px}
.fld{display:grid;gap:6px;margin-bottom:12px}
.fld label{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.inp,select.inp{width:100%;background:#060a14;border:1px solid var(--line);border-radius:10px;padding:8px 10px;outline:none}
.inp:focus{border-color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:10px;background:#060a14;padding:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mut);font-weight:500;font-size:12px}
.tav{width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-left:8px}
.note{background:#2f7bff10;border:1px solid #2f7bff33;color:#cfe0ff;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.8}
.code{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:11px;background:#060a14;border:1px solid var(--line);border-radius:10px;padding:8px 10px;word-break:break-all;max-height:64px;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0e1630;border:1px solid var(--gold);color:var(--tx);padding:10px 18px;border-radius:12px;z-index:999;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.empty{color:var(--mut);text-align:center;padding:20px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#ffffff0d;color:var(--mut)}
/* ===== Studio ===== */
.studio{display:grid;grid-template-columns:200px 1fr 290px;gap:14px;align-items:start}
.st-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.layers .ly{display:flex;align-items:center;gap:6px;padding:8px;border-radius:10px;cursor:pointer;border:1px solid transparent;font-size:13px}
.layers .ly:hover{background:#ffffff08}.layers .ly.sel{border-color:var(--gold);background:#2f7bff10}
.layers .ly .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{background:none;border:0;cursor:pointer;padding:2px 4px;border-radius:6px;opacity:.75;font-size:13px}.ib:hover{opacity:1;background:#ffffff10}.ib.off{opacity:.3}
.stagewrap{display:flex;justify-content:center;align-items:flex-start;min-height:200px}
.stage-outer{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 20px 60px -20px #000}
.stage{position:absolute;top:0;left:0;transform-origin:0 0;direction:ltr;
 background:radial-gradient(ellipse at 50% 30%,#0f2147 0,#070d1d 55%,#03050b 100%)}
.stage.chk{background:repeating-conic-gradient(#101830 0 25%,#0a1022 0 50%) 0 0/60px 60px}
.stage .wd{cursor:move}
.stage .wd.sel{outline:3px solid #2f7bff;outline-offset:6px}
.stage .wd.locked{cursor:default}
.stage .wd.hid{opacity:.22!important;outline:2px dashed #888}
.rh{position:absolute;width:34px;height:34px;right:-17px;bottom:-17px;background:#2f7bff;border:4px solid #020611;border-radius:50%;cursor:nwse-resize;z-index:5;display:none}
.wd.sel .rh{display:block}.wd.locked .rh{display:none!important}
.lockb{position:absolute;top:-16px;left:-16px;background:#020611;color:#2f7bff;border-radius:50%;width:34px;height:34px;display:none;place-items:center;font-size:18px;z-index:5}
.wd.locked .lockb{display:grid}
.posgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.posgrid button{padding:8px 4px;font-size:11px;border-radius:9px;border:1px solid var(--line);background:#060a14;cursor:pointer}
.posgrid button.on{border-color:var(--gold);color:var(--gold)}
.testbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding:12px;border:1px dashed #2f7bff55;border-radius:14px;background:#2f7bff08}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.libc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}
.libc:hover{border-color:#2f7bff88;transform:translateY(-2px)}
.libc.on{border-color:var(--gold);box-shadow:0 0 0 2px #2f7bff55}
.libc .pv{height:250px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#0f2147,#05080f)}
.libc .pv .stage{background:none}
.libc .meta{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.libc .meta b{font-size:13px}
.ttl{font-size:12px;color:var(--mut);margin:16px 0 8px}
.feed{max-height:330px;overflow:auto;display:grid;gap:6px}
.feed div{background:#060a14;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px}
.bars i{flex:1;background:linear-gradient(0deg,#1546c9,#6aa8ff);border-radius:6px 6px 2px 2px;min-height:2px}
.mobnav{display:none}
.modal{position:fixed;inset:0;background:#000b;z-index:900;display:grid;place-items:center;padding:16px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:300px;max-width:96vw;max-height:94vh;overflow:auto}
.mbox p{margin:0 0 10px}
.pvbox{position:relative;overflow:hidden;border-radius:10px;background:repeating-conic-gradient(#101830 0 25%,#0a1022 0 50%) 0 0/24px 24px;margin:0 auto}
@media (max-width:1150px){.studio{grid-template-columns:1fr}.layers{order:3}.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{display:none}.mobnav{display:flex;gap:6px;overflow:auto;padding:10px;position:sticky;top:0;background:#04060cee;z-index:50;border-bottom:1px solid var(--line)}
.mobnav button{flex:none;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;cursor:pointer}.mobnav button.on{border-color:var(--gold);color:var(--gold)}
.main{padding:14px}.g3,.g2{grid-template-columns:1fr}}


body{background:radial-gradient(ellipse at 80% -10%,#0d2a6b55,transparent 50%),var(--bg)}

.top h1,.card h3,.brand b,.stat .v,.mbox b,.btn.pri{font-family:"Changa","Readex Pro",Tahoma,sans-serif}
.top h1{font-weight:700;font-size:24px}.card h3{font-weight:600}.stat .v{font-weight:700}

/* ============ OVERLAY WIDGETS (shared by editor, previews and OBS) ============ */
body.ov{background:transparent!important;overflow:hidden}
body.ov .stage{background:transparent!important}
.wd{position:absolute;direction:rtl;color:var(--tx2,#fff);font-family:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;--a:var(--acc,#e8c46a);user-select:none}
.wd .in{position:absolute;inset:0;display:flex;flex-direction:column;padding:var(--pad);gap:var(--gap)}
.wd .wt{height:var(--tth);flex:none;display:flex;align-items:center;justify-content:center;gap:.35em;font-weight:800;font-size:calc(var(--tth)*.46);white-space:nowrap;overflow:hidden}
.wd .wt svg{height:.95em;width:auto}
.wd .rows{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap)}
.wd .r{position:relative;display:flex;align-items:center;gap:calc(var(--rh)*.16);height:var(--rh);padding:0 calc(var(--rh)*.22);font-size:var(--fs);flex:none;will-change:transform}
.wd .rk{flex:none;width:calc(var(--fs)*1.7);height:calc(var(--fs)*1.7);display:grid;place-items:center;font-weight:900;border-radius:50%;font-size:calc(var(--fs)*.9)}
.wd .av{flex:none;position:relative;width:var(--av);height:var(--av)}
.wd .av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;position:relative;z-index:1}
.wd .crown{position:absolute;z-index:3;width:70%;left:15%;top:-46%;color:#ffd75e;filter:drop-shadow(0 2px 4px #0009);display:none}
.wd .r1 .crown{display:block}
.wd .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.wd .vl{flex:none;font-weight:900;display:flex;align-items:center;gap:.25em;direction:ltr}
.wd .vl svg{height:.85em;width:auto}
.wd .sb{display:none;font-size:.62em;opacity:.75}
.wd .step{display:none}
.wd .r.emp .crown,.wd .r.emp .av::before{display:none!important}.wd .r.emp{opacity:.35}.wd .r.emp .av img{filter:grayscale(1)}
/* leader shine ring */
.wd .r1 .av::before{content:"";position:absolute;inset:-9%;border-radius:50%;background:conic-gradient(from 0deg,transparent,#fff6,var(--a),transparent 60%);animation:spin 2.4s linear infinite;z-index:0}
@keyframes spin{to{transform:rotate(360deg)}}
.wd .r.enter{animation:rin .55s cubic-bezier(.2,.9,.2,1.2)}
@keyframes rin{from{opacity:0;transform:translateX(30%) scale(.9)}}
.wd.an-fade .r.enter{animation:rfade .5s}.wd.an-zoom .r.enter{animation:rzoom .5s cubic-bezier(.2,.9,.2,1.3)}.wd.an-none .r.enter{animation:none}
@keyframes rfade{from{opacity:0}}@keyframes rzoom{from{opacity:0;transform:scale(.5)}}
.wd .r.crowned .crown{animation:cdrop .9s cubic-bezier(.2,.9,.3,1.4)}
.wd .r.crowned{animation:lead 1.1s ease}
@keyframes cdrop{0%{transform:translateY(-140%) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes lead{30%{filter:brightness(1.6)}}
.wd .r.bump .vl{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.3)}}
.wd.w-in{animation:win .7s cubic-bezier(.2,.9,.2,1)}
@keyframes win{from{opacity:0;transform:translateY(24px) scale(.96)}}
.wd.no-fx *,.wd.no-fx *::before,.wd.no-fx *::after,.wd.no-fx{animation:none!important;transition:none!important}
.wd.no-fx .burst{display:none}
.burst{position:absolute;inset:0;z-index:20;pointer-events:none;display:grid;place-items:center}
.burst .bx{background:linear-gradient(135deg,#fff1c1,#e8c46a,#b8862b);color:#1a1206;font-weight:900;padding:.5em 1em;border-radius:1em;font-size:calc(var(--fs)*1.2);box-shadow:0 0 40px #e8c46aaa;animation:bpop 2.6s cubic-bezier(.2,.9,.2,1.2) forwards;white-space:nowrap;display:flex;align-items:center;gap:.5em}
.burst .bx img{width:1.8em;height:1.8em;border-radius:50%}
.burst i{position:absolute;left:50%;top:50%;width:calc(var(--fs)*.5);height:calc(var(--fs)*.5);border-radius:50%;background:var(--c);animation:part 1.4s ease-out forwards}
@keyframes bpop{0%{transform:scale(.2);opacity:0}12%{transform:scale(1.12);opacity:1}20%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-30%)}}
@keyframes part{to{transform:translate(var(--dx),var(--dy));opacity:0}}
/* timer / goal */
.wd .big{flex:1;display:grid;place-items:center;font-weight:900;font-size:var(--bfs);direction:ltr;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.wd .goal{flex:1;display:flex;flex-direction:column;justify-content:center;gap:calc(var(--bfs)*.25)}
.wd .gbar{height:calc(var(--bfs)*.8);border-radius:999px;background:#ffffff1f;overflow:hidden;position:relative}
.wd .gbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--a),#fff8);border-radius:999px;transition:width .6s cubic-bezier(.2,.9,.2,1)}
.wd .gtx{display:flex;justify-content:space-between;font-weight:800;font-size:calc(var(--bfs)*.55)}

/* ---- Shapes ---- */
.sh-row .rows{flex-direction:row}
.sh-row .r{flex-direction:column;height:auto;flex:1;justify-content:center;padding:calc(var(--gap)*.6);gap:calc(var(--fs)*.3);text-align:center}
.sh-row .nm{flex:none;width:100%;text-align:center}
.sh-row .rk{position:absolute;top:2%;right:6%;z-index:4}
.sh-grid .rows{flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:center}
.sh-grid .r{flex-direction:column;width:var(--cw);height:var(--ch);padding:0;justify-content:center;gap:calc(var(--fs)*.25);text-align:center}
.sh-grid .nm{flex:none;width:100%;text-align:center}
.sh-pod .rows{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:var(--rh);grid-template-rows:var(--ph)}
.sh-pod .r{height:auto}
.sh-pod .r1,.sh-pod .r2,.sh-pod .r3{grid-row:1;flex-direction:column;justify-content:flex-end;padding:0;gap:calc(var(--fs)*.2);text-align:center}
.sh-pod .r1{grid-column:2}.sh-pod .r2{grid-column:1}.sh-pod .r3{grid-column:3}
.sh-pod .r:not(.r1):not(.r2):not(.r3){grid-column:1/-1}
.sh-pod .r1 .av,.sh-pod .r2 .av,.sh-pod .r3 .av{width:var(--pav);height:var(--pav)}
.sh-pod .r2 .av,.sh-pod .r3 .av{width:calc(var(--pav)*.82);height:calc(var(--pav)*.82)}
.sh-pod .r1 .nm,.sh-pod .r2 .nm,.sh-pod .r3 .nm{flex:none;width:100%;text-align:center}
.sh-pod .r1 .rk,.sh-pod .r2 .rk,.sh-pod .r3 .rk{display:none}
.sh-pod .r1 .step,.sh-pod .r2 .step,.sh-pod .r3 .step{display:grid;place-items:center;width:100%;font-weight:900;font-size:calc(var(--fs)*1.6);border-radius:.4em .4em 0 0}
.sh-pod .r1 .step{height:calc(var(--ph)*.36);background:linear-gradient(180deg,#ffe58f,#c48f22)}
.sh-pod .r2 .step{height:calc(var(--ph)*.26);background:linear-gradient(180deg,#f1f5f9,#94a3b8)}
.sh-pod .r3 .step{height:calc(var(--ph)*.2);background:linear-gradient(180deg,#f7c59f,#b0642c)}
.sh-pod .step{color:#1a1206}

/* ---- 1 Royal gold ---- */
.ds-royal .in{border:calc(var(--pad)*.35) solid transparent;border-radius:calc(var(--rh)*.35);background:linear-gradient(180deg,#1b1306f0,#0a0703f2) padding-box,linear-gradient(135deg,#fff1c1,#b8862b 30%,#f9e29c 50%,#7a5512 75%,#ffe9a8) border-box;box-shadow:0 0 calc(var(--rh)*.5) #e8c46a55}
.ds-royal .wt{background:linear-gradient(90deg,#b8862b,#fff1c1,#e8c46a,#fff1c1,#b8862b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #0008)}
.ds-royal .wt svg{color:#ffd75e}
.ds-royal .r{border-radius:calc(var(--rh)*.5);background:linear-gradient(90deg,#ffffff06,#e8c46a14);border:1px solid #e8c46a33}
.ds-royal .r1{background:linear-gradient(90deg,#e8c46a30,#e8c46a55);border-color:#ffe39a}
.ds-royal .rk{background:linear-gradient(135deg,#fff1c1,#b8862b);color:#2a1a04}
.ds-royal .av img{box-shadow:0 0 0 3px #e8c46a}
.ds-royal .vl{color:#ffe39a}
/* ---- 2 Black & red ---- */
.ds-blackred .wt{background:#d4142a;color:#fff;transform:skewX(-12deg);border-radius:4px;box-shadow:6px 6px 0 #000;letter-spacing:.06em}
.ds-blackred .wt>*{transform:skewX(12deg)}
.ds-blackred .r{background:linear-gradient(90deg,#0b0b0b,#1c1c1c);transform:skewX(-12deg);border-right:calc(var(--rh)*.09) solid #d4142a;box-shadow:4px 4px 0 #000a}
.ds-blackred .r>*{transform:skewX(12deg)}
.ds-blackred .r1{background:linear-gradient(90deg,#7a0010,#d4142a)}
.ds-blackred .rk{background:#d4142a;color:#fff;border-radius:4px}
.ds-blackred .r1 .rk{background:#fff;color:#d4142a}
.ds-blackred .av img{border-radius:20%}
.ds-blackred .r1 .av::before{border-radius:20%}
/* ---- 3 Neon blue ---- */
.ds-neon{--a:var(--acc,#22d3ee)}
.ds-neon .in{background:#020617cc;border:2px solid var(--a);border-radius:calc(var(--rh)*.3);box-shadow:0 0 18px var(--a),inset 0 0 22px #22d3ee44}
.ds-neon .wt{color:#e0fbff;text-shadow:0 0 8px var(--a),0 0 22px var(--a)}
.ds-neon .r{border:1px solid #22d3ee66;border-radius:calc(var(--rh)*.25);background:#0891b214}
.ds-neon .r1{border-color:var(--a);box-shadow:0 0 14px var(--a),inset 0 0 14px #22d3ee55;animation:npulse 2s ease-in-out infinite}
@keyframes npulse{50%{box-shadow:0 0 26px var(--a),inset 0 0 20px #22d3ee88}}
.ds-neon .rk{border:2px solid var(--a);color:#e0fbff;text-shadow:0 0 6px var(--a)}
.ds-neon .vl{color:#a5f3fc;text-shadow:0 0 8px var(--a)}
.ds-neon .av img{box-shadow:0 0 0 2px var(--a),0 0 12px var(--a)}
/* ---- 4 Glass ---- */
.ds-glass .wt{background:#ffffff1c;border:1px solid #ffffff40;border-radius:999px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff}
.ds-glass .r{background:#ffffff17;border:1px solid #ffffff35;border-radius:999px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px -10px #0008}
.ds-glass .r1{background:#ffffff2e;border-color:#ffffff80}
.ds-glass .rk{background:#ffffff26}
.ds-glass .r1 .rk{background:#fff;color:#111}
/* ---- 5 Crystal ---- */
.ds-crystal .wt{color:#e0f2fe;text-shadow:0 0 12px #7dd3fc}
.ds-crystal .r{color:#0b1630;padding:0 calc(var(--rh)*.5)}

function emptyData(){return{likes:{},gifts:{},comments:{},interact:{},recentGifts:[],recentFollows:[],
 tot:{likes:0,gifts:0,giftCount:0,comments:0,follows:0,subs:0},feed:[],startedAt:Date.now(),running:true}}

function applyEvent(D,H,ev){
 if(!D.interact){D.interact={};D.recentGifts=[];D.recentFollows=[];D.tot.follows=D.tot.follows||0;D.tot.subs=D.tot.subs||0}
 const u=ev.user||{}; const k=u.id||u.name;
 const base=k?{k,name:u.name||k,av:u.avatar||""}:null;
 const inter=n=>{ if(!base) return; const r=D.interact[k]||(D.interact[k]={...base,v:0}); r.v+=n; if(base.av) r.av=base.av };
 if(ev.type==="like"){ if(!base) return; const n=Math.max(0,+ev.count||0); const r=D.likes[k]||(D.likes[k]={...base,v:0}); r.v+=n; r.av=base.av||r.av; D.tot.likes+=n; inter(1) }
 else if(ev.type==="gift"){ if(!base) return; const val=Math.max(0,+ev.value||0), cnt=Math.max(1,+ev.count||1); const r=D.gifts[k]||(D.gifts[k]={...base,v:0,c:0}); r.v+=val; r.c+=cnt; D.tot.gifts+=val; D.tot.giftCount+=cnt;
   D.recentGifts.unshift({k:k+"#"+(ev.id||ev.t||Date.now()),name:base.name,av:base.av,v:val,t:ev.t||Date.now()}); D.recentGifts.length=Math.min(D.recentGifts.length,30); inter(cnt);
   if(H){H.push({k,name:base.name,av:base.av,v:val,c:cnt,t:ev.t||Date.now()}); if(H.length>20000) H.splice(0,H.length-20000)} }
 else if(ev.type==="comment"){ if(!base) return; const r=D.comments[k]||(D.comments[k]={...base,v:0}); r.v+=1; D.tot.comments++; D.feed.unshift({name:base.name,text:String(ev.text||"").slice(0,200),t:Date.now()}); D.feed.length=Math.min(D.feed.length,60); inter(1) }
 else if(ev.type==="follow"){ if(!base) return; D.tot.follows++; D.recentFollows=D.recentFollows.filter(x=>x.k!==k); D.recentFollows.unshift({...base,v:0,t:ev.t||Date.now()}); D.recentFollows.length=Math.min(D.recentFollows.length,30) }
 else if(ev.type==="subscribe"){ D.tot.subs++ }
 else if(ev.type==="reset"){ const s=ev.scope||"all";
   if(s==="likes"||s==="all"){D.likes={};D.tot.likes=0}
   if(s==="gifts"||s==="all"){D.gifts={};D.tot.gifts=0;D.tot.giftCount=0;D.recentGifts=[]}
   if(s==="comments"||s==="all"){D.comments={};D.tot.comments=0;D.feed=[]}
   if(s==="interact"||s==="all"){D.interact={}}
   if(s==="follows"||s==="all"){D.recentFollows=[];D.tot.follows=0} }
 else if(ev.type==="shuffle"){ const b=D[ev.scope]; if(!b||Array.isArray(b)) return; const arr=Object.values(b).sort((a,b)=>b.v-a.v); if(arr.length<2) return; const pick=arr[1+Math.floor(Math.random()*(arr.length-1))]; const add=arr[0].v-pick.v+1+Math.floor(Math.random()*20); pick.v+=add; if(ev.scope==="likes")D.tot.likes+=add; if(ev.scope==="gifts")D.tot.gifts+=add; }
}

function entries(w,D,H){

 if(w.type==="likes") list=vals(D.likes);
 else if(w.type==="comments") list=vals(D.comments);
 else if(w.type==="interact") list=vals(D.interact);
 else if(w.type==="recentGifts") return (D.recentGifts||[]).slice(0,w.topN).map(r=>({...r}));
 else if(w.type==="recentFollows") return (D.recentFollows||[]).slice(0,w.topN).map(r=>({...r}));
 else if(w.type==="gifts"){
  const by=w.sortBy||"value";
  if(by==="value"||by==="session") list=Object.values(D.gifts).map(r=>({k:r.k,name:r.name,av:r.av,v:r.v,c:r.c}));
  else if(by==="count") list=Object.values(D.gifts).map(r=>({k:r.k,name:r.name,av:r.av,v:r.c,c:r.v}));
  else { const now=new Date(); let since;
   if(by==="day"){since=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime()}
   else if(by==="week"){since=Date.now()-7*864e5} else since=Date.now()-30*864e5;
   const m={}; for(const e of (H||[])) if(e.t>=since){const r=m[e.k]||(m[e.k]={k:e.k,name:e.name,av:e.av,v:0,c:0}); r.v+=e.v; r.c+=e.c}
   list=Object.values(m);

 } else list=[];
 return list.sort((a,b)=>b.v-a.v||a.name.localeCompare(b.name)).slice(0,w.topN);

// ====== محرك المؤقتات والسبثون ======
// دوال نقية: كل عملية تأخذ "now" من الخادم، والحالة تُخزَّن كـ endsAt (وقت انتهاء مطلق) أثناء التشغيل
// أو remainingMs أثناء الإيقاف. لذلك لا يضيع الوقت عند تحديث الصفحة أو إغلاق المتصفح أو إعادة تشغيل الخادم.
const MIN=60000, HOUR=3600000;

function defaultGiftRules(){ // قيم افتراضية تجريبية — قابلة للتعديل بالكامل
 return [{giftId:5655,name:"وردة",sec:5},{giftId:5487,name:"قلب",sec:10},{giftId:5879,name:"دونات",sec:30},{giftId:null,name:"هدية متوسطة",sec:120,minDiamonds:500},{giftId:6369,name:"أسد",sec:1800},{giftId:7312,name:"يونيفرس",sec:3600}];
}
function newSubathon(o={}){
 const initial=2*HOUR;
 return Object.assign({id:"sa_"+Math.random().toString(36).slice(2,9),name:"سبثون",desc:"",status:"idle",
  initialMs:initial,remainingMs:initial,endsAt:null,startedAt:null,scheduledAt:null,endedAt:null,
  minMs:0,maxMs:72*HOUR,maxTotalMs:0,totalAddedMs:0,
  pauseOnDisconnect:true,autoPaused:false,countWhilePaused:true,
  rules:{
   gifts:{enabled:true,table:defaultGiftRules(),perDiamondSec:0},
   likes:{enabled:true,every:1000,sec:30},
   follow:{enabled:true,sec:10},
   subscribe:{enabled:true,sec:300},
   goal:{enabled:false,metric:"likes",target:10000,sec:600,reached:false},
   manual:{enabled:true},
  },
  likeAcc:0, seq:0},o);
}
function remaining(s,now){ return s.status==="running"?Math.max(0,s.endsAt-now):Math.max(0,s.remainingMs) }

function setRemaining(s,ms,now){ if(s.status==="running") s.endsAt=now+ms; else s.remainingMs=ms }
function log(s,now,deltaMs,requestedMs,reason,source,eventId){ s.seq=(s.seq||0)+1; return {subathonId:s.id,seq:s.seq,deltaMs,requestedMs,reason,source,eventId:eventId||null,at:now,remainingMs:remaining(s,now)} }

/** عملية تحكم: start | pause | resume | add | reset | end | config — ترجع سجلات العمليات */
function subathonOp(s,op,now){
 const out=[];
 switch(op.op){
  case "start":
   if(s.status==="running") break;
   if(s.status==="ended"){ s.remainingMs=s.initialMs; s.totalAddedMs=0; s.likeAcc=0; s.rules.goal.reached=false }
   if(s.status==="paused"){ s.endsAt=now+s.remainingMs; s.status="running"; s.autoPaused=false; out.push(log(s,now,0,0,"استكمال","control")); break }
   s.status="running"; s.startedAt=now; s.endsAt=now+s.remainingMs; s.endedAt=null; s.autoPaused=false;
   out.push(log(s,now,0,0,"بدء السبثون","control")); break;
  case "pause":
   if(s.status!=="running") break;
   s.remainingMs=remaining(s,now); s.endsAt=null; s.status="paused"; s.autoPaused=!!op.auto;
   out.push(log(s,now,0,0,op.auto?"إيقاف تلقائي (انقطاع البث)":"إيقاف مؤقت","control")); break;
  case "resume":
   if(s.status!=="paused") break;
   s.endsAt=now+s.remainingMs; s.status="running"; s.autoPaused=false;
   out.push(log(s,now,0,0,op.auto?"استكمال تلقائي (عودة البث)":"استكمال","control")); break;
  case "add": {
   if(s.status==="ended") break;
   const manual=op.source==="manual";
   if(manual&&!s.rules.manual.enabled) break;
   let req=Math.round(+op.ms||0); if(!req) break;
   const cur=remaining(s,now);
   let delta=req;
   if(delta>0&&s.maxTotalMs>0) delta=Math.min(delta,Math.max(0,s.maxTotalMs-s.totalAddedMs));
   let next=cur+delta;
   if(s.maxMs>0) next=Math.min(next,s.maxMs);
   if(req<0) next=Math.max(next,Math.min(cur,s.minMs)); // الخصم لا ينزل تحت الحد الأدنى
   next=Math.max(0,next);
   const applied=next-cur; if(!applied&&req>0){ out.push(log(s,now,0,req,(op.reason||"إضافة")+" (وصل الحد الأقصى)",op.source||"manual",op.eventId)); break }
   setRemaining(s,next,now); if(applied>0) s.totalAddedMs+=applied;
   out.push(log(s,now,applied,req,op.reason||(req>0?"إضافة يدوية":"خصم يدوي"),op.source||"manual",op.eventId));
   if(s.status==="running"&&next===0){ s.status="ended"; s.endedAt=now; s.remainingMs=0; s.endsAt=null; out.push(log(s,now,0,0,"انتهى السبثون","system")) }
   break }
  case "reset":
   s.status="idle"; s.remainingMs=s.initialMs; s.endsAt=null; s.startedAt=null; s.endedAt=null; s.totalAddedMs=0; s.likeAcc=0; s.rules.goal.reached=false; s.autoPaused=false;
   out.push(log(s,now,0,0,"إعادة ضبط","control")); break;
  case "end":
   if(s.status==="ended") break;
   s.status="ended"; s.endedAt=now; s.remainingMs=0; s.endsAt=null;
   out.push(log(s,now,0,0,"إنهاء السبثون","control")); break;
  case "config": { // تعديل الإعدادات (لا يغيّر الوقت الجاري إلا initialMs عند الخمول)
   const c=op.config||{};
   for(const k of ["name","desc","minMs","maxMs","maxTotalMs","pauseOnDisconnect","countWhilePaused","scheduledAt"]) if(c[k]!==undefined) s[k]=c[k];
   if(c.initialMs!==undefined){ s.initialMs=Math.max(MIN,+c.initialMs); if(s.status==="idle") s.remainingMs=s.initialMs }
   if(c.rules) for(const r in c.rules) s.rules[r]=Object.assign(s.rules[r]||{},c.rules[r]);
   break }
 }
 return out;
}

/** قيمة الوقت لهدية حسب جدول المستخدم (بالمعرّف أولاً ثم الاسم ثم حد الألماس ثم قيمة لكل ألماسة) */
function giftSeconds(rules,ev){
 const g=rules.gifts; if(!g||!g.enabled) return 0;
 const id=ev.giftId!=null?String(ev.giftId):null, name=String(ev.gift||"").trim().toLowerCase();
 const per=(ev.diamonds!=null?+ev.diamonds:(+ev.value||0)/Math.max(1,+ev.count||1));
 let row=(id&&g.table.find(r=>r.giftId!=null&&String(r.giftId)===id))||(name&&g.table.find(r=>r.giftId==null&&!r.minDiamonds&&String(r.name).trim().toLowerCase()===name));
 if(!row){ const tiers=g.table.filter(r=>r.giftId==null&&r.minDiamonds>0&&per>=r.minDiamonds).sort((a,b)=>b.minDiamonds-a.minDiamonds); row=tiers[0] }
 const cnt=Math.max(1,+ev.count||1);
 if(row) return row.sec*cnt;
 return (g.perDiamondSec||0)*per*cnt;
}

/** تطبيق حدث بث على السبثون حسب الطرق المفعّلة — ترجع سجلات الإضافة */
function subathonOnEvent(s,ev,now,tot){
 if(!(s.status==="running"||(s.status==="paused"&&s.countWhilePaused))) return [];
 const R=s.rules, out=[];
 const add=(sec,reason,id)=>{ if(sec>0) out.push(...subathonOp(s,{op:"add",ms:sec*1000,reason,source:"event",eventId:id},now)) };
 if(ev.type==="gift") add(giftSeconds(R,ev),`هدية ${ev.gift||""} من ${ev.user?.name||""}`.trim(),ev.id);
 else if(ev.type==="like"&&R.likes.enabled&&R.likes.every>0){ s.likeAcc=(s.likeAcc||0)+(+ev.count||0); const n=Math.floor(s.likeAcc/R.likes.every); if(n>0){ s.likeAcc-=n*R.likes.every; add(n*R.likes.sec,`${n*R.likes.every} إعجاب`,ev.id) } }
 else if(ev.type==="follow"&&R.follow.enabled) add(R.follow.sec,`متابع جديد ${ev.user?.name||""}`,ev.id);
 else if(ev.type==="subscribe"&&R.subscribe.enabled) add(R.subscribe.sec,`اشتراك ${ev.user?.name||""}`,ev.id);
 const G=R.goal;
 if(G&&G.enabled&&!G.reached&&tot){ const v=G.metric==="gifts"?tot.gifts:G.metric==="follows"?tot.follows:tot.likes; if(v>=G.target){ G.reached=true; add(G.sec,"تحقيق الهدف ("+G.target+")",null) } }
 return out;
}

/** ساعة الخادم: بدء مجدول + انتهاء تلقائي */
function subathonTick(s,now){
 const out=[];
 if(s.status==="idle"&&s.scheduledAt&&now>=s.scheduledAt){ s.scheduledAt=null; out.push(...subathonOp(s,{op:"start"},now)) }
 if(s.status==="running"&&s.endsAt<=now){ s.status="ended"; s.endedAt=s.endsAt; s.remainingMs=0; s.endsAt=null; out.push(log(s,now,0,0,"انتهى السبثون","system")) }
 return out;
}

// ---------- مؤقتات البث المتعددة (كل مؤقت مستقل) ----------
const TIMER_KINDS={elapsed:{label:"مدة البث",dir:"up"},countdown:{label:"عد تنازلي",dir:"down"},break:{label:"استراحة",dir:"down"},challenge:{label:"مؤقت التحدي",dir:"down"},custom:{label:"مخصص",dir:"down"}};
function newTimer(kind="countdown",o={}){
 const k=TIMER_KINDS[kind]||TIMER_KINDS.custom;
 return Object.assign({id:"tm_"+Math.random().toString(36).slice(2,9),kind,name:k.label,dir:k.dir,durationMs:10*MIN,status:"idle",startedAt:null,endsAt:null,accMs:0,remainingMs:10*MIN,prefix:"",endText:"انتهى الوقت",autoLive:false},o);
}
function defaultTimers(){ return [newTimer("elapsed",{id:"stream",name:"مدة البث",prefix:"مدة البث",autoLive:true}),newTimer("break",{name:"الاستراحة",prefix:"راجع بعد",durationMs:5*MIN,remainingMs:5*MIN})] }
function timerValue(t,now){
 if(t.dir==="up") return t.accMs+(t.status==="running"?now-t.startedAt:0);
 return t.status==="running"?Math.max(0,t.endsAt-now):Math.max(0,t.remainingMs);
}
function timerOp(t,op,now){
 switch(op.op){
  case "start": if(t.status==="running") break;
   if(t.status==="ended"||t.status==="idle"){ t.accMs=0; t.remainingMs=t.durationMs }
   t.status="running"; t.startedAt=now; if(t.dir==="down") t.endsAt=now+t.remainingMs; break;
  case "pause": if(t.status!=="running") break; if(t.dir==="up") t.accMs+=now-t.startedAt; else t.remainingMs=Math.max(0,t.endsAt-now); t.status="paused"; t.endsAt=null; break;
  case "resume": if(t.status!=="paused") break; t.status="running"; t.startedAt=now; if(t.dir==="down") t.endsAt=now+t.remainingMs; break;
  case "reset": t.status="idle"; t.accMs=0; t.remainingMs=t.durationMs; t.endsAt=null; t.startedAt=null; break;
  case "add": { const ms=+op.ms||0; if(t.dir==="up"){ t.accMs=Math.max(0,t.accMs+ms) } else if(t.status==="running"){ t.endsAt=Math.max(now,t.endsAt+ms) } else t.remainingMs=Math.max(0,t.remainingMs+ms); break }
  case "config": { const c=op.config||{}; for(const k of ["name","prefix","endText","autoLive"]) if(c[k]!==undefined) t[k]=c[k]; if(c.durationMs!==undefined){ t.durationMs=Math.max(1000,+c.durationMs); if(t.status==="idle") t.remainingMs=t.durationMs } break }
 }
}
function timerTick(t,now){ if(t.dir==="down"&&t.status==="running"&&t.endsAt<=now){ t.status="ended"; t.remainingMs=0; t.endsAt=null; return true } return false }
function fmtClock(ms,showHours=true){ const s=Math.max(0,Math.ceil(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s/60)%60, x=s%60, p=n=>String(n).padStart(2,"0"); return (showHours||h?p(h)+":":"")+p(m)+":"+p(x) }

/** تطبيق حدث تبرع أو استرجاع. يرجع true إذا تغيّر شيء */
function applyDonation(DN,ev){
 if(ev.type==="donation"){
  if(!ev.id||DN.list.some(d=>d.id===ev.id)) return false; // منع التكرار بمعرّف العملية
  if(ev.status&&ev.status!=="confirmed") return false; // المعلّق لا يُحتسب
  const amount=Math.round((+ev.amount||0)*1000)/1000; if(!(amount>0)) return false;
  DN.list.push({id:ev.id,provider:ev.provider||"test",name:String(ev.name||"").slice(0,60),anonymous:!!ev.anonymous,avatar:ev.avatar||"",amount,currency:String(ev.currency||"SAR").toUpperCase(),message:String(ev.message||"").slice(0,300),status:"confirmed",refunded:0,test:!!ev.test,t:ev.t||Date.now()});
  if(DN.list.length>20000) DN.list.splice(0,DN.list.length-20000);
  return true }
 if(ev.type==="donation_refund"){ const d=DN.list.find(x=>x.id===ev.id); if(!d) return false;
  const amt=ev.amount==null?d.amount:Math.min(d.amount,+ev.amount||0); if(amt<=d.refunded) return false;
  d.refunded=amt; d.status=d.refunded>=d.amount?"refunded":"partially_refunded"; return true }
 if(ev.type==="donation_session"){ DN.sessionStart=ev.t||Date.now(); return true }
 if(ev.type==="donation_clear_tests"){ const n=DN.list.length; DN.list=DN.list.filter(d=>!d.test); return n!==DN.list.length }
 return false;
}
/** مفتاح الفترة بالمنطقة الزمنية التي يحددها صانع المحتوى (اليوم/الأسبوع ببداية قابلة للتحديد/الشهر) */
function periodKey(t,tz,period,weekStart=0){
 let p; try{ p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:tz||"UTC",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"}).formatToParts(new Date(t)).map(x=>[x.type,x.value])) }catch(e){ return periodKey(t,"UTC",period,weekStart) }
 if(period==="month") return p.year+"-"+p.month;
 if(period==="day") return p.year+"-"+p.month+"-"+p.day;
 if(period==="week"){ const wd=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday); const back=(wd-weekStart+7)%7; const d=new Date(Date.UTC(+p.year,+p.month-1,+p.day-back)); return "W"+d.toISOString().slice(0,10) }
 return "all";
}
function inPeriod(d,o){ if(o.period==="all") return true; if(o.period==="session") return d.t>=(o.sessionStart||0); return periodKey(d.t,o.tz,o.period,o.weekStart)===periodKey(o.now,o.tz,o.period,o.weekStart) }
function displayName(d,cfg){ return d.anonymous||(!d.name)?(cfg&&cfg.anonName||"داعم مجهول"):d.name }

/** مجموع كل داعم في فترة وعملة محددة (المجهولون لا يُدمجون معاً) */
function donorTotals(DN,cfg,o){
 const cur=o.currency||cfg.currency, m={};
 for(const d of DN.list){ if(d.currency!==cur||!inPeriod(d,{...o,tz:cfg.tz,weekStart:cfg.weekStart,sessionStart:DN.sessionStart})) continue; if(o.excludeTests&&d.test) continue;
  const v=net(d); if(!v) continue;
  const anon=d.anonymous||!d.name; const k=anon?"anon:"+d.id:"n:"+d.name.toLowerCase();
  const r=m[k]||(m[k]={k,name:displayName(d,cfg),av:anon?"":d.avatar,v:0,c:0,anon}); r.v+=v; r.c++ }
 return Object.values(m).filter(r=>!(o.hideAnon&&r.anon)).sort((a,b)=>b.v-a.v);
}
function recentDonations(DN,cfg,o={}){ return DN.list.filter(d=>net(d)>0&&(!o.currency||d.currency===o.currency)&&!(o.hideAnon&&(d.anonymous||!d.name))).slice(-(o.limit||20)).reverse() }
function goalProgress(g,DN,now){
 let cur=+g.base||0;
 if(g.auto&&!g.paused) for(const d of DN.list){ if(d.currency!==g.currency) continue; if(g.startAt&&d.t<g.startAt) continue; if(g.endAt&&d.t>g.endAt) continue; if(g.countedFrom&&d.t<g.countedFrom) continue; cur+=net(d) }
 const target=Math.max(0.01,+g.target||1);

}
/** الإحصائيات المالية: التبرعات المؤكدة فقط، بدون التجريبية، ولكل عملة على حدة */
function donationStats(DN,cfg,now){
 const by={};
 for(const d of DN.list){ if(d.test) continue; const v=net(d); const c=by[d.currency]||(by[d.currency]={currency:d.currency,total:0,today:0,week:0,month:0,count:0,max:0,maxDon:null,refunded:0,byProvider:{}});
  c.refunded+=+d.refunded||0; if(!v) continue;
  c.total+=v; c.count++; if(d.amount>c.max){c.max=d.amount;c.maxDon=d}
  c.byProvider[d.provider]=(c.byProvider[d.provider]||0)+v;
  const o={tz:cfg.tz,weekStart:cfg.weekStart,now};
  if(periodKey(d.t,o.tz,"day",o.weekStart)===periodKey(now,o.tz,"day",o.weekStart)) c.today+=v;
  if(periodKey(d.t,o.tz,"week",o.weekStart)===periodKey(now,o.tz,"week",o.weekStart)) c.week+=v;
  if(periodKey(d.t,o.tz,"month",o.weekStart)===periodKey(now,o.tz,"month",o.weekStart)) c.month+=v }

// استقبال الأحداث → (منع التكرار) → محرك القوائم + محرك السبثون/المؤقتات → رسائل للعرض
// نفس الكود يعمل على الخادم (الوضع الحقيقي) وفي المتصفح (وضع التجربة بدون خادم).



const LIVE_TYPES=new Set(["like","gift","comment","follow","subscribe","reset","shuffle","donation","donation_refund","donation_session","donation_clear_tests"]);
const DON_TYPES=new Set(["donation","donation_refund","donation_session","donation_clear_tests"]);
function newRoom(){ return {D:emptyData(),H:[],C:newClockState(),DN:emptyDonations(),seen:new Map(),live:false,logs:[]} }
function keep(R,logs){ if(!logs.length) return; R.logs=(R.logs||[]); for(const l of logs) R.logs.unshift(l); if(R.logs.length>300) R.logs.length=300 }

/** حدث بث (حقيقي أو تجريبي). يرجع {out: رسائل للبث للعملاء, logs: سجلات وقت للحفظ} */
function roomEvent(R,ev,now){
 if(!ev||!LIVE_TYPES.has(ev.type)) return {out:[],logs:[]};
 // التبرعات: محرك مستقل لا يلمس قوائم TikTok
 if(DON_TYPES.has(ev.type)){ R.DN=R.DN||emptyDonations(); ev.t=ev.t||now; return applyDonation(R.DN,ev)?{out:[{t:"event",ev}],logs:[]}:{out:[],logs:[],dup:true} }
 if(ev.id){ if(R.seen.has(ev.id)) return {out:[],logs:[],dup:true}; R.seen.set(ev.id,now); if(R.seen.size>8000){ const it=R.seen.keys(); for(let i=0;i<2000;i++) R.seen.delete(it.next().value) } }
 ev.t=ev.t||now;
 applyEvent(R.D,R.H,ev);
 const out=[{t:"event",ev}];
 const logs=subathonOnEvent(R.C.subathon,ev,now,R.D.tot); keep(R,logs);
 if(logs.length) out.push({t:"clock",C:R.C,now,logs});
 return {out,logs};
}
/** أوامر لوحة التحكم للمؤقتات والسبثون */
function roomClockOp(R,m,now){
 let logs=[];
 if(m.target==="subathon") logs=subathonOp(R.C.subathon,m,now);
 else if(m.target==="timers"){ // إضافة/حذف/ترتيب مؤقتات
  if(m.op==="create"){ if(R.C.timers.length<30) R.C.timers.push(newTimer(m.kind||"countdown",m.config||{})) }
  else if(m.op==="delete"){ if(m.id!=="stream") R.C.timers=R.C.timers.filter(t=>t.id!==m.id) }
 } else { const t=R.C.timers.find(x=>x.id===m.target); if(!t) return {out:[],logs:[]}; timerOp(t,m,now) }
 keep(R,logs); return {out:[{t:"clock",C:R.C,now,logs}],logs};
}
/** نبضة كل ثانية من الخادم */
function roomTick(R,now){
 const logs=subathonTick(R.C.subathon,now); keep(R,logs); let changed=logs.length>0;
 for(const t of R.C.timers) if(timerTick(t,now)) changed=true;
 return changed?{out:[{t:"clock",C:R.C,now,logs}],logs}:{out:[],logs:[]};
}
/** حالة الاتصال بالبث: إيقاف/استكمال السبثون تلقائياً حسب الإعداد، وتشغيل مؤقت مدة البث */
function roomLive(R,live,now){
 const s=R.C.subathon, logs=[]; R.live=live;
 if(!live&&s.pauseOnDisconnect&&s.status==="running") logs.push(...subathonOp(s,{op:"pause",auto:true},now));
 if(live&&s.autoPaused&&s.status==="paused") logs.push(...subathonOp(s,{op:"resume",auto:true},now));
 for(const t of R.C.timers) if(t.autoLive){ if(live&&t.status!=="running") timerOp(t,{op:t.status==="paused"?"resume":"start"},now); if(!live&&t.status==="running") timerOp(t,{op:"pause"},now) }
 keep(R,logs); return {out:[{t:"clock",C:R.C,now,logs}],logs};
}
function roomSnapshot(R,now){ return {t:"snapshot",D:R.D,H:R.H,C:R.C,DN:R.DN,logs:R.logs||[],now} }

}

/* ================= النقل: نفس المتصفح (BroadcastChannel) أو الخادم (WebSocket) ================= */
const bus=("BroadcastChannel" in window)?new BroadcastChannel("b6o6-live-v2"):null;
let ws=null, wsReady=false;
function connectWS(url,room,key,onMsg,onStatus){
 try{ if(ws){ ws.onclose=ws.onerror=ws.onmessage=null; ws.close() } }catch(e){}
 if(!url) return;
 let sock; try{ sock=ws=new WebSocket(url) }catch(e){ onStatus&&onStatus(false,"رابط غير صالح"); return }
 sock.onopen=()=>{wsReady=true; sock.send(JSON.stringify({t:"join",room,key})); onStatus&&onStatus(true)};
 sock.onerror=()=>{sock._err=true};
 sock.onclose=()=>{ if(ws===sock) wsReady=false; onStatus&&onStatus(false,sock._err&&!sock._opened?"تعذر الاتصال":undefined)};
 sock.addEventListener("open",()=>sock._opened=true);
 sock.onmessage=m=>{ try{ onMsg(JSON.parse(m.data)) }catch(e){ console.error(e) } };
}
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));
function loadRoom(){ const r=newRoom(); const d=ls("arsh.room"); if(d&&d.D&&d.C){ r.D=d.D; r.H=d.H||[]; r.C=d.C; r.logs=d.logs||[]; if(d.DN) r.DN=d.DN } return r }

/* ================= وضع الرابط (OBS / TikTok LIVE Studio) ================= */
function bootOverlay(q){
 document.body.className="ov";
 let L; try{L=b64d(q.get("d"))}catch(e){document.body.innerHTML="<p style='color:#fff'>رابط غير صالح</p>";return}
 // رابط حساب مستقل: يعرض حساباً واحداً بلا تخطيط
 if(q.get("acc")){ const w=newWidget("social",{id:"acc_"+q.get("acc"),mode:"single",accountId:q.get("acc"),design:q.get("ds")||"elite",x:0,y:0,w:1,h:1}); L={id:L.id,name:"acc",canvas:"acc",widgets:[w],socials:L.socials} }
 L.widgets.forEach(migrateWidget);
 const only=q.get("only"), room=q.get("room")||"", wsUrl=q.get("ws")||"", bigT=+q.get("big")||1000;
 const R=loadRoom(); let skew=0;
 const src=()=>({D:R.D,H:R.H,C:R.C,skew,SO:L.socials,DN:R.DN,DC:L.donCfg});
 const root=document.getElementById("root");
 const stage=document.createElement("div"); stage.className="stage"; root.appendChild(stage);
 const views=new Map(); let cv;
 function layout(){
  const base=L.canvas==="acc"?{w:900,h:130}:(CANVASES[L.canvas]||CANVASES.vertical); let list=L.widgets;
  if(only){ const w=L.widgets.find(x=>x.id===only); if(!w){stage.innerHTML="";return} cv={w:Math.round(w.w*base.w),h:Math.round(w.h*base.h)}; list=[{...w,x:0,y:0,w:1,h:1}] } else cv=base;
  stage.style.width=cv.w+"px"; stage.style.height=cv.h+"px";
  stage.style.transform=`scale(${Math.min(innerWidth/cv.w,innerHeight/cv.h)})`;
  const seen=new Set();
  for(const w of list){ seen.add(w.id); let v=views.get(w.id); if(v){v.cv=cv;v.apply(w)} else { v=new View(w,cv,{data:src,refW:base.w}); views.set(w.id,v); stage.appendChild(v.el); v.el.classList.add("w-in") } }
  for(const [id,v] of views) if(!seen.has(id)){v.el.remove();views.delete(id)}
 }
 function onMsg(m){
  if(m.t==="snapshot"){ R.D=m.D; R.H=m.H||[]; R.C=m.C; if(m.DN) R.DN=m.DN; skew=(m.now||Date.now())-Date.now() }
  else if(m.t==="event"){ if(m.ev.type==="gift"&&m.ev.big===undefined) m.ev.big=m.ev.value>=bigT; if(m.applied!==true){ applyEvent(R.D,R.H,m.ev); applyDonation(R.DN,m.ev) } }
  else if(m.t==="clock"){ R.C=m.C; if(m.now) skew=m.now-Date.now() }
  else if(m.t==="layout"){ if(m.layout&&L.canvas==="acc"){ L.socials=m.layout.socials||L.socials; L.donCfg=m.layout.donCfg||L.donCfg; deliver(views.values(),{t:"snapshot"},src()); return } if(m.layout&&m.layout.id===L.id){ L=m.layout; L.widgets.forEach(migrateWidget); layout(); deliver(views.values(),{t:"snapshot"},src()) } return }
  deliver(views.values(),m,src());
 }
 layout(); addEventListener("resize",layout);
 setInterval(()=>{ for(const v of views.values()) if(TYPES[v.w.type].tick) v.refresh(src()) },250);
 // إعادة اتصال تلقائية بعد أي انقطاع؛ الخادم يرسل لقطة كاملة فلا يتكرر الاحتساب
 if(wsUrl){ let n=0; const go=()=>connectWS(wsUrl,room,"",onMsg,ok=>{ if(ok) n=0; else setTimeout(go,Math.min(15000,1000*++n)) }); go() }
 else if(bus) bus.onmessage=({data:m})=>onMsg({...m,applied:false});
}

const CFG=window.B6O6_CONFIG||null;
const st=CFG?{layouts:CFG.layouts,active:CFG.activeLayoutId,settings:CFG.settings,profile:CFG.profile}:(ls("arsh.app")||{});
const S={layouts:st.layouts||defaultLayouts(),active:st.active,settings:Object.assign({fx:true,bigGift:1000,wsUrl:"",room:"",key:"",tiktok:"",bg:"stream"},st.settings||{}),profile:Object.assign({name:"عبدالرحمن",plan:"تجريبي"},st.profile||{}),page:"home",sel:null,libTab:"boards",scope:"likes"};

if(!S.layouts.find(l=>l.id===S.active)) S.active=S.layouts[0].id;

if(CFG){ Object.assign(S.settings,{wsUrl:CFG.wsUrl,room:CFG.room,key:CFG.key}) }

const SRC=()=>({D:R.D,H:R.H,C:R.C,skew,SO:S.socials,DN:R.DN,DC:S.donCfg});

let saveT; function save(){clearTimeout(saveT);saveT=setTimeout(()=>{ if(CFG){ const {wsUrl,room,key,...rest}=S.settings; Promise.resolve(CFG.persist({layouts:S.layouts,activeLayoutId:S.active,settings:rest,name:S.profile.name,socials:S.socials,donCfg:S.donCfg})).then(()=>flash("تم الحفظ"),()=>toast("تعذر الحفظ — تحقق من الاتصال")) } else { ls("arsh.app",{layouts:S.layouts,active:S.active,settings:S.settings,profile:S.profile,socials:S.socials,donCfg:S.donCfg}); flash("تم الحفظ") } },400)}
function saveRoomNow(){ ls("arsh.room",{D:R.D,H:R.H,C:R.C,logs:R.logs,DN:R.DN}) }

function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1600)}

const views=new Map(), liveViews=new Set();
const allViews=()=>[...views.values(),...liveViews];
/** كل أمر يمر من هنا: للخادم إن كان متصلاً، وإلا يُنفَّذ محلياً بنفس محرك الخادم */
function send(msg){
 if(wsReady){ ws.send(JSON.stringify({...msg,room:S.settings.room})); return }
 const now=Date.now(); let res;
 if(msg.t==="sim") res=roomEvent(R,msg.ev,now);
 else if(msg.t==="clock-op") res=roomClockOp(R,msg,now);
 else if(msg.t==="fx") res={out:[{t:"fx",fx:msg.fx}],logs:[]};
 else return;
 for(const m of res.out){ receive(m,true); if(bus) bus.postMessage(m) }
 saveRoom();
}
function receive(m,applied){
 if(m.t==="snapshot"){ R.D=m.D; R.H=m.H||[]; R.C=m.C; R.logs=m.logs||[]; if(m.DN) R.DN=m.DN; skew=(m.now||Date.now())-Date.now(); saveRoom() }
 else if(m.t==="event"){ if(m.ev.type==="gift"&&m.ev.big===undefined) m.ev.big=m.ev.value>=S.settings.bigGift; if(!applied){ applyEvent(R.D,R.H,m.ev); applyDonation(R.DN,m.ev); saveRoom() } }
 else if(m.t==="clock"){ if(!applied){ R.C=m.C; if(m.now) skew=m.now-Date.now(); for(const l of [...(m.logs||[])].reverse()) R.logs.unshift(l); R.logs.length=Math.min(R.logs.length,300); saveRoom() } }
 else if(m.t==="fx"){ /* عرض فوري */ }
 else if(m.t==="status"){ if(m.text!==undefined||m.live!==undefined) liveStatus={live:!!m.live,text:m.text||liveStatus.text}; setConn(); if(m.text) toast(m.text); return }
 else if(m.t==="gifts"){ S.catalog=m.gifts; if(S.page==="subathon") renderPage(true); return }
 else return;

 if(t.hasAttribute("data-goal-add")){ S.donCfg.goals.push(newGoal({name:"هدف جديد",currency:S.donCfg.currency})); donSave(); renderPage(true); return true }
 if(d.goalPause){ const g=S.donCfg.goals.find(x=>x.id===d.goalPause); g.paused=!g.paused; donSave(); renderPage(true); return true }

function donInput(t,d,e){ if(e.type!=="change") return false;

function readImage(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,128/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s)); c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/png")) }; img.onerror=rej; img.src=fr.result }; fr.onerror=rej; fr.readAsDataURL(file) }) }

function snapMove(w,cv){
 const thr=10/stageScale, X=w.x*cv.w, Y=w.y*cv.h, W=w.w*cv.w, Hh=w.h*cv.h;
 const xs=[0,cv.w/2,cv.w], ys=[0,cv.h/2,cv.h];
 for(const o of L().widgets){ if(o.id===w.id||!o.visible) continue; xs.push(o.x*cv.w,(o.x+o.w/2)*cv.w,(o.x+o.w)*cv.w); ys.push(o.y*cv.h,(o.y+o.h/2)*cv.h,(o.y+o.h)*cv.h) }
 const best=(pos,size,cands)=>{ let b=null; for(const off of [0,size/2,size]) for(const c of cands){ const d=c-(pos+off); if(Math.abs(d)<=thr&&(!b||Math.abs(d)<Math.abs(b.d))) b={d,line:c} } return b };
 const bx=best(X,W,xs), by=best(Y,Hh,ys);
 if(bx) w.x=clamp((X+bx.d)/cv.w,0,1-w.w); if(by) w.y=clamp((Y+by.d)/cv.h,0,1-w.h);
 return {gx:bx?bx.line:null,gy:by?by.line:null};
}

 e.preventDefault();
 const resize=e.target.classList.contains("rh");
 const d={sx:e.clientX,sy:e.clientY,ox:w.x,oy:w.y,ow:w.w,oh:w.h};
 const move=ev=>{ const cv=CV(); const dx=(ev.clientX-d.sx)/stageScale/cv.w, dy=(ev.clientY-d.sy)/stageScale/cv.h;
  const s=v=>Math.round(v*1000)/1000;
  if(resize){ w.w=s(clamp(d.ow+dx,.05,1-w.x)); w.h=s(clamp(d.oh+dy,.02,1-w.y)) }
  else { w.x=s(clamp(d.ox+dx,0,1-w.w)); w.y=s(clamp(d.oy+dy,0,1-w.h)); w.pos="custom"; showGuides(S.settings.snap!==false&&!ev.altKey?snapMove(w,cv):null) }
  refreshView(w) };
 const up=()=>{ removeEventListener("pointermove",move); removeEventListener("pointerup",up); showGuides(null); save(); pushLayout(); renderProps() };

}

 if(d.gcat){ const g=S.catalog.find(x=>String(x.id)===d.gcat); const tb=R.C.subathon.rules.gifts.table; if(tb.find(r=>String(r.giftId)===d.gcat)) return toast("موجودة في الجدول"); saConfig({rules:{gifts:{table:[...tb,{giftId:g.id,name:g.name,sec:Math.max(1,Math.round(g.diamonds/2))}]}}}); return setTimeout(()=>renderPage(true),50) }
 if(d.tm&&d.tmop) return clockOp(d.tm,d.tmop);
 if(d.tm&&d.tmadd) return clockOp(d.tm,"add",{ms:+d.tmadd});
 if(t.hasAttribute("data-tm-create")){ const kind=document.getElementById("tmKind").value, name=document.getElementById("tmName").value.trim()||TIMER_KINDS[kind].label, mins=Math.max(1,+document.getElementById("tmMin").value||10);
  clockOp("timers","create",{kind,config:{name,prefix:kind==="break"?"راجع بعد":name,durationMs:mins*MIN,remainingMs:mins*MIN}}); return setTimeout(()=>renderPage(),50) }
 if(d.tmDel){ return ask("حذف هذا المؤقت؟").then(ok=>{ if(ok){ clockOp("timers","delete",{id:d.tmDel}); setTimeout(()=>renderPage(),50) } }) }
 if(d.tmAddW){ addWidget("timer",{timerId:d.tmAddW,design:"glass"}); return renderPage() }
 if(d.add){ addWidget(d.add,t.hasAttribute("data-top1")?{topN:1,title:"أكبر داعم",name:"أكبر داعم",design:"podium",w:.32,h:.18}:{}); return renderPage() }
 if(d.edit){ S.sel=d.edit; return go("studio") }
 if(d.lib){ const w=findW(d.lib); S.libTab=({clock:"clocks",soc:"socials",board:"boards"})[dKind(w)]; S.libTarget=d.lib; return go("library") }
 if(d.pick){ const l=L(); const pool=l.widgets.filter(w=>libPool(w,S.libTab)); const tgt=pool.find(w=>w.id===S.libTarget)||pool[0]; if(!tgt) return toast("أضف عنصراً أولاً"); tgt.design=d.pick; save(); pushLayout(); toast(`«${wdname(tgt)}» ← ${tgt.name} فقط`); return renderPage() }
 if(d.copylink) return copy(overlayURL(L(),d.copylink));
 if(t.hasAttribute("data-copyall")) return copy(overlayURL(L()));
 if(d.selw&&!d.tog) return select(d.selw);
 if(d.tog){ e.stopPropagation(); const w=findW(d.wid); w[d.tog]=!w[d.tog]; return changed(w,true) }
 if(d.pos){ const w=findW(S.sel); if(!w) return; applyPreset(w,d.pos,CV()); return changed(w,true) }
 if(d.z){ const w=findW(S.sel); const zs=L().widgets.map(x=>x.z); w.z=d.z==="front"?Math.max(...zs)+1:Math.min(...zs)-1; if(w.z<0){L().widgets.forEach(x=>x.z+=1-w.z)} L().widgets.forEach(refreshView); return changed(w,true) }
 if(t.hasAttribute("data-tpl-save")){ const w=findW(S.sel); return ask("اسم القالب","قالبي "+((S.socials.templates||[]).length+1)).then(n=>{ if(!n) return; const keys=["design","enter","exit","enterMs","exitMs","delayMs","showLogo","showPlatform","showUser","logoScale","font","acc","tx","opacity","fontScale","speed","dir"]; const o={}; keys.forEach(k=>o[k]=w[k]); (S.socials.templates=S.socials.templates||[]).push({name:n,style:o}); socSave(); renderProps(); toast("تم حفظ القالب") }) }
 if(t.hasAttribute("data-dupw")){ const w=findW(S.sel); const c={...w,id:"w_"+uid(),name:w.name+" (نسخة)",x:clamp(w.x+.03,0,1-w.w),y:clamp(w.y+.03,0,1-w.h),z:w.z+1,pos:"custom"}; L().widgets.push(c); S.sel=c.id; save(); pushLayout(); return renderPage() }
 if(t.hasAttribute("data-delw")){ return ask("حذف هذا العنصر؟").then(ok=>{ if(!ok) return; const l=L(); l.widgets=l.widgets.filter(x=>x.id!==S.sel); S.sel=null; save(); pushLayout(); renderPage() }) }
 if(d.canvas){ L().canvas=d.canvas; save(); pushLayout(); return renderPage() }
 if(d.lay){ const l=L(); const done=()=>{S.sel=null; save(); renderPage()};
  if(d.lay==="new") return ask("اسم المشهد الجديد","مشهد جديد").then(n=>{ if(!n) return; const nl={id:"l_"+uid(),name:n,canvas:l.canvas,widgets:[]}; S.layouts.push(nl); S.active=nl.id; done() });
  if(d.lay==="dup"){ const nl=JSON.parse(JSON.stringify(l)); nl.id="l_"+uid(); nl.name=l.name+" (نسخة)"; nl.widgets.forEach(w=>w.id="w_"+uid()); S.layouts.push(nl); S.active=nl.id; return done() }
  if(d.lay==="ren") return ask("الاسم الجديد",l.name).then(n=>{ if(!n) return; l.name=n; done() });
  if(d.lay==="del"){ if(S.layouts.length<2) return toast("لا بد من مشهد واحد على الأقل"); return ask("حذف «"+l.name+"»؟").then(ok=>{ if(!ok) return; S.layouts=S.layouts.filter(x=>x.id!==l.id); S.active=S.layouts[0].id; done() }) } }
 if(t.hasAttribute("data-connect")){ S.settings.wsUrl=S.settings.wsUrl.trim(); save(); startWS(); return }
 if(t.hasAttribute("data-tiktok")){ if(!wsReady) return toast("اتصل بخادم المنصة أولاً — ربط TikTok يتم من الخادم"); if(!S.settings.tiktok) return toast("اكتب اسم المستخدم"); ws.send(JSON.stringify({t:"tiktok",room:S.settings.room,username:S.settings.tiktok.replace(/^@/,"")})); return }
 if(t.hasAttribute("data-tiktok-stop")){ if(wsReady) ws.send(JSON.stringify({t:"tiktok-stop",room:S.settings.room})); return }
 if(t.hasAttribute("data-logout")&&CFG) return CFG.logout();
 if(t.hasAttribute("data-disconnect")){ S.wantWS=false; if(wsReady) ws.send(JSON.stringify({t:"tiktok-stop",room:S.settings.room})); try{ if(ws){ ws.onclose=null; ws.close() } }catch(_){} ws=null; wsReady=false; liveStatus={live:false,text:"وضع التجربة المحلي — غير متصل بـ TikTok"}; setConn(); return renderPage(true) }
 if(t.hasAttribute("data-export")){ copy(JSON.stringify({layouts:S.layouts,settings:{...S.settings,key:""},profile:S.profile})); return }
 if(t.hasAttribute("data-wipe")){ return ask("سيتم حذف التخطيطات والبيانات من هذا المتصفح").then(ok=>{ if(!ok) return; try{["arsh.app","arsh.room"].forEach(k=>localStorage.removeItem(k))}catch(_){} location.reload() }) }
 if(d.preview!==undefined) return previewOverlay(d.preview||null);
}
function modal(html){ const m=document.createElement("div"); m.className="modal"; m.innerHTML=`<div class="mbox">${html}</div>`; document.body.appendChild(m); return m }
function ask(msg,def){ return new Promise(res=>{ const m=modal(`<p>${esc(msg)}</p>${def!==undefined?`<input class="inp" id="askv" value="${esc(def)}">`:""}<div class="row" style="margin-top:12px"><button class="btn pri sm" data-ok>تأكيد</button><button class="btn sm" data-no>إلغاء</button></div>`); const inp=m.querySelector("#askv"); if(inp){inp.focus();inp.select()}
 m.onclick=e=>{ if(e.target.closest("[data-ok]")){ const v=inp?inp.value.trim():true; m.remove(); res(v||null) } else if(e.target.closest("[data-no]")||e.target===m){ m.remove(); res(null) } } }) }
function previewOverlay(only){
 const l=L(), base=CV(); let cv=base, list=l.widgets;
 if(only){ const w=l.widgets.find(x=>x.id===only); cv={w:Math.round(w.w*base.w),h:Math.round(w.h*base.h)}; list=[{...w,x:0,y:0,w:1,h:1}] }
 const s=Math.min(innerWidth*.9/cv.w,(innerHeight*.9-110)/cv.h);
 const m=modal(`<div class="row" style="justify-content:space-between;margin-bottom:10px"><b>معاينة ${only?"الرابط المستقل":"الرابط الشامل"} (${cv.w}×${cv.h})</b><button class="btn sm" data-no>إغلاق</button></div><div class="pvbox" style="width:${cv.w*s}px;height:${cv.h*s}px"><div class="stage" style="background:none;width:${cv.w}px;height:${cv.h}px;transform:scale(${s})"></div></div><div class="row" style="margin-top:10px;justify-content:center"><button class="btn sm" data-sim="like1000">❤️ +1000</button><button class="btn sm" data-sim="gift">🎁 هدية</button><button class="btn sm" data-sim="biggift">🦁 هدية كبيرة</button><button class="btn sm" data-sim="saAdd">⏳ +5د</button></div>`);
 const stg=m.querySelector(".stage"), mine=[];
 for(const w of list){ const v=new View(w,cv,{data:SRC,refW:base.w,globalFx:S.settings.fx,mute:true}); stg.appendChild(v.el); v.el.classList.add("w-in"); liveViews.add(v); mine.push(v) }
 m.onclick=e=>{ const b=e.target.closest("[data-sim]"); if(b) return SIM[b.dataset.sim](); if(e.target.closest("[data-no]")||e.target===m){ mine.forEach(v=>liveViews.delete(v)); m.remove() } };
}
function onInput(e){
 const t=e.target, d=t.dataset;
 if(socInput(t,d,e)) return;
 if(donInput(t,d,e)) return;
 if(d.act==="pickLayout"&&e.type==="change"){ S.active=t.value; S.sel=null; save(); return renderPage() }
 if(d.act==="addW"&&e.type==="change"&&t.value){ if(t.value.startsWith("@")) addSocialWidget(t.value.slice(1)); else addWidget(t.value); t.value=""; return renderPage() }
 if(d.act==="libTarget"&&e.type==="change"){ S.libTarget=t.value; return renderPage() }
 if(d.act==="tplApply"&&e.type==="change"&&t.value!==""){ const w=findW(S.sel); Object.assign(w,S.socials.templates[+t.value].style); save(); pushLayout(); refreshView(w); renderProps(); return }
 if(d.act==="snap"&&e.type==="change"){ S.settings.snap=t.checked; return save() }
 if(d.sa&&e.type==="change"){ // إعدادات السبثون → أمر config عبر نفس المحرك
  const k=d.sa; let v=t.type==="checkbox"?t.checked:t.value; const cfg={};
  if(k==="initialMin") cfg.initialMs=Math.max(1,+v)*MIN; else if(k==="minMin") cfg.minMs=Math.max(0,+v)*MIN; else if(k==="maxMin") cfg.maxMs=Math.max(0,+v)*MIN; else if(k==="maxTotalMin") cfg.maxTotalMs=Math.max(0,+v)*MIN;
  else if(k==="pauseOnDisconnect"||k==="countWhilePaused") cfg[k]=v==="1";
  else if(k==="scheduledAt") cfg.scheduledAt=v?new Date(v).getTime():null;
  else if(k.startsWith("rules.")){ if(t.type==="number") v=+v; setPath(cfg,k,v) } else cfg[k]=v;
  saConfig(cfg); return setTimeout(()=>renderPage(true),60) }
 if(d.gr!==undefined&&e.type==="change"){ const tb=R.C.subathon.rules.gifts.table.map(r=>({...r})); const r=tb[+d.gr]; let v=t.value.trim();
  if(d.gf==="giftId") r.giftId=v===""?null:(isNaN(+v)?v:+v); else if(d.gf==="name") r.name=v; else r[d.gf]=Math.max(0,+v||0);
  saConfig({rules:{gifts:{table:tb}}}); return }
 if(d.tmc&&e.type==="change"){ const cfg={}; if(d.tmc==="durationMin") cfg.durationMs=Math.max(1,+t.value)*MIN; else if(d.tmc==="autoLive") cfg.autoLive=t.value==="1"; else cfg[d.tmc]=t.value; clockOp(d.tmId,"config",{config:cfg}); return }
 if(d.wf){ const w=findW(d.wid); if(!w) return; const f=d.wf; let v=t.type==="checkbox"?t.checked:t.value;
  if(["w","h","fontScale","avatarScale","gap","opacity","topN","target","enterMs","exitMs","delayMs","speed","cols","logoScale","showSec","gapSec"].includes(f)) v=+v;
  if(["showTitle","effects","showSub","sound","repeat","showLogo","showPlatform","showUser","hideAnon","showMessage","useAccStyle"].includes(f)&&t.type!=="checkbox") v=v==="1";
  if(f==="idle"){ v=[v,...((findW(d.wid)||{}).idle||[]).slice(1)].filter(Boolean) }
  if(t.type==="range"&&e.type==="change") return;
  if((t.tagName==="SELECT"||t.type==="number"||t.type==="checkbox")&&e.type==="input") return;
  w[f]=v;
  if(f==="w") w.x=clamp(w.x,0,1-w.w); if(f==="h") w.y=clamp(w.y,0,1-w.h);
  if((f==="w"||f==="h")&&w.pos!=="custom") applyPreset(w,w.pos,CV());
  const lab=document.getElementById("v_"+f); if(lab){ const cv=CV(); lab.textContent=f==="w"?Math.round(v*cv.w)+"px":f==="h"?Math.round(v*cv.h)+"px":["fontScale","avatarScale","opacity","logoScale"].includes(f)?Math.round(v*100)+"%":["enterMs","exitMs","delayMs"].includes(f)?v+"ms":f==="speed"?v+" px/ث":v }
  save(); pushLayout();
  if(S.page==="studio"){ refreshView(w); if(f==="name") renderLayers(); if(["design","topN","sortBy","showTitle","effects","timerId","mode","repeat","filter","order"].includes(f)) renderProps() }
  else if(t.tagName==="SELECT"||e.type==="change") renderPage(true);
  return }
 if(d.set&&e.type==="change"){ let v=t.value; if(d.set==="fx") v=v==="1"; if(d.set==="bigGift") v=+v; S.settings[d.set]=v; save(); return }
 if(d.prof&&e.type==="change"){ S.profile[d.prof]=t.value; save(); return renderPage() }
}
function setConn(){ [["cdot","ctext"]].forEach(([a,b])=>{const dd=document.getElementById(a),tt=document.getElementById(b); if(dd) dd.classList.toggle("ok",wsReady&&liveStatus.live); if(tt) tt.textContent=!wsReady?"وضع التجربة (بدون خادم)":liveStatus.live?"متصل ببث TikTok":"متصل بالخادم"}) }
function startWS(){ if(!S.settings.wsUrl) return toast("اكتب عنوان الخادم أولاً");
 S.wantWS=true; let n=0;
 const go=()=>connectWS(S.settings.wsUrl,S.settings.room,S.settings.key,m=>receive(m,false),(ok,err)=>{ setConn(); if(ok){ n=0; toast("تم الاتصال بالخادم"); pushLayout(); if(S.page==="live") renderPage(true) } else { if(err) toast(err); if(S.wantWS) setTimeout(()=>{ if(S.wantWS&&!wsReady) go() },Math.min(15000,1000*++n)) } });
 go() }

/* ================= التشغيل ================= */
(function(){
 const h=location.hash;
 if(h.startsWith("#/overlay")){ bootOverlay(new URLSearchParams(h.split("?")[1]||"")); return }
 shell(); renderPage();
 if(S.settings.wsUrl) startWS();
 window.__arsh={S,R:()=>R,send,L,SIM,clockOp};
})();
</script>
