# يبني مثبّت ويندوز لبطوط ستريم وينشره في GitHub Releases (يُشغَّل يدوياً أو عند وسم desktop-v*)
name: Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/windows-app.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: عنوان المنصة
        shell: pwsh
        run: |
          if ("${{ vars.APP_URL }}") { '{ "url": "${{ vars.APP_URL }}" }' | Set-Content config.json }
      - run: npm install
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-build-${{ github.run_number }}
          name: "B6O6 Streaming — Windows ${{ github.run_number }}"
          files: desktop/dist/B6O6-Streaming-Setup.exe
          make_latest: true
