# يبني مثبّت ويندوز لبطوط ستريم وينشره في GitHub Releases (يُشغَّل يدوياً أو عند وسم desktop-v*)
name: Windows app
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: عنوان المنصة
        shell: pwsh
        run: if ("${{ vars.APP_URL }}") { '{ "url": "${{ vars.APP_URL }}" }' | Set-Content config.json }
      - run: npm install
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-build-{0}', github.run_number) }}
          name: "B6O6 Streaming — Windows ${{ github.run_number }}"
          files: desktop/dist/B6O6-Streaming-Setup.exe
          make_latest: true
