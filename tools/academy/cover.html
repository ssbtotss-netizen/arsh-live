<!doctype html><html lang="ar" dir="ltr"><head><meta charset="utf-8"><style>
@font-face{font-family:Alx;src:url(fonts/Alexandria.ttf);font-weight:100 900}
@font-face{font-family:Plex;src:url(fonts/IBMPlexSansArabic-SemiBold.ttf);font-weight:600}
*{box-sizing:border-box}body{direction:rtl;margin:0;width:1080px;height:1920px;overflow:hidden;background:#04060c;color:#fff;font-family:Plex;position:relative}
.g1{position:absolute;pointer-events:none;width:1100px;height:1100px;border-radius:50%;background:#1546c9;filter:blur(160px);opacity:.45;left:-300px;top:-260px}
.g2{position:absolute;width:900px;height:900px;border-radius:50%;background:#2f7bff;filter:blur(170px);opacity:.22;right:-320px;bottom:-200px}
.top{position:absolute;top:150px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:22px}
.top img{width:150px}.wm{font:700 28px Alx;letter-spacing:.34em;color:#8794b4;direction:ltr}
.ep{position:absolute;top:470px;left:0;right:0;text-align:center}.ep span{font:700 30px Alx;color:#4d8dff;border:1px solid rgba(77,141,255,.5);background:rgba(47,123,255,.12);border-radius:999px;padding:10px 30px}
h1{position:absolute;top:560px;left:70px;right:70px;margin:0;text-align:center;font:800 104px/1.18 Alx}
h1 em{font-style:normal;color:#4d8dff}
.hk{position:absolute;top:var(--hk);left:90px;right:90px;text-align:center;font:600 42px/1.4 Plex;color:#b8c2dc}
.shot{position:absolute;left:90px;right:90px;bottom:330px;height:560px;perspective:1800px}
.shot div{width:100%;height:100%;border-radius:28px;overflow:hidden;transform:rotateX(14deg) rotateY(-8deg);box-shadow:0 60px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 40%)}
.pill{position:absolute;bottom:170px;left:0;right:0;text-align:center}.pill span{font:700 40px Alx;background:linear-gradient(180deg,#3d86ff,#1f5fe0);border-radius:999px;padding:20px 56px;box-shadow:0 18px 50px rgba(47,123,255,.35)}
</style></head><body><div style="position:absolute;inset:0;overflow:hidden"><div class="g1"></div><div class="g2"></div></div>
<div class="top"><img src="assets/logo.png"><div class="wm">B6O6 ACADEMY</div></div>
<div class="ep"><span id="ep"></span></div><h1 id="t"></h1><div class="hk" id="h"></div>
<div class="shot"><div><img id="img"></div></div><div class="pill"><span>تعلّم الميزة في 59 ثانية</span></div>
<script>window.__cover=(m)=>{ document.getElementById('ep').textContent='الحلقة '+String(m.num).padStart(2,'0'); const t=document.getElementById('t'); t.innerHTML=m.titleHtml;
 const h=document.getElementById('h'); h.textContent=m.hookPlain; h.style.setProperty('--hk',(560+t.offsetHeight+40)+'px'); document.getElementById('img').src=m.img; return new Promise(r=>{const i=document.getElementById('img'); if(i.complete) r(); else i.onload=r}) }</script></body></html>
